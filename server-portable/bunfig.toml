# Bun reads this file for any command run from server-portable/: CI's steps here,
# the scripts a suite spawns with this as their working directory, and
# package.json's scripts. With auto-install off, a package that does not
# resolve from an install fails the import instead of Bun fetching whatever npm
# serves (SMD-2978). Bun reads the working directory's file alone, not a
# parent's, so each directory CI runs a script from has one; check 44 of
# scripts/check-fork-consistency.ts holds them. `bun install` and `bunx` are
# unaffected.
[install]
auto = "disable"
