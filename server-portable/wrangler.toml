# Cloudflare Workers target.
#
# Secrets are NOT set here. Provide them with:
#   wrangler secret put MCP_ACCESS_KEY
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put OPENROUTER_API_KEY
# For local `wrangler dev`, copy .dev.vars.example to .dev.vars (gitignored).
name = "ob1-mcp"
main = "index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The store is a property of this target, not a secret: Workers cannot hold a
# Postgres connection, so the PostgREST store is the one path here — and since
# change 94 (SMD-1797) the server's DEFAULT is the SQL store, which would reach
# the stub below on the first request. Said here so a Workers deployment never
# depends on the default. Selecting `sql` on Workers is unsupported until a
# Workers-capable Postgres driver is measured (server-portable/README.md, Caveats).
[vars]
OB1_STORE = "postgrest"

# store-sql.ts imports Bun's Postgres client. Workers never selects that store
# (OB1_STORE above), but the bundler still has to resolve the specifier — map it
# to a stub that throws with an explanation if it is somehow reached.
[alias]
bun = "./shims/bun-unavailable.ts"
