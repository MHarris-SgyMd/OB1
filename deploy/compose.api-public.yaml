# The REST core in public, at /api on the stack's one origin (SMD-2284).
#
# Off by default: without this file the proxy answers /api with a bodyless
# 404 (compose.yaml's api-off router), and the REST core is reached only on
# the mesh, as api.ob1.internal. Naming this file is the operator's opt-in:
#
#   docker compose -f compose.yaml -f compose.api-public.yaml up -d
#
# It adds a second route file beside the base one in the proxy's directory
# provider: a router for /api (priority 36, over api-off's 35) that strips the
# prefix — so /api/v1/stats reaches the REST core as /v1/stats, with
# X-Forwarded-Prefix: /api, which the REST core puts back on the links it
# answers — and forwards to api.ob1.internal. No port, no authentication of
# its own: the key travels to the REST core in its header, and the REST core
# checks it (header keys only; never ?key=). Dropping the file and running
# `up -d` again recreates the proxy without it (the label below changes, which
# is what makes compose recreate; an inline config alone does not).

x-api-route: &api-route |
  http:
    routers:
      api-public:
        rule: "Path(`/api`) || PathPrefix(`/api/`)"
        priority: 36
        entryPoints: [web]
        middlewares: [api-strip]
        service: api
    middlewares:
      api-strip:
        stripPrefix:
          prefixes: ["/api"]
    services:
      api:
        loadBalancer:
          servers:
            - url: "http://api.ob1.internal.:8000"

services:
  proxy:
    configs:
      - source: proxy-api-route
        target: /etc/traefik/dynamic/api.yaml
    labels:
      ob1.proxy-api-route: *api-route
    depends_on:
      api:
        condition: service_started

configs:
  proxy-api-route:
    content: *api-route
