# The three-brain promotion pipeline as one stack (SMD-1806).
#
# Three brains over one corpus, each its own Postgres and its own two servers —
# the MCP server and the REST core (SMD-2284) — one shared Ollama, and one
# proxy in front, the stack's one published port, where each tier is a path
# (SMD-2294):
#
#   stable  (/mcp)         — the record, the only writer; rebuilt by db/ingest-records.ts.
#   canary  (/canary/mcp)  — main's shadow; refreshed from stable and migrated forward
#                            by db/tier.ts on every merge, then the query log is
#                            replayed and the ids diffed.
#   working (/working/mcp) — a per-worktree disposable copy of stable, migrated by
#                            the branch.
#
#   docker compose -f deploy/compose.tiers.yaml --profile local-models up --build
#   podman compose -f deploy/compose.tiers.yaml --profile local-models up --build
#
# Built from the checkout, like compose.yaml (a release pins the published images
# instead — deploy/README.md, "Pinning a release"). Secrets come from deploy/.env (gitignored); copy
# .env.example first. Each server's OB1_TIER falls back to its own tier, so leave
# OB1_TIER UNSET in deploy/.env for this stack — setting it would force all three
# tiers to the same tier. Everything else is forwarded exactly as compose.yaml
# forwards it (check 14 holds every OB1_* value to `${NAME}`/`${NAME:-default}`),
# via the anchors below so the tiers cannot drift.
#
# What the host can reach: the proxy alone, on 127.0.0.1:${SERVER_PORT:-8000}
# unless SERVER_BIND says otherwise (check 13, SMD-1844) — compose.yaml's knobs,
# since this stack stands in for it, and the two are not run on one port. The
# servers, the REST cores, the three Postgres services and Ollama publish
# nothing. Each server reaches its own database by service name on the compose
# network, and db/tier.ts reaches them the same way through deploy/tier.sh
# --network open-brain-tiers_default (SMD-2036). The proxy reaches the servers
# on the internal `mesh` network by name — mcp.ob1.internal, the stable tier's
# as in compose.yaml, and mcp.canary.ob1.internal, mcp.working.ob1.internal —
# never by service name. The REST cores answer there as api.ob1.internal,
# api.canary.ob1.internal and api.working.ob1.internal, and nothing public
# routes to them.

name: open-brain-tiers

# The proxy's route table, inline as compose.yaml's is (and for the same
# reasons: one file to ship, a label copy so a changed route recreates the
# proxy). A request's path reaches its server as it came: the server answers
# POST at every path and /health under any prefix.
#   stable   /mcp and everything under it — the stable tier's server;
#   canary, working  /canary/mcp and /working/mcp and everything under each;
#   tier-off every other path starting with /canary or /working, in any case:
#            a bare 404, never another tier's server;
#   health   GET, HEAD and OPTIONS /health at the origin root — stable's.
# A tier that is stopped or still starting is a bare 404 (`tier-absent`, 502
# rewritten). No route answers the root, /.well-known or /api: this stack has
# no legacy window (SMD-2306), no authorization server and no public REST
# path, so each is Traefik's own 404, and a tier is reached with keys.
x-tier-routes: &tier-routes |
  http:
    routers:
      stable:
        rule: "Path(`/mcp`) || PathPrefix(`/mcp/`)"
        priority: 30
        entryPoints: [web]
        middlewares: [not-legacy]
        service: stable
      canary:
        rule: "Path(`/canary/mcp`) || PathPrefix(`/canary/mcp/`)"
        priority: 30
        entryPoints: [web]
        middlewares: [not-legacy, tier-absent]
        service: canary
      working:
        rule: "Path(`/working/mcp`) || PathPrefix(`/working/mcp/`)"
        priority: 30
        entryPoints: [web]
        middlewares: [not-legacy, tier-absent]
        service: working
      tier-off:
        rule: "PathRegexp(`(?i)^/(canary|working)`)"
        priority: 25
        entryPoints: [web]
        middlewares: [not-served]
        service: noop@internal
      health:
        rule: "(Path(`/health`) || Path(`/health/`)) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))"
        priority: 20
        entryPoints: [web]
        middlewares: [not-legacy]
        service: stable
    middlewares:
      # compose.yaml's marker for the root URL's window, which this stack does
      # not have: deleted, so a client cannot have a key logged as a straggler.
      not-legacy:
        headers:
          customRequestHeaders:
            X-OB1-Legacy-Route: ""
      tier-absent:
        errors:
          status: ["502"]
          service: noop@internal
          statusRewrites:
            "502": 404
      not-served:
        errors:
          status: ["418"]
          service: noop@internal
          statusRewrites:
            "418": 404
    services:
      stable:
        loadBalancer:
          servers:
            - url: "http://mcp.ob1.internal.:8000"
      canary:
        loadBalancer:
          servers:
            - url: "http://mcp.canary.ob1.internal.:8000"
      working:
        loadBalancer:
          servers:
            - url: "http://mcp.working.ob1.internal.:8000"

# The server environment every tier shares — a copy of compose.yaml's server
# block minus DATABASE_URL and OB1_TIER, which are per-tier below, where each
# tier's server and REST core take one block. Held to the same house form
# (check 14): each OB1_* value is `${NAME}` or `${NAME:-default}`.
x-server-env: &server-env
  MCP_ACCESS_KEYS: ${MCP_ACCESS_KEYS:?set MCP_ACCESS_KEYS in deploy/.env — mint with server-portable/keygen.ts}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
  OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
  OB1_TRGM_INDEX: ${OB1_TRGM_INDEX:-}
  OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
  OB1_CHUNK_TOKENS: ${OB1_CHUNK_TOKENS:-}
  OB1_CHUNK_OVERLAP: ${OB1_CHUNK_OVERLAP:-}
  OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
  OB1_LLM_API_KEY: ${OB1_LLM_API_KEY:-}
  OB1_CHAT_BASE_URL: ${OB1_CHAT_BASE_URL:-}
  OB1_CHAT_API_KEY: ${OB1_CHAT_API_KEY:-}
  OB1_JUDGE_MODEL: ${OB1_JUDGE_MODEL:-}
  OB1_LLM_TIMEOUT: ${OB1_LLM_TIMEOUT:-}
  OB1_EGRESS_POLICY: ${OB1_EGRESS_POLICY:-}
  OB1_EGRESS_ALLOW: ${OB1_EGRESS_ALLOW:-}
  OB1_EGRESS_DENY: ${OB1_EGRESS_DENY:-}
  OB1_LLM_LOCAL: ${OB1_LLM_LOCAL:-}
  OB1_CHAT_LOCAL: ${OB1_CHAT_LOCAL:-}
  # Both model calls go to the shared Ollama by default — the `ollama` service in
  # this file, the name check 14 holds this fallback to (db/config.mjs's
  # LOCAL_PROVIDER_SERVICES).
  OB1_LLM_BASE_URL: ${OB1_LLM_BASE_URL:-http://ollama:11434/v1}
  OB1_METADATA_MODEL: ${OB1_METADATA_MODEL:-}
  OB1_METADATA_TEMPERATURE: ${OB1_METADATA_TEMPERATURE:-}
  OB1_METADATA_REASONING: ${OB1_METADATA_REASONING:-}
  OB1_QUERY_LOG: ${OB1_QUERY_LOG:-}
  OB1_QUERY_LOG_RETENTION_DAYS: ${OB1_QUERY_LOG_RETENTION_DAYS:-}
  OB1_AGENT_CACHE_TTL_MS: ${OB1_AGENT_CACHE_TTL_MS:-}
  OPEN_BRAIN_CITATION_BASE_URL: ${OPEN_BRAIN_CITATION_BASE_URL:-}
  OB1_PG_POOL: ${OB1_PG_POOL:-}
  OB1_STOP_GRACE: ${OB1_STOP_GRACE:-}
  PORT: "8000"

# The migrate one-shot's environment, minus its per-tier DATABASE_URL — the schema
# contract every tier is built under (must match db/config.mjs, as compose.yaml).
x-migrate-env: &migrate-env
  OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
  OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
  OB1_TRGM_INDEX: ${OB1_TRGM_INDEX:-}
  OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
  OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
  OB1_BACKFILL_LIMIT: ${OB1_BACKFILL_LIMIT:-}

# One Postgres per tier — pinned as compose.yaml pins it, no published port, its
# own volume so the three brains are genuinely separate corpora.
x-tier-postgres: &tier-postgres
  image: pgvector/pgvector:0.8.6-pg16
  shm_size: ${POSTGRES_SHM_SIZE:-1g}
  environment:
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    POSTGRES_DB: openbrain
    POSTGRES_USER: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d openbrain"]
    interval: 5s
    timeout: 5s
    retries: 12

# The migrator image compose.yaml builds (db/Dockerfile — the ob1-migrate image
# the release job publishes, SMD-1860), one build shared by the three tiers.
x-tier-migrate: &tier-migrate
  build:
    context: ..
    dockerfile: db/Dockerfile
  restart: "no"

# The Ollama image, one anchor as in compose.yaml and held equal to its pin by
# scripts/release-artifacts.ts (a rehearsal runs on every PR touching deploy/).
x-ollama-image: &ollama-image ollama/ollama:0.34.3

services:
  # ── stable ─────────────────────────────────────────────────────────────────
  stable-postgres:
    <<: *tier-postgres
    volumes:
      - stable-pgdata:/var/lib/postgresql/data

  stable-migrate:
    <<: *tier-migrate
    environment:
      <<: *migrate-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@stable-postgres:5432/openbrain
    depends_on:
      stable-postgres:
        condition: service_healthy

  # The stable tier's MCP server, named so its REST core runs this image by name.
  stable-server:
    image: ${COMPOSE_PROJECT_NAME:-open-brain-tiers}-stable-server
    pull_policy: never
    build:
      context: ..
      dockerfile: server-portable/Dockerfile
      args:
        OB1_GIT_SHA: ${OB1_GIT_SHA:-unknown}
    environment: &stable-env
      <<: *server-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@stable-postgres:5432/openbrain
      OB1_TIER: ${OB1_TIER:-stable}
    depends_on:
      stable-postgres:
        condition: service_healthy
      stable-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${OB1_STOP_GRACE:-10}s
    networks:
      default: {}
      mesh:
        aliases: [mcp.ob1.internal]

  # The stable tier's REST core (SMD-2284): the server's image run as `bun api.ts`, with
  # the server's environment. Reached on the mesh alone; nothing public routes
  # to it.
  stable-api:
    image: ${COMPOSE_PROJECT_NAME:-open-brain-tiers}-stable-server
    pull_policy: never
    command: ["api.ts"]
    environment: *stable-env
    depends_on:
      stable-postgres:
        condition: service_healthy
      stable-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${OB1_STOP_GRACE:-10}s
    networks:
      default: {}
      mesh:
        aliases: [api.ob1.internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── canary ─────────────────────────────────────────────────────────────────
  canary-postgres:
    <<: *tier-postgres
    volumes:
      - canary-pgdata:/var/lib/postgresql/data

  canary-migrate:
    <<: *tier-migrate
    environment:
      <<: *migrate-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@canary-postgres:5432/openbrain
    depends_on:
      canary-postgres:
        condition: service_healthy

  # The canary tier's MCP server, named so its REST core runs this image by name.
  canary-server:
    image: ${COMPOSE_PROJECT_NAME:-open-brain-tiers}-canary-server
    pull_policy: never
    build:
      context: ..
      dockerfile: server-portable/Dockerfile
      args:
        OB1_GIT_SHA: ${OB1_GIT_SHA:-unknown}
    environment: &canary-env
      <<: *server-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@canary-postgres:5432/openbrain
      OB1_TIER: ${OB1_TIER:-canary}
    depends_on:
      canary-postgres:
        condition: service_healthy
      canary-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${OB1_STOP_GRACE:-10}s
    networks:
      default: {}
      mesh:
        aliases: [mcp.canary.ob1.internal]

  # The canary tier's REST core (SMD-2284): the server's image run as `bun api.ts`, with
  # the server's environment. Reached on the mesh alone; nothing public routes
  # to it.
  canary-api:
    image: ${COMPOSE_PROJECT_NAME:-open-brain-tiers}-canary-server
    pull_policy: never
    command: ["api.ts"]
    environment: *canary-env
    depends_on:
      canary-postgres:
        condition: service_healthy
      canary-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${OB1_STOP_GRACE:-10}s
    networks:
      default: {}
      mesh:
        aliases: [api.canary.ob1.internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── working ────────────────────────────────────────────────────────────────
  working-postgres:
    <<: *tier-postgres
    volumes:
      - working-pgdata:/var/lib/postgresql/data

  working-migrate:
    <<: *tier-migrate
    environment:
      <<: *migrate-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@working-postgres:5432/openbrain
    depends_on:
      working-postgres:
        condition: service_healthy

  # The working tier's MCP server, named so its REST core runs this image by name.
  working-server:
    image: ${COMPOSE_PROJECT_NAME:-open-brain-tiers}-working-server
    pull_policy: never
    build:
      context: ..
      dockerfile: server-portable/Dockerfile
      args:
        OB1_GIT_SHA: ${OB1_GIT_SHA:-unknown}
    environment: &working-env
      <<: *server-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@working-postgres:5432/openbrain
      OB1_TIER: ${OB1_TIER:-working}
    depends_on:
      working-postgres:
        condition: service_healthy
      working-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${OB1_STOP_GRACE:-10}s
    networks:
      default: {}
      mesh:
        aliases: [mcp.working.ob1.internal]

  # The working tier's REST core (SMD-2284): the server's image run as `bun api.ts`, with
  # the server's environment. Reached on the mesh alone; nothing public routes
  # to it.
  working-api:
    image: ${COMPOSE_PROJECT_NAME:-open-brain-tiers}-working-server
    pull_policy: never
    command: ["api.ts"]
    environment: *working-env
    depends_on:
      working-postgres:
        condition: service_healthy
      working-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${OB1_STOP_GRACE:-10}s
    networks:
      default: {}
      mesh:
        aliases: [api.working.ob1.internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── the proxy ────────────────────────────────────────────────────────────
  # The stack's one published port, and compose.yaml's proxy in every setting
  # but its route table: the same pinned image (CI holds the two equal), the
  # same unprivileged user, access log without query or header, and ping
  # entrypoint. It does no authentication; each server checks the key.
  proxy:
    image: docker.io/library/traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8000"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY: delete
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/dynamic
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_ACCESSLOG_FORMAT: json
      TRAEFIK_ACCESSLOG_FIELDS_QUERYPARAMETERS_DEFAULTMODE: drop
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_DEFAULTMODE: drop
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_CLIENTUSERNAME: drop
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: ping
      TRAEFIK_ENTRYPOINTS_PING_ADDRESS: "127.0.0.1:8082"
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
    configs:
      - source: tier-routes
        target: /etc/traefik/dynamic/routes.yaml
    labels:
      ob1.proxy-routes: *tier-routes
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-8000}:8000"
    # The default network, where the port is published, and the mesh, where
    # it reaches each tier's server by name; no search domains, so an absent
    # name is never looked for under the host's.
    networks: [default, mesh]
    dns_search: ["."]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      stable-server:
        condition: service_started
      canary-server:
        condition: service_started
      working-server:
        condition: service_started
      stable-api:
        condition: service_started
      canary-api:
        condition: service_started
      working-api:
        condition: service_started
    restart: unless-stopped

  # ── the shared model provider ────────────────────────────────────────────
  # One Ollama for all three tiers (the cost SMD-1806 contains — one model server,
  # three brains). Optional, enabled with `--profile local-models`; the
  # servers' and REST cores' OB1_LLM_BASE_URL falls back to it by name — and
  # since SMD-1875 each one's preflight dials that name once and refuses to
  # start without the profile or a base URL of its own in deploy/.env.
  ollama:
    image: *ollama-image
    profiles: ["local-models"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: *ollama-image
    profiles: ["local-models"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OB1_JUDGE_MODEL: ${OB1_JUDGE_MODEL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
        ollama pull ${OB1_METADATA_MODEL:-qwen2.5:7b}
        [ -z "$$OB1_JUDGE_MODEL" ] || ollama pull "$$OB1_JUDGE_MODEL"
    restart: "no"

volumes:
  stable-pgdata:
  canary-pgdata:
  working-pgdata:
  ollama:

networks:
  # The internal network the proxy reaches the tiers' servers on, and where
  # their REST cores answer; no route out.
  mesh:
    internal: true

configs:
  # The proxy's route table, inline: x-tier-routes above.
  tier-routes:
    content: *tier-routes
