# A complete Open Brain stack with no Supabase anywhere.
#
# This is the migration plan's Phase 4 exit test made literal: a change reaches a
# running system through an ordinary pipeline, with no Supabase CLI installed and
# no supabase.com account involved. Postgres, the schema, and the MCP server.
#
#   podman compose -f deploy/compose.yaml up --build
#   docker compose -f deploy/compose.yaml up --build
#
# Then point an MCP client at http://localhost:8000/?key=$MCP_ACCESS_KEY
#
# Secrets come from deploy/.env, which is gitignored. Copy .env.example first.
# Nothing here is production-shaped — no TLS, no backups, no resource limits — it
# is a working reference for what the pieces are once Supabase is gone.

name: open-brain

services:
  # Replaces: the Supabase-hosted Postgres.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for psql and pg_dump during a migration. Drop this in production.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openbrain"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Replaces: pasting SQL into the Supabase dashboard's SQL editor.
  # Runs to completion, then exits. The server waits for it.
  migrate:
    image: oven/bun:1.4.0-alpine
    working_dir: /app
    volumes:
      - ../db:/app:ro
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      # The vector width is baked into the schema here and cannot change later
      # without re-embedding. migrate.ts refuses a model/width mismatch.
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1536}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-openai/text-embedding-3-small}
    # No `bun install`: migrate.ts imports only Bun built-ins and node: modules.
    # The one dependency in db/package.json is pglite, used solely by the tests.
    # This also keeps the mount read-only — `bun install` would need to write
    # node_modules into it, which fails on a clean checkout.
    command: ["bun", "migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Replaces: the Supabase Edge Function, and `supabase functions deploy`.
  server:
    build:
      context: ../server-portable
      dockerfile: Dockerfile
    environment:
      OB1_STORE: sql
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      MCP_ACCESS_KEYS: ${MCP_ACCESS_KEYS:?set MCP_ACCESS_KEYS in deploy/.env — mint with server-portable/keygen.ts}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in deploy/.env}
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1536}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      OPEN_BRAIN_CITATION_BASE_URL: ${OPEN_BRAIN_CITATION_BASE_URL:-}
      OB1_PG_POOL: ${OB1_PG_POOL:-10}
      PORT: "8000"
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
