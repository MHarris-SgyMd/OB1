# A complete Open Brain stack with no Supabase anywhere.
#
# This is the migration plan's Phase 4 exit test made literal: a change reaches a
# running system through an ordinary pipeline, with no Supabase CLI installed and
# no supabase.com account involved. Postgres, the schema, and the MCP server.
#
#   podman compose -f deploy/compose.yaml --profile local-models up --build
#   docker compose -f deploy/compose.yaml --profile local-models up --build
#
# The profile is the stack's own Ollama, where the server's model endpoint
# defaults; drop it when deploy/.env names another provider.
#
# Then point an MCP client at http://127.0.0.1:8000/mcp?key=<your key>
#
# Secrets come from deploy/.env, which is gitignored. Copy .env.example first.
# Nothing here is production-shaped — no TLS, no backups, no resource limits — it
# is a working reference for what the pieces are once Supabase is gone.
#
# What the host can reach: only the proxy (and n8n, under --profile
# orchestration), and only from the host itself; the authorization server
# (--profile auth) publishes nothing. The proxy is the stack's one
# origin: each service is a path on it (`/mcp` the server), not a port of its
# own (SMD-1846). Every
# published port here names its address, `127.0.0.1` unless the operator sets
# the `*_BIND` knob, because an address-less `"8000:8000"` binds 0.0.0.0 — every
# interface — and this stack holds a brain (personal data at rest) behind one
# password and one key over plain HTTP. Postgres, Ollama and the server publish
# nothing; the proxy reaches the server by its name on the mesh network, the
# server reaches Postgres on the internal `data` network and Ollama on `egress`
# by service name (the networks at the end of this file), and a tool run from
# a checkout gets them through compose.host-ports.yaml (a second -f),
# loopback again unless told otherwise. scripts/check-fork-consistency.ts
# check 13 refuses a mapping that drops the address (SMD-1844).

name: open-brain

# The one place the Ollama image is named: the model server and the pull job
# below run the same image, so a bump is one edit (the fork's recurring defect
# is a value defined twice). Pinned to a release, not `:latest`, for the reason
# postgres is: a floating tag moves under a working deployment. The release job
# resolves this tag to a digest and writes `ollama/ollama@sha256:…` into the
# release's compose overlay (SMD-1860; deploy/README.md, "Pinning a release").
x-ollama-image: &ollama-image ollama/ollama:0.34.3

# Every service's log, bounded (SMD-1849): the json-file driver, rotated at
# 10 MB with three files kept — at most 30 MB per container, where Docker's
# default is one file that grows until the disk is full. Podman reads the same
# keys as its k8s-file driver, and keeps one file: at max-size it truncates
# rather than rotates, so the bound holds and the older lines go (measured on
# podman 6.0.2; max-file is accepted and has no effect there). Every service
# below names it, and check 29 of scripts/check-fork-consistency.ts holds
# that, so a service added without it fails CI; compose.tiers.yaml carries the
# same, as check 27 holds it to this file.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The plugins' knobs (SMD-2310), merged by the MCP server and the REST core
# alone: the workers merge the server's block, and none of them runs a plugin
# or needs the plugin login role's password. The migrator forwards its own.
x-plugin-env: &plugin-env
  # The plugins the brain runs: names from plugins/registry.ts,
  # comma-separated; unset, none. Both servers serve the same set; preflight
  # refuses a name that is no plugin. The three-tier stack leaves it out
  # (check 27's TIER_OMITTED_ENV).
  OB1_PLUGINS: ${OB1_PLUGINS:-}
  # The password of ob1_plugins, the login role every plugin's SQL runs on:
  # the plugins' pools log in with it, never as postgres.
  OB1_PLUGIN_DB_PASSWORD: ${OB1_PLUGIN_DB_PASSWORD:-}

# The plugins' webhooks (SMD-2310), merged by the REST core alone, which
# serves them: the plugins OB1_HOOKS names and the secrets OB1_HOOK_SECRETS
# gives each. The proxy reaches /hooks only with compose.hooks-public.yaml.
x-hook-env: &hook-env
  OB1_HOOKS: ${OB1_HOOKS:-}
  OB1_HOOK_SECRETS: ${OB1_HOOK_SECRETS:-}

# The proxy's route table (SMD-1846), which Traefik's file provider reads. It
# lives here rather than in a file of its own because compose.yaml is the file
# a release ships (scripts/release-artifacts.ts, ASSETS): a pinned stack on a
# machine with no checkout has it with nothing else to fetch.
#
# Not container labels read through the engine's socket, which the ticket
# first proposed: the socket is root on the host, and the proxy is the one
# process a client on the network reaches — docs/orchestration-tool.md declined
# the same socket for n8n. So adding a service is two edits in this file, the
# service and its router here, and in check 28 of
# scripts/check-fork-consistency.ts its router in PROXY_ROUTE_TABLE, which
# holds this table byte for byte, its mesh name in SERVICE_NETWORKS, which
# holds who answers to each name, and its keys, mounts, build, confinement and
# named volumes in SERVICE_KEYS, SERVICE_MOUNTS, SERVICE_BUILDS, CONFINEMENT
# and COMPOSE_VOLUMES; the proxy itself is PROXY_SERVICE there (SMD-2685).
#
# A request's path reaches the server as it came (no prefix stripped): the
# server answers POST at every path and /health under any prefix
# (server-portable/index.ts, HEALTH_PATH), so `/mcp` needs no setting there.
# The routers, highest priority first, each on the one public entrypoint
# (`web`): a router that names none is on every entrypoint, the ping one
# included, and so would be any entrypoint added later:
#   auth    /auth and everything under it, and the authorization server's
#           three discovery documents outside it — RFC 8414's
#           /.well-known/oauth-authorization-server/auth, OIDC's
#           /.well-known/openid-configuration/auth, and the bare
#           /.well-known/oauth-authorization-server, the one Claude Code
#           reads (anthropics/claude-code issue 95270) — to the `auth` service
#           as auth.ob1.internal on `mesh` (SMD-2285, which serves all of
#           them itself). Only while it answers: its profile off, stopped or
#           still starting, the name does not resolve or nothing listens,
#           Traefik's 502 is rewritten to a bare 404 (`auth-absent`), so an
#           origin without the authorization server says "no OAuth here" as
#           it did before (ADR decision 16: not configured is keys only; the
#           server itself refuses to start unless deploy/.env configures it,
#           auth/config.ts). Its other answers pass untouched, its 503 at the
#           registration cap with its Retry-After included (measured on
#           v3.7.13). The name is written rooted, and the proxy has no search
#           domains, so an absent server is never looked for under the host's
#           (the proxy's dns_search);
#   resource the MCP server's protected-resource document,
#           /.well-known/oauth-protected-resource/mcp (RFC 9728), to the
#           server, which serves it only while the stack is configured, the
#           request's Host is the origin's and the authorization server
#           answers it on the mesh, and answers 404 otherwise (SMD-2382;
#           server-portable/oauth-edge.ts). A server that is down is
#           `auth-absent`'s 404 too, never a 502 a connector could read as
#           "OAuth here";
#   oauth-fallback-off  /register, /authorize and /token at the origin root:
#           a bare 404 (`not-served`). An MCP client that finds the document
#           but no authorization-server metadata registers and signs in at the
#           issuer's root, and the legacy route would hand that POST to the
#           MCP server, whose 200 envelope the client cannot read (SMD-2382
#           review). The authorization server's own are under /auth;
#   api-off /api and everything under it. Unless the operator names
#           deploy/compose.api-public.yaml, whose router (priority 36) wins
#           over this one (SMD-2284), a bare 404 (`api-off`) rather than the
#           legacy route, where the MCP server takes a POST at every path;
#   hooks-off  /hooks and everything under it: a bare 404 (`not-served`), so
#           a delivery to a plugin's webhook never falls to the legacy route
#           and the MCP server, until the operator names
#           deploy/compose.hooks-public.yaml, whose router (priority 36) takes
#           it to the REST core (SMD-2310);
#   mcp     /mcp and everything under it — the endpoint clients are given;
#   canary, working  /canary/mcp and /working/mcp and everything under each
#           — that tier's MCP server (SMD-2294), mcp.canary.ob1.internal or
#           mcp.working.ob1.internal on `mesh`, where a tier stood up as a
#           compose project of its own joins this stack's mesh under that
#           name. Only while it answers: with no such tier, or one stopped
#           or still starting, Traefik's 502 becomes a bare 404
#           (`tier-absent`), as auth-absent does for the authorization
#           server. The tiers' protected-resource paths are not routed, so
#           a tier is reached with keys (OAuth per tier is SMD-2286's);
#   tier-off every other path that starts with /canary or /working, in
#           any case and whatever follows: a bare 404 (`not-served`), so a
#           client handed a tier's URL changed in any way after the prefix
#           (its case, an escaped slash, a pasted invisible space) never
#           reaches this stack's server by the legacy route, to write with
#           the same key (a typo of the prefix itself, `/canry/mcp`, still
#           does until SMD-2532). No boundary after the prefix: each one
#           tried left some character through (SMD-2294 review passes 2-4),
#           and nothing this stack serves starts with either word;
#   health  GET, HEAD and OPTIONS /health at the origin root, for a GET-only
#           probe and a browser's CORS preflight;
#   legacy  everything but /.well-known — what clients reach today at the root
#           (`POST /?key=`, /worker-status, /jobs/<id>, and
#           `GET /`, whose 405 an MCP SDK client takes as "no stream here";
#           the proxy's 404 there made v1 and v2 clients report an error on
#           every connect, measured), kept so the upgrade that lands the proxy
#           breaks no configured client. Its window (SMD-2306): every answer
#           carries a Deprecation header and a Link to the upgrade guide, and
#           the server names each key still on it; it closes with v2.0.0,
#           when SMD-2532 removes it and `/` is the proxy's 404 too.
# No router matches /.well-known or anything under it but the auth router's
# three and the resource router's one, so the proxy answers the rest 404
# itself and the server never sees them: a claude.ai connector at
# https://host/mcp asks /.well-known/oauth-protected-resource/mcp at the
# origin root, and proceeds on the key only on a 404 (SMD-1246, FORK.md
# change 42) — the server's 404 there, unless OAuth is advertised (SMD-2382).
# Traefik matches the cleaned, decoded path, so `//.well-known/`,
# `/%2ewell-known/` and `/x/../.well-known/` are refused too (measured on
# v3.7.13) — all but an encoded slash, which it leaves encoded:
# `/.well-known%2Fx` reaches the server's 405, as it did before the proxy, and
# no discovery client sends it. Its 404 carries
# none of the server's CORS headers; the SDK's discovery reads a CORS failure
# as a 404 and goes on. The resource router's 404 is the server's, with them,
# while the server is up; with it down, auth-absent's bare 404 has none.
# The middlewares:
#   legacy-window  marks the request for the server, which logs each key
#           name still on the root once (X-OB1-Legacy-Route, set, so a
#           client's own value is replaced), and adds to every answer a
#           Deprecation header (RFC 9745) dated 2026-10-02 and a Link to the
#           upgrade guide;
#   not-legacy  deletes that marker (an empty value deletes the header), so a
#           client cannot send it on /mcp and be logged as a straggler;
#   auth-absent, tier-absent  any 502 — Traefik's own: no such name, nothing
#           listening, or a request the server dropped mid-flight, as its
#           registration stall does at 30 s; the server never answers 502
#           itself — is answered by noop@internal and becomes a 404 with no
#           body. The server's 500, 503 and 504 are its answers and are left
#           alone (measured);
#   api-off, not-served  noop@internal's 418 becomes the 404 a path nothing
#           serves gets (measured on this pin).
# Every backend is dialled by its mesh name, written rooted. Not `server`:
# compose gives each container its service name as an alias on every network
# it joins, so a tier of another project on this mesh (SMD-2294) would answer
# to `server` beside this stack's.
# The table holds no comment of its own: Traefik renders it as a Go template
# first, so a comment line there is not inert, and check 28
# (scripts/check-fork-consistency.ts, PROXY_ROUTE_TABLE) holds it byte for
# byte (SMD-2658).
x-proxy-routes: &proxy-routes |
  http:
    routers:
      auth:
        rule: "Path(`/auth`) || PathPrefix(`/auth/`) || Path(`/.well-known/oauth-authorization-server/auth`) || Path(`/.well-known/openid-configuration/auth`) || Path(`/.well-known/oauth-authorization-server`)"
        priority: 40
        entryPoints: [web]
        middlewares: [auth-absent]
        service: auth
      resource:
        rule: "Path(`/.well-known/oauth-protected-resource/mcp`)"
        priority: 40
        entryPoints: [web]
        middlewares: [not-legacy, auth-absent]
        service: server
      oauth-fallback-off:
        rule: "Path(`/register`) || Path(`/authorize`) || Path(`/token`)"
        priority: 35
        entryPoints: [web]
        middlewares: [not-served]
        service: noop@internal
      api-off:
        rule: "Path(`/api`) || PathPrefix(`/api/`)"
        priority: 35
        entryPoints: [web]
        middlewares: [api-off]
        service: noop@internal
      hooks-off:
        rule: "Path(`/hooks`) || PathPrefix(`/hooks/`)"
        priority: 35
        entryPoints: [web]
        middlewares: [not-served]
        service: noop@internal
      mcp:
        rule: "Path(`/mcp`) || PathPrefix(`/mcp/`)"
        priority: 30
        entryPoints: [web]
        middlewares: [not-legacy]
        service: server
      canary:
        rule: "Path(`/canary/mcp`) || PathPrefix(`/canary/mcp/`)"
        priority: 30
        entryPoints: [web]
        middlewares: [not-legacy, tier-absent]
        service: canary
      working:
        rule: "Path(`/working/mcp`) || PathPrefix(`/working/mcp/`)"
        priority: 30
        entryPoints: [web]
        middlewares: [not-legacy, tier-absent]
        service: working
      tier-off:
        rule: "PathRegexp(`(?i)^/(canary|working)`)"
        priority: 25
        entryPoints: [web]
        middlewares: [not-served]
        service: noop@internal
      health:
        rule: "(Path(`/health`) || Path(`/health/`)) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))"
        priority: 20
        entryPoints: [web]
        middlewares: [not-legacy]
        service: server
      legacy:
        rule: "!(Path(`/.well-known`) || PathPrefix(`/.well-known/`))"
        priority: 1
        entryPoints: [web]
        middlewares: [legacy-window]
        service: server
    middlewares:
      legacy-window:
        headers:
          customRequestHeaders:
            X-OB1-Legacy-Route: "1"
          customResponseHeaders:
            Deprecation: "@1790899200"
            Link: '<https://github.com/MHarris-SgyMd/OB1/blob/main/deploy/README.md#moving-a-client-to-mcp>; rel="deprecation"; type="text/html"'
      not-legacy:
        headers:
          customRequestHeaders:
            X-OB1-Legacy-Route: ""
      auth-absent:
        errors:
          status: ["502"]
          service: noop@internal
          statusRewrites:
            "502": 404
      tier-absent:
        errors:
          status: ["502"]
          service: noop@internal
          statusRewrites:
            "502": 404
      api-off:
        errors:
          status: ["418"]
          service: noop@internal
          statusRewrites:
            "418": 404
      not-served:
        errors:
          status: ["418"]
          service: noop@internal
          statusRewrites:
            "418": 404
    services:
      server:
        loadBalancer:
          servers:
            - url: "http://mcp.ob1.internal.:8000"
      canary:
        loadBalancer:
          servers:
            - url: "http://mcp.canary.ob1.internal.:8000"
      working:
        loadBalancer:
          servers:
            - url: "http://mcp.working.ob1.internal.:8000"
      auth:
        loadBalancer:
          servers:
            - url: "http://auth.ob1.internal.:3000"

services:
  # Replaces: the Supabase-hosted Postgres.
  #
  # Pinned to a pgvector release, not the floating `pg16` tag. Migration 014
  # declares `hnsw.iterative_scan` on match_thoughts, which exists from pgvector
  # 0.8.0; on an older image the migrator fails on 014 and the stack does not
  # start. A floating tag could also move under a working deployment. Change
  # the pin deliberately and re-run the schema tests against it.
  #
  # Memory: 014 seeds hnsw.scan_mem_multiplier = 8 on the database, so a
  # filtered search that reaches the HNSW walk may use work_mem x 8 (32 MB at
  # the 4 MB default) per scan node, two per call, per connection — up to
  # ~640 MB across the server's default pool of ten on top of shared_buffers.
  # Thin filters never walk (they are answered exactly), so this is a ceiling
  # for broad filters on large tables; lower the multiplier with ALTER DATABASE
  # where memory is tighter than latency (deploy/.env.example has the form).
  #
  # No random_page_cost here. It was measured as the cost-model remedy for the
  # planner preferring a sequential scan over the HNSW index at the shipped
  # width (upstream #469): the estimate omits the detoast reads a vector table
  # pays, so no constant fixes it. Migration 019 puts the setting on the
  # function instead, where it travels with the schema; its header has the numbers.
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    # /dev/shm: a container gets 64 MB, and a parallel HNSW build keeps its
    # whole graph in dynamic shared memory there, sized by maintenance_work_mem
    # — so rebuilding the vector index after a bulk load of a real corpus fails
    # with "could not resize shared memory segment ... No space left on device"
    # under the default (SMD-1018 met it at a million rows). A tmpfs cap,
    # backed only as used; raise it with maintenance_work_mem, or build with
    # max_parallel_maintenance_workers = 0, which uses ordinary backend memory.
    shm_size: ${POSTGRES_SHM_SIZE:-1g}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:`. The superuser on the whole brain, guarded by POSTGRES_PASSWORD
    # alone, is not published to the host by default — the mapping this used to
    # carry bound 0.0.0.0, so a LAN peer reached it on the password. The server
    # and the migrator reach it as `postgres:5432` on the `data` network. For
    # psql or pg_dump: `compose exec postgres psql -U postgres openbrain` (with
    # the -f files the stack runs with). For a tool run from a checkout
    # (reembed.ts, extract-entities.ts, consolidate.ts, the evals): add
    # `-f compose.host-ports.yaml`, which publishes it on loopback — chosen when
    # the stack comes up, since adding or dropping it later recreates this
    # container and, through depends_on, the server (SMD-1844; deploy/README.md,
    # "What is reachable from where").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openbrain"]
      interval: 5s
      timeout: 5s
      retries: 12
    # `data` alone: internal, so no route out, and joined only by what
    # connects to the database (SMD-2583). Not the mesh, which a tier of
    # another project joins (compose.canary.yaml): compose names each
    # container by its service name on every network it joins, and there
    # `postgres` would answer that tier's server too, which then had only
    # its own password (deploy/canary.sh's env file) between it and this
    # database.
    networks: [data]
    logging: *logging

  # Replaces: pasting SQL into the Supabase dashboard's SQL editor.
  # Runs to completion, then exits. The server waits for it.
  #
  # Built from db/Dockerfile — the ob1-migrate image the release job publishes
  # per tag beside ob1-server (SMD-1860) — rather than run off a read-only mount
  # of the checkout's db/ on a stock Bun image, so a release's compose overlay
  # pulls the migrator that wrote the schema_version its server checks, on a
  # machine with no checkout, and this stack and a pinned one run the same
  # bytes. Root context, as server's: migrate.ts imports db/config.mjs, and the
  # root .dockerignore keeps the context to what the two images need.
  migrate:
    # Named, so orchestration-runner-role finds it by one name under every
    # compose (the Python podman-compose and --compatibility name a build
    # <project>_migrate); never pulled, so `pull` skips it and `up` builds it
    # rather than ask a registry for a name no registry holds (SMD-2289 review
    # pass 8) — `up --pull always` still asks, is denied, and builds (measured,
    # SMD-2284). The release overlay pulls its pinned migrator instead.
    image: ${COMPOSE_PROJECT_NAME:-open-brain}-migrate
    pull_policy: never
    build:
      context: ..
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      # The vector width is baked into the schema here and cannot change later
      # without re-embedding. migrate.ts refuses a model/width mismatch.
      # Must match db/config.mjs's DEFAULT_EMBEDDING_*. Compose substitutes its own
      # fallback before the process ever starts, so a stale value here silently
      # overrides the code default rather than deferring to it.
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
      # Opt-in trigram index. No fallback value here on purpose: db/config.mjs
      # owns the default, and a `:-off` written in would be a second copy of it —
      # the defect this fork keeps finding. Unset simply means unset.
      OB1_TRGM_INDEX: ${OB1_TRGM_INDEX:-}
      # Migration 013 records this in ob1_config, so preflight can tell what the
      # schema was migrated under. Same no-fallback rule as above.
      OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
      # migrate.ts calls validateEmbeddingConfig, which reads this. Without it the
      # runner and the server could disagree about whether a width is legal.
      OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
      # Migration 023's one backfill call: unset is every row waiting; a number
      # is one batch, for a brain with millions of legacy rows that finishes by
      # hand (023's header). Same no-fallback rule as above.
      OB1_BACKFILL_LIMIT: ${OB1_BACKFILL_LIMIT:-}
      # The plugins the brain runs (SMD-2310), as the servers read them: a run
      # applies their migrations after the core's, each in its own schema as
      # its own role. A plugin not named is left as it is.
      OB1_PLUGINS: ${OB1_PLUGINS:-}
      # The password the migrator makes ob1_plugins with, the login role the
      # plugins' migrations and the servers' plugin pools run on.
      OB1_PLUGIN_DB_PASSWORD: ${OB1_PLUGIN_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [data]
    logging: *logging

  # Replaces: the Supabase Edge Function, and `supabase functions deploy`.
  server:
    # Named, so the REST core below runs this image by name — one build, the
    # two servers always on one code (review pass 1: an image of its own fell
    # behind after `up --build server`, as orchestration-runner-role's did).
    # Docker Compose v2 named the build this already; the Python podman-compose
    # and --compatibility named it <project>_server, so their next `up` builds
    # it once under this name. Never pulled, as migrate: `pull` skips it and a
    # fresh `up` builds it (review pass 2). The release overlay pulls its
    # pinned server instead.
    image: ${COMPOSE_PROJECT_NAME:-open-brain}-server
    pull_policy: never
    build:
      # Repo root, not server-portable/, because preflight.ts imports
      # ../db/config.mjs — the single definition of the embedding contract, shared
      # with migrate.ts so the runner and the server cannot disagree about it. A
      # context of server-portable/ cannot reach it, and the container crashlooped
      # on the missing module.
      context: ..
      dockerfile: server-portable/Dockerfile
      # The commit brain_info and the keyed /health report (SMD-2041), baked
      # into the image: set OB1_GIT_SHA when building (deploy/README.md).
      args:
        OB1_GIT_SHA: ${OB1_GIT_SHA:-unknown}
    # Anchored: `board-sync` below inherits this block whole (`<<: *server-env`),
    # so the provider, embedding and egress knobs are forwarded once, here, and a
    # worker that embeds and tags exactly as a capture does reads exactly what
    # the server reads. Check 14 parses anchors and merge keys (SMD-1954). It
    # sits under an extension key, which compose ignores, so the server's
    # `environment` below can add the plugin knobs no worker takes.
    x-env: &server-env
      # No OB1_STORE on purpose: the SQL store is the server's default (FORK.md
      # change 97), and this stack — the "Full stack, no Supabase" CI job — is
      # the deployment that proves it. Setting it here would let the default
      # drift back to PostgREST with nothing in CI noticing.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      MCP_ACCESS_KEYS: ${MCP_ACCESS_KEYS:?set MCP_ACCESS_KEYS in deploy/.env — mint with server-portable/keygen.ts}
      # Not required when OB1_LLM_BASE_URL points at a local provider; preflight
      # decides, and fails the container if a remote endpoint has no credential.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Must match db/config.mjs's DEFAULT_EMBEDDING_*. Compose substitutes its own
      # fallback before the process ever starts, so a stale value here silently
      # overrides the code default rather than deferring to it.
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
      # The server never builds the index; it needs this only so preflight can
      # notice the setting and the database disagreeing. Omitting it here would
      # make the check silently compare against a default the migrator did not use.
      OB1_TRGM_INDEX: ${OB1_TRGM_INDEX:-}
      # Read per capture. Preflight refuses to start if this is on against a
      # database without migration 013, so a stale value here fails loudly.
      OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
      # Unset, derived from the embedding model's measured window; preflight
      # prints the value, and warns when an explicit one is over the window.
      OB1_CHUNK_TOKENS: ${OB1_CHUNK_TOKENS:-}
      OB1_CHUNK_OVERLAP: ${OB1_CHUNK_OVERLAP:-}
      # The entity-extraction window (SMD-1879): unset, derived from the
      # metadata model's served context; preflight prints the value and the
      # model it came from. The server never extracts — forwarded so preflight,
      # in this container, reports what db/extract-entities.ts will do.
      OB1_EXTRACT_CHUNK_TOKENS: ${OB1_EXTRACT_CHUNK_TOKENS:-}
      # …and the per-thought bound (SMD-2240): unset, 24 windows. Forwarded
      # for preflight's row, as the window is.
      OB1_EXTRACT_MAX_WINDOWS: ${OB1_EXTRACT_MAX_WINDOWS:-}
      # The larger model a runaway extraction escalates to (SMD-2000). The
      # server never extracts; preflight, in this container, names it on the
      # extraction window row and probes it with --deep.
      OB1_EXTRACT_ESCALATE_MODEL: ${OB1_EXTRACT_ESCALATE_MODEL:-}
      OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
      OB1_LLM_API_KEY: ${OB1_LLM_API_KEY:-}
      # A chat endpoint of its own, when the two calls are not served by one
      # provider (SMD-1902). Unset, chat goes where the embeddings go.
      OB1_CHAT_BASE_URL: ${OB1_CHAT_BASE_URL:-}
      OB1_CHAT_API_KEY: ${OB1_CHAT_API_KEY:-}
      # The supersession judge's model when it is not the metadata model
      # (SMD-1901). The server never judges; preflight, which runs in this
      # container, reports it beside the metadata model and probes it with --deep.
      OB1_JUDGE_MODEL: ${OB1_JUDGE_MODEL:-}
      # The typed-decision tier (SMD-2050; the jev service below). The server
      # never decides; preflight, which runs in this container, dials the tier
      # when OB1_JEV_BASE_URL is set and fails the start when it does not
      # answer — so no fallback here: a default would fail every stack that
      # does not run the profile. With it, deploy/.env names
      # OB1_JEV_BASE_URL=http://jev:8020 and OB1_JEV_LOCAL=1.
      OB1_JEV_BASE_URL: ${OB1_JEV_BASE_URL:-}
      OB1_JEV_MODEL: ${OB1_JEV_MODEL:-}
      OB1_JEV_LOCAL: ${OB1_JEV_LOCAL:-}
      OB1_LLM_TIMEOUT: ${OB1_LLM_TIMEOUT:-}
      # What may leave the box (SMD-1903): whether a thought's text may reach
      # an endpoint not declared local — deny (the default), allow or off —
      # and its terms. "Local" is DECLARED, never read off the address, so
      # the stack's own `ollama` service (the fallback below) and an Ollama on
      # the host both need OB1_LLM_LOCAL=1 in deploy/.env; without it, under
      # the default, every embedding is refused and preflight's `embeddings
      # egress` row says so. No fallback here for the same reason: the compose
      # file must not declare local on the operator's behalf.
      OB1_EGRESS_POLICY: ${OB1_EGRESS_POLICY:-}
      OB1_EGRESS_ALLOW: ${OB1_EGRESS_ALLOW:-}
      OB1_EGRESS_DENY: ${OB1_EGRESS_DENY:-}
      OB1_LLM_LOCAL: ${OB1_LLM_LOCAL:-}
      OB1_CHAT_LOCAL: ${OB1_CHAT_LOCAL:-}
      # Where both model calls go. Unset in deploy/.env this is the stack's own
      # Ollama — the `ollama` service the local-models profile adds, by name on
      # `egress` — so the profile needs nothing set. Not a copy of
      # db/config.mjs's default: that is 127.0.0.1:11434, right from a shell on
      # the host and, inside this container, the container's own loopback with
      # nothing on it. Measured before SMD-1843, when nothing here forwarded the
      # knob at all: preflight called that address local, wanted no credential,
      # dialled nothing without --deep and said OK; the first capture failed in
      # 7 ms with "Unable to connect", and the server logged nothing. Since
      # SMD-1875 preflight dials an endpoint whose name is local once (GET
      # /models, 2.5 s) and the container refuses to start on one that answers
      # nothing, naming by the name's kind the profile, the host aliases or
      # the stack's own service as the fix. An Ollama
      # on the host is http://host.containers.internal:11434/v1 (podman; Docker
      # Desktop: host.docker.internal); OpenRouter is https://openrouter.ai/api/v1
      # with a key — deploy/.env.example, "Model provider". Check 14 holds this
      # fallback to exactly http://<service>:11434/v1 for a service in this file
      # that db/config.mjs's LOCAL_PROVIDER_SERVICES names — the list preflight
      # calls local — so the default here is one the container will accept.
      OB1_LLM_BASE_URL: ${OB1_LLM_BASE_URL:-http://ollama:11434/v1}
      # Metadata extraction: the model (db/config.mjs owns the default —
      # ollama-pull's fallback below is a copy checkEmbeddingDefaults holds
      # equal to it), its sampling temperature, and whether a thinking model
      # reasons first. The no-fallback rule again.
      OB1_METADATA_MODEL: ${OB1_METADATA_MODEL:-}
      OB1_METADATA_TEMPERATURE: ${OB1_METADATA_TEMPERATURE:-}
      OB1_METADATA_REASONING: ${OB1_METADATA_REASONING:-}
      # The opt-in query log (migration 034): off unless deploy/.env says on,
      # and preflight prints which. Until SMD-1843 nothing here forwarded it, so
      # SETUP.md's switch never reached the container. Every knob the server
      # declares (server-portable/root.ts, type Env) is forwarded now, and
      # scripts/check-fork-consistency.ts check 14 fails on the next one that
      # is not — a name in a comment, or on ollama-pull's command line, is not
      # a forward.
      OB1_QUERY_LOG: ${OB1_QUERY_LOG:-}
      OB1_QUERY_LOG_RETENTION_DAYS: ${OB1_QUERY_LOG_RETENTION_DAYS:-}
      # Which pipeline tier this server runs as (SMD-1806); stamped on every
      # query_log row. Unset is a plain brain. The three-tier compose
      # (compose.tiers.yaml) sets it per service; here it is a plain forward.
      OB1_TIER: ${OB1_TIER:-}
      OB1_AGENT_CACHE_TTL_MS: ${OB1_AGENT_CACHE_TTL_MS:-}
      OPEN_BRAIN_CITATION_BASE_URL: ${OPEN_BRAIN_CITATION_BASE_URL:-}
      # The stack's configured state and its public origin, as the
      # authorization server gets them (below): the server advertises OAuth at
      # <origin>/mcp only while COMPOSE_PROFILES names auth, the request's
      # Host is the origin's, and the authorization server answers its probe
      # on the mesh (SMD-2382, oauth-edge.ts). The REST core below takes this
      # block too: nothing it serves reads them, and its preflight prints the
      # same `public origin` row, naming the MCP server.
      OB1_PUBLIC_ORIGIN: ${OB1_PUBLIC_ORIGIN:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # No `:-10` here any more: store-sql.ts owns the default and reads "" as
      # unset (it read Number("") = 0 until SMD-1843's first review pass found
      # the copy and the reader together — Bun's SQL refuses a pool of 0 at
      # construction, so the server would have failed preflight at the data
      # layer, loudly, over a default that should have been 10).
      OB1_PG_POOL: ${OB1_PG_POOL:-}
      # The grace period a stop gives the server, in seconds; it drains for 2 s
      # less (SMD-2250). Unset, 10 — and stop_grace_period below reads the same
      # variable, so compose waits exactly what the server plans for.
      OB1_STOP_GRACE: ${OB1_STOP_GRACE:-}
      PORT: "8000"
    environment:
      <<: [*server-env, *plugin-env]
    stop_grace_period: ${OB1_STOP_GRACE:-10}s
    # No `ports:`. The proxy below is the stack's published port and reaches
    # this server as mcp.ob1.internal:8000 on the mesh (SMD-1846, SMD-2294);
    # n8n reaches it as `server:8000` on `egress`.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # The typed-decision tier, when --profile jev runs it: the server waits
      # for it to be healthy, so a first start that fetches the weights (~20 s)
      # does not crashloop the server on preflight's `jev tier` row (first
      # review pass). `required: false`: without the profile there is no jev
      # service and this is ignored (compose 2.20+; measured on 5.5 — `config`
      # lists postgres, migrate, server). A jev that never becomes healthy
      # holds the server back, which is what OB1_JEV_BASE_URL asked for.
      jev:
        condition: service_healthy
        required: false
    restart: unless-stopped
    # Docker on Linux provides no name for the host; Docker Desktop and podman
    # do (host.docker.internal; host.containers.internal). This line gives the
    # container the Docker spelling everywhere Docker runs, so deploy/.env.example's
    # Option B is one address per runtime and not one per runtime per OS, and
    # so CI's "Full stack, no Supabase" job can put a listener on the runner
    # for preflight's reachability probe to find (SMD-1875). A hosts entry
    # only: nothing is published. podman writes both names itself and maps
    # this one to the same address (measured, podman 6); an older podman
    # without the host-gateway keyword refuses the container. board-sync,
    # which embeds through the same knobs, takes the same entry by anchor
    # (fourth review pass).
    extra_hosts: &host-alias
      - "host.docker.internal:host-gateway"
    # `data`, where it reaches Postgres; `egress`, where it reaches the model
    # providers (the stack's Ollama and Jev by name, a host or hosted one
    # outward) and n8n reaches it; and `mesh`, where it reaches the
    # authorization server's health check as auth.ob1.internal (SMD-2382) and
    # answers the proxy as mcp.ob1.internal. The ADR has the MCP server on the
    # mesh alone; it joins the other two while it embeds and writes itself,
    # not through the REST core (SMD-2287). No dns_search here, unlike the
    # proxy: the probe's name is written rooted, which no search domain is
    # tried under, and an operator's model endpoint may be a short name their
    # resolver completes.
    networks:
      data: {}
      egress: {}
      mesh:
        aliases: [mcp.ob1.internal]
    logging: *logging

  # The REST core (SMD-2284): every operation the MCP tools expose, as JSON,
  # over the same core — the server's image run as `bun api.ts`, with the
  # server's environment and preflight. Internal by default: no port, reached
  # on the mesh as api.ob1.internal (the GUI, when it comes), and through the
  # proxy at /api only where deploy/compose.api-public.yaml is named. On
  # `data` and `egress` too, as the server is, for Postgres and the model
  # providers (SMD-2583), so every container on `egress` reaches it as
  # `api:8000`, and needs a key for anything but /health and /openapi.json. Its
  # writes record their door as open-brain-api (thought_audit.origin), and
  # the jobs it starts are its own (migration 078).
  api:
    # The server's image, by the server's name, never pulled or built here:
    # `up --build server` rebuilds it, and the proxy's dependency on this
    # service brings it along whenever the proxy is named. The release
    # overlay pins it to the release's server image.
    image: ${COMPOSE_PROJECT_NAME:-open-brain}-server
    pull_policy: never
    command: ["api.ts"]
    environment:
      <<: [*server-env, *plugin-env, *hook-env]
    stop_grace_period: ${OB1_STOP_GRACE:-10}s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jev:
        condition: service_healthy
        required: false
    restart: unless-stopped
    extra_hosts: *host-alias
    networks:
      data: {}
      egress: {}
      mesh:
        aliases: [api.ob1.internal]
    # The image's own check, the same keyless GET of /health (SMD-1849), named
    # here too: a server image from before it POSTs to the MCP endpoint at /,
    # which the REST core answers 404 (NO_ROUTE).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: *logging

  # The stack's one origin (SMD-1846): a reverse proxy, and the only service
  # without a profile that publishes a port. Each service is a path on it —
  # the routes are x-proxy-routes above — so a new one is a router, not a port
  # an operator picks, opens and hands a client separately. It does no
  # authentication: the key travels to the server untouched, in the header or
  # in `?key=`, and the server checks it. It terminates nothing but TCP; TLS
  # in front is still a tunnel's or a proxy's on the host (deploy/README.md).
  #
  # Traefik, pinned by digest: the multi-arch index v3.7.13 resolved to. Chosen
  # over nginx, which buffers a response unless told not to — the server's tool
  # calls answer as SSE streams, and its keepalive frame (SMD-1864) must reach
  # the client when it is written; Traefik flushes an event stream as it
  # arrives. Caddy would also do, and wins on TLS; the query-string rule below
  # is one setting here.
  proxy:
    image: docker.io/library/traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    # Nothing it needs is root's: it listens on 8000, reads its route table and
    # writes only to stdout. Not read_only: compose writes an inline config
    # (`configs:` below) into the container's own filesystem, and refuses to
    # into a read-only one.
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Traefik's static configuration, from its environment so that the
    # healthcheck below — a second traefik process in this container — reads
    # the same. No OB1_* knob here: nothing in it is the operator's to set
    # but the address and port it publishes.
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8000"
      # A header spelled with `_` or `.` (X_Brain_Key) is read by some
      # backends as the `-` header it aliases; deleted here, so a client
      # cannot supply one header twice under two spellings.
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY: delete
      # A directory, not one file: the route table below is routes.yaml in
      # it, and deploy/compose.api-public.yaml adds api.yaml beside it — the
      # operator's opt-in to the REST core's public path (SMD-2284).
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/dynamic
      # The access log: one JSON line per request, with no query string and
      # no header. A connector carries its key as `?key=` (the documented
      # form, deploy/README.md) and an OAuth redirect will carry its code and
      # state there (SMD-2285), so a log line with the query would put the
      # key on disk that keygen.ts shows once — the path, the status and the
      # timings are what the log is for. Measured on v3.7.13: RequestPath is
      # `/mcp` for `/mcp?key=…`; CI's "The proxy answers discovery itself…"
      # step greps the log for the smoke key after calls carrying it.
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_ACCESSLOG_FORMAT: json
      TRAEFIK_ACCESSLOG_FIELDS_QUERYPARAMETERS_DEFAULTMODE: drop
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_DEFAULTMODE: drop
      # …and no userinfo: a request in absolute form
      # (`POST http://user:secret@host/mcp`) put its user part in the
      # ClientUsername field, the one place a probe's secret reached the log
      # (review pass 1, measured). The server reads no key from userinfo.
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_CLIENTUSERNAME: drop
      # Its liveness, on an entrypoint of its own that only the container's
      # loopback reaches, so /ping is not a route on the origin.
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: ping
      TRAEFIK_ENTRYPOINTS_PING_ADDRESS: "127.0.0.1:8082"
      # Nothing leaves the box for Traefik's own sake.
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
    configs:
      - source: proxy-routes
        target: /etc/traefik/dynamic/routes.yaml
    # The route table again, as a label nothing reads: compose copies an
    # inline config into the container when it creates it, and a changed
    # config alone does not recreate it (measured on Compose 5.5, docker/compose
    # #11900) — so an `up` after a release that changes a route would go on
    # serving the old table. A changed label does recreate it, so the two copies
    # move together; CI holds them equal.
    labels:
      ob1.proxy-routes: *proxy-routes
    ports:
      # Loopback unless SERVER_BIND says otherwise: the one published port of
      # the stack without its opt-in profiles. The knobs keep the server's
      # names, which they were until SMD-1846, so a deploy/.env written
      # before it publishes the same address and port and every client's URL
      # still answers. A remote client — a claude.ai connector, another
      # machine — goes through a TLS proxy or a tunnel; one on this host dials
      # 127.0.0.1 and needs no change here. `SERVER_BIND=0.0.0.0` is for a
      # proxy on another machine, and puts the key on the wire in clear on
      # every request: the header is as visible as `?key=` over plain HTTP
      # (SMD-1844).
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-8000}:8000"
    # `edge`, where the port is published (a container only on internal
    # networks publishes none, measured on podman 6) and which nothing else
    # joins, and `mesh`, where it reaches every backend: the MCP server as
    # mcp.ob1.internal (SMD-2382), the REST core as api.ob1.internal
    # (SMD-2284), the authorization server as auth.ob1.internal, and another
    # tier's MCP server, a compose project of its own that joins this mesh, as
    # mcp.<tier>.ob1.internal (SMD-2294). It shares no network with Postgres,
    # the model services, n8n or the workers (SMD-2583).
    networks: [edge, mesh]
    # No search domains. With the authorization server absent, a name that
    # does not resolve on the networks would be tried again under each of the
    # host's (a tailnet's, an ISP's, measured on podman), and whatever answered
    # `auth.ob1.internal.<domain>` would be sent `/auth` traffic, a sign-in
    # POST included (review: a decoy by that name got the password). With
    # none, and the route's name written rooted (`auth.ob1.internal.`), the
    # one lookup is the stack's own name under the reserved .internal TLD.
    # An absent tier's name (mcp.canary.ob1.internal.) is written the same
    # way, for the same reason, as is this stack's own server's while it is
    # stopped or recreated. That one lookup still reaches the host's
    # resolvers, since `edge` forwards a name it does not hold (an internal
    # network does not, measured): one that answers *.ob1.internal itself
    # would get the route's requests, keys included, until the proxy is on
    # internal networks alone, behind a forwarder that holds the published
    # port (SMD-2583's second part; deploy/README.md, "One origin").
    dns_search: ["."]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Started after the server, so `up proxy` brings the brain; not held for
    # the server's health: while the server is down or in preflight the proxy
    # answers 502, and it answers again when the server does. The direction is
    # what hands the port over on the first `up` after SMD-1846: compose
    # recreates the old server, which held the port, before it creates this.
    # The other way round, this would bind while the old server still held it.
    # It also means `up server` alone never starts the proxy: name both
    # (deploy/README.md, "One origin"). The REST core too, so the documented
    # `up -d --build server proxy` recreates it on the server's new image
    # rather than leaving it on the old one (SMD-2284 review pass 1).
    depends_on:
      server:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  # Keeps the brain in lockstep with the Linear board (SMD-1954). Optional —
  # `--profile board-sync`; a brain that is not the fork's own never runs it.
  #
  # `bun db/sync-linear.ts --loop`: every OB1_BOARD_SYNC_INTERVAL seconds (300)
  # it lists the issues of the OB1_LINEAR_INITIATIVE's projects, reads the
  # brain's ticket rows, and writes the difference — a new issue captured, a
  # moved one updated in place — through the server's own store and embedder
  # (db/sync-linear.ts's header). No port, no key: it reaches Postgres as the
  # migrator does and writes as the actor `board-sync`. Mounted read-only: db/
  # and server-portable/, the tool's whole import surface — NOT the checkout,
  # whose deploy/.env and evals/.env would otherwise sit on the tool's own
  # `.env` search path inside the container (third review pass; the fifth moved
  # the two shared modules it read from evals/ into db/ so these two mounts are
  # the boundary, not a list of files). Like the migrator it needs no
  # `bun install` — Bun built-ins and in-tree modules only.
  #
  # The model knobs are the server's, inherited from its anchor above; the two
  # of its own are LINEAR_API_KEY (a personal API key, read-only use — it
  # fetches issues) and OB1_LINEAR_INITIATIVE. The egress gate applies to its
  # embed and tag calls as to a capture's: with the provider on the host,
  # deploy/.env carries OB1_LLM_LOCAL=1 or every ticket lands without a vector.
  board-sync:
    image: oven/bun:1.4.0-alpine
    profiles: ["board-sync"]
    working_dir: /app
    volumes:
      - ../db:/app/db:ro
      - ../server-portable:/app/server-portable:ro
    environment:
      <<: *server-env
      # The merge brings the server's whole block; the two things this worker
      # does not read are unset again, so its environment is exactly what it
      # reads (second review pass) — the key material stays with the server.
      MCP_ACCESS_KEYS: ""
      PORT: ""
      # No `:?` here: compose interpolates every service's block whether or not
      # its profile is active, so a required-variable error would fail every
      # `up` without the profile (the first review pass found the full-stack CI
      # job and every existing stack). The tool refuses to start without it.
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      OB1_LINEAR_INITIATIVE: ${OB1_LINEAR_INITIATIVE:-}
      OB1_BOARD_SYNC_INTERVAL: ${OB1_BOARD_SYNC_INTERVAL:-}
    command: ["bun", "db/sync-linear.ts", "--loop"]
    # The server's host alias (SMD-1875): this worker dials OB1_LLM_BASE_URL
    # too, and on Linux Docker Option B's name exists only through this entry.
    extra_hosts: *host-alias
    # Postgres on `data`; the model provider and Linear's API on `egress`.
    networks: [data, egress]
    # SIGTERM ends the loop after the issue in hand, not the pass — one embed
    # and one write, seconds — and the brain is the state, so a pass cut short
    # is finished by the next; this is the room for that one issue.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not `unless-stopped`: the tool exits 2 on a missing LINEAR_API_KEY or a
    # bad interval — configuration, which a restart does not fix — and an
    # unconditional restart made that refusal a crash loop with the same hint
    # filling the log (fifth review pass). Three tries cover a database not yet
    # answering; then the service stops and `ps` says so.
    restart: on-failure:3
    logging: *logging

  # Entity extraction and consolidation, unattended (SMD-2424). Optional —
  # `--profile workers`, since each is a model call per thought: GPU time on a
  # local model, money and the thought's text on a hosted one.
  #
  # `bun db/extract-entities.ts --follow` and `bun db/consolidate.ts --follow`:
  # each drains its pool, then polls for new work every OB1_EXTRACT_FOLLOW /
  # OB1_CONSOLIDATE_FOLLOW seconds (unset, the CLI's 15). One worker each
  # unless OB1_EXTRACT_WORKERS / OB1_CONSOLIDATE_WORKERS says more — not the
  # CLI's 2, so a model slot stays free for captures (the dogfood's 7B serves
  # three at once; the two counts, board-sync and captures share the slots).
  # Claims are leased (015, 031), so a follower that dies loses nothing: its
  # thought goes back to the pool when the lease lapses (and is recorded
  # failed at the third lapse).
  #
  # board-sync's shape — the same image, the same two read-only mounts, the
  # server's environment by anchor — so, as board-sync does, it runs this
  # checkout's code: neither release image carries the workers, and a
  # checkout newer than the stack's release runs newer workers against an
  # older schema (deploy/README.md; SMD-2601). Two differences from
  # board-sync. MCP_ACCESS_KEYS stays: the worker names itself by
  # OB1_WORKER_KEY's hash in that list (db/worker-bootstrap.ts). And
  # OB1_WORKER_KEY is required: the `sh -c` refuses to start without it,
  # exit 2, where a run from a checkout warns and writes mentions, edges and
  # proposals with no agent id. The knobs are forwarded, so `compose exec
  # extract env` shows what the follower was started with, and read by the
  # command line, which takes digits only — a value starting with a dash
  # would otherwise reach the CLI as a flag (`--status` ran once and exited
  # 0). `exec` hands the process to bun, so the stop signal reaches it.
  extract:
    image: oven/bun:1.4.0-alpine
    profiles: ["workers"]
    working_dir: /app
    volumes: &claim-worker-mounts
      - ../db:/app/db:ro
      - ../server-portable:/app/server-portable:ro
    environment:
      <<: *server-env
      PORT: ""
      OB1_WORKER_KEY: ${OB1_WORKER_KEY:-}
      OB1_EXTRACT_FOLLOW: ${OB1_EXTRACT_FOLLOW:-}
      OB1_EXTRACT_WORKERS: ${OB1_EXTRACT_WORKERS:-}
    command:
      - sh
      - -c
      - |
        [ -n "$$OB1_WORKER_KEY" ] || { echo "extract: OB1_WORKER_KEY is not set in deploy/.env — mint a key (cd server-portable && bun keygen.ts --name workers --scope capture), add its line to MCP_ACCESS_KEYS and the raw key as OB1_WORKER_KEY" >&2; exit 2; }
        case "$$OB1_EXTRACT_FOLLOW$$OB1_EXTRACT_WORKERS" in *[!0-9]*) echo "extract: OB1_EXTRACT_FOLLOW ('$$OB1_EXTRACT_FOLLOW') and OB1_EXTRACT_WORKERS ('$$OB1_EXTRACT_WORKERS') take digits only" >&2; exit 2;; esac
        exec bun db/extract-entities.ts --follow $${OB1_EXTRACT_FOLLOW:+"$$OB1_EXTRACT_FOLLOW"} --workers "$${OB1_EXTRACT_WORKERS:-1}"
    extra_hosts: *host-alias
    # board-sync's: Postgres on `data`, the model provider on `egress`.
    networks: [data, egress]
    # The first SIGTERM stops each worker after the thought in hand — every
    # window of it — and returns the rest of its claims. On the stable brain
    # a thought's extraction took 37 s at the median, 121 s at p90 and 629 s
    # at p99 (1,394 claims, two workers on qwen2.5:7b, 2026-10-05). A thought
    # still in hand at the kill is not lost: its lease lapses (--ttl, 900 s)
    # and the next follower extracts it again.
    stop_grace_period: 120s
    depends_on: &claim-worker-depends
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # board-sync's rule, for both services: a refusal exits 2 — no key, a
    # key MCP_ACCESS_KEYS does not hold (or revoked, or of a scope that grants
    # nothing), a bad knob, the egress gate, (this service) a model or prompt
    # version other than the recorded key's, a provider refusing the first
    # call at start — and a restart does not fix configuration, so after
    # three restarts the service stops and `ps` says so. podman restarts at
    # once, with no backoff, and never resets the count, which is why an
    # outage must not exit: a follower waits out the database going away
    # and a provider outage, and spends no restart on either (SMD-2599). A
    # follower stopped by a signal exits 0 (137 if killed past the grace
    # period) and stays stopped.
    restart: on-failure:3
    logging: *logging

  # Consolidation never applies a proposal; since 084 it stores related,
  # evolves and duplicate verdicts as relation facets. Each proposal waits for review
  # (`bun db/consolidate.ts --list`, then --accept or --reject; 029), but for
  # a stale one the next pass settles (067). Beside extraction: the pool holds
  # only thoughts with entities and a vector, and a candidate shares an
  # entity, has a vector and was captured on an earlier UTC date (029), so a
  # capture's neighbours were almost always extracted long before it is
  # judged (one extract worker claims in queue order; with more, a neighbour
  # captured just before 00:00 UTC can still be in hand). A backlog is not —
  # a first run or a --switch-key pools every thought at one instant,
  # claimed in no order — and a pair whose older side was still unextracted
  # is never judged: start `extract` alone on one, and this when
  # `extract-entities.ts --status` shows 0 in flight, 0 pending and 0 not
  # yet in the pool (retrying any failed first). Once newer thoughts are
  # judged, a failed extraction or embedding, and an import dated older than
  # thoughts already judged, miss their pairs however this runs
  # (deploy/README.md).
  consolidate:
    image: oven/bun:1.4.0-alpine
    profiles: ["workers"]
    working_dir: /app
    volumes: *claim-worker-mounts
    environment:
      <<: *server-env
      PORT: ""
      OB1_WORKER_KEY: ${OB1_WORKER_KEY:-}
      OB1_CONSOLIDATE_FOLLOW: ${OB1_CONSOLIDATE_FOLLOW:-}
      OB1_CONSOLIDATE_WORKERS: ${OB1_CONSOLIDATE_WORKERS:-}
    command:
      - sh
      - -c
      - |
        [ -n "$$OB1_WORKER_KEY" ] || { echo "consolidate: OB1_WORKER_KEY is not set in deploy/.env — mint a key (cd server-portable && bun keygen.ts --name workers --scope capture), add its line to MCP_ACCESS_KEYS and the raw key as OB1_WORKER_KEY" >&2; exit 2; }
        case "$$OB1_CONSOLIDATE_FOLLOW$$OB1_CONSOLIDATE_WORKERS" in *[!0-9]*) echo "consolidate: OB1_CONSOLIDATE_FOLLOW ('$$OB1_CONSOLIDATE_FOLLOW') and OB1_CONSOLIDATE_WORKERS ('$$OB1_CONSOLIDATE_WORKERS') take digits only" >&2; exit 2;; esac
        exec bun db/consolidate.ts --follow $${OB1_CONSOLIDATE_FOLLOW:+"$$OB1_CONSOLIDATE_FOLLOW"} --workers "$${OB1_CONSOLIDATE_WORKERS:-1}"
    extra_hosts: *host-alias
    networks: [data, egress]
    # A thought is up to --k (3) judged pairs: 11 s at the median, 38 s at
    # the most on the stable brain (1,447 claims, 2026-10-05).
    stop_grace_period: 60s
    depends_on: *claim-worker-depends
    restart: on-failure:3
    logging: *logging

  # Replaces: OpenRouter. Optional — enable with `--profile local-models`.
  #
  # Ollama exposes an OpenAI-compatible surface at /v1, so the server needs no
  # code change: its OB1_LLM_BASE_URL falls back to this service (above), and no
  # credential is sent to it. With this running, nothing about a captured
  # thought leaves the host.
  ollama:
    image: *ollama-image
    profiles: ["local-models"]
    volumes:
      - ollama:/root/.ollama
    # No `ports:`. An unauthenticated model API; the server and ollama-pull reach
    # it as `ollama:11434` on `egress`, and nothing in the stack needs
    # it from the host. `compose exec ollama ollama pull <model>` (with the -f
    # files the stack runs with) for a third model; compose.host-ports.yaml
    # publishes it on loopback for an eval run from a checkout (SMD-1844).
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    # `egress` alone: it fetches the models it pulls from the registry, and
    # its callers, every one of which calls out too, meet it there. Never
    # `data`: it holds no credential and needs no database (SMD-2583).
    networks: [egress]
    logging: *logging

  # Pulls the two models — more when OB1_JUDGE_MODEL or
  # OB1_EXTRACT_ESCALATE_MODEL names one — then exits.
  # First run downloads a few hundred MB.
  ollama-pull:
    image: *ollama-image
    profiles: ["local-models"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Read by the shell below, not by compose: `$$` reaches the container as
      # `$`, so an unset knob pulls nothing rather than a model named "".
      OB1_JUDGE_MODEL: ${OB1_JUDGE_MODEL:-}
      OB1_EXTRACT_ESCALATE_MODEL: ${OB1_EXTRACT_ESCALATE_MODEL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
        ollama pull ${OB1_METADATA_MODEL:-qwen2.5:7b}
        [ -z "$$OB1_JUDGE_MODEL" ] || ollama pull "$$OB1_JUDGE_MODEL"
        [ -z "$$OB1_EXTRACT_ESCALATE_MODEL" ] || ollama pull "$$OB1_EXTRACT_ESCALATE_MODEL"
    restart: "no"
    networks: [egress]
    logging: *logging

  # The typed-decision tier (SMD-2050). Optional — `--profile jev`; a brain
  # that runs none of the Jev spikes never builds it.
  #
  # A Jev-class model answers a bounded question — "is this true of this
  # text?", "which of these options?" — with a calibrated probability in one
  # forward pass, no generation. Ollama cannot serve that (its API exposes no
  # option logits), so this is its own process: jev/serve.ts, Verdict v1.4 on
  # onnxruntime-node's CPU provider, behind the contract in
  # server-portable/jev-contract.ts that server-portable/jev.ts calls. Outside
  # Ollama's scheduler, so OLLAMA_MAX_LOADED_MODELS neither counts nor evicts
  # it; about 1 GB resident (jev/README.md has the measured footprint).
  #
  # No weights in the image: on first start the service fetches the pinned
  # files (606 MB) into the jev-models volume and verifies every file's sha256
  # on every start; a file that does not match is refused, never loaded.
  jev:
    build:
      context: ..
      dockerfile: jev/Dockerfile
    profiles: ["jev"]
    volumes:
      - jev-models:/models
    # The service's own two knobs worth an operator's hand (fifth review
    # pass: none reached it before): onnxruntime's threads — 8 on the podman
    # VM's 8 vCPU measured 20–30% faster than the default 4 — and the hub the
    # pinned files are fetched from (a mirror). Empty is the default. Its host,
    # port and model directory are the image's (0.0.0.0, 8020, /models); the
    # JEV_PORT in deploy/.env is the HOST port compose.host-ports.yaml
    # publishes, never this service's.
    environment:
      JEV_THREADS: ${JEV_THREADS:-}
      JEV_HUB: ${JEV_HUB:-}
    # No `ports:`. An unauthenticated API, like Ollama's: the server's
    # preflight and a spike in a container reach it as `jev:8020` on
    # `egress`, where it fetches its weights, as Ollama does;
    # compose.host-ports.yaml publishes it on loopback for a spike run from a
    # checkout.
    networks: [egress]
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8020/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      # The first start downloads the weights before it listens: 606 MB in
      # ~20 s here, and past these ten minutes below ~1 MB/s — then jev is
      # unhealthy and the server, which waits for it, does not start.
      # Pre-pull on a slow link: compose --profile jev run --rm jev --fetch-only.
      start_period: 600s
    # A fetch that fails or a file that hashes wrong exits 1 with the file
    # named; three tries cover a network that was not up yet, then the service
    # stops and `ps` says so rather than looping (the board-sync rule above).
    restart: on-failure:3
    logging: *logging

  # The orchestration tool (SMD-2210; docs/orchestration-tool.md, SMD-1863's
  # decision). Optional — `--profile orchestration`; a brain plus an AI client
  # never runs it. n8n runs workflows (a schedule, a trigger, a cursor), which
  # reach the brain only through its MCP endpoint with a capture-scope key.
  # OB1's part is the provisioning and the templates in deploy/orchestration/;
  # the image is n8n's, referenced and never vendored.
  #
  # Pinned by digest, the multi-arch index 2.40.6 resolved to when the eval kit
  # measured it. Bump it deliberately: each bump re-runs the kit (`bun
  # evals/eval-orchestration.ts --up n8n`, then `--verify n8n --wait-schedule`),
  # because the internal endpoints that mint the API key, and the run data
  # the kit counts, are not n8n's published contract.
  #
  # Before the first `up`, `bun deploy/orchestration/provision.ts --init`
  # writes the secrets below into deploy/.env. After it, one provisioning step
  # from a checkout, `bun deploy/orchestration/provision.ts`, mints an expiring
  # API key into deploy/.env and loads credentials and templates
  # (deploy/README.md, "Orchestration").
  n8n:
    image: docker.io/n8nio/n8n:2.40.6@sha256:9c7871d5cc4fc2565bb905e4df5bf7d6a5a4bf2f4313fb99a2b3fa380f331d7c
    profiles: ["orchestration"]
    # n8n generates an encryption key when it has none. Backing up deploy/.env
    # would then miss it, and setting one later leaves n8n refusing to start
    # on the mismatch. Without an owner from the environment, a fresh n8n lets
    # whoever reaches the port first claim it. So without both, this container
    # exits at once and says why. Compose's `:?` cannot do that job here:
    # compose interpolates every service's block, profile or not, so a
    # required-variable error would fail every `up` (the board-sync lesson
    # above). The restart policy then retries it, and `ps` shows it
    # restarting, with the reason in its log. For a server that should come
    # back after a reboot, that beats stopping for good after three tries.
    entrypoint:
      - tini
      - --
      - /bin/sh
      - -c
      - '[ -n "$$N8N_ENCRYPTION_KEY" ] && [ -n "$$N8N_INSTANCE_OWNER_PASSWORD_HASH" ] || { echo "n8n: N8N_ENCRYPTION_KEY or N8N_OWNER_PASSWORD_HASH is not set in deploy/.env — run: bun deploy/orchestration/provision.ts --init, and back both up with POSTGRES_PASSWORD" >&2; exit 2; }; exec /docker-entrypoint.sh'
    environment:
      # n8n also writes this key into its volume (/home/node/.n8n/config),
      # beside the credentials it encrypts (read from the 2.40.6 image). So a
      # copy of the whole volume carries both. deploy/README.md's backup
      # copies the database alone.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      # The owner, set from the environment at every start: it exists from
      # the first boot, so there is no unclaimed window between `up` and
      # provisioning. A changed password takes effect when the container is
      # recreated (`up -d n8n`); a `compose restart` keeps the old hash.
      # The hash is bcrypt; --init derives it from N8N_OWNER_PASSWORD and
      # writes it single-quoted, since compose would read its `$`s as
      # variables (measured).
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-operator@ob1.local}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH:-}
      N8N_INSTANCE_OWNER_FIRST_NAME: OB1
      N8N_INSTANCE_OWNER_LAST_NAME: Operator
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      WEBHOOK_URL: http://127.0.0.1:${N8N_PORT:-5678}/
      # Loopback over plain HTTP: the session cookie cannot be Secure here.
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
      # n8n's documented switches for usage diagnostics, the version check,
      # the template gallery and the onboarding survey, each off. The eval
      # kit's egress probe records what the container still tries to reach
      # (evals/README.md). With these alone, the MCP registry module fetched
      # https://api.n8n.io/api/mcp-servers at boot and every 8 hours
      # (measured). It lists MCP servers for the editor's catalogue, and the
      # stock MCP Client node the templates use does not need it, so it is
      # off.
      N8N_DISABLED_MODULES: mcp-registry
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
      # No secret in this block but the encryption key and the owner's hash.
      # Provisioning puts every key into n8n's encrypted credential store
      # through the public API, and no workflow can read one from the
      # environment.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Every run's data is a copy of what the run carried: a capture's text,
      # an act tool's arguments. It sits outside delete_thought and the
      # brain's retention. n8n keeps 14 days or 10,000 runs by default; here
      # it is 24 hours or 1,000 runs. n8n marks a run past the window at
      # its hourly check, and deletes the data at a 15-minute sweep an hour
      # later (its hard-delete buffer): up to about 2¼ hours past the window.
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE:-24}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${N8N_EXECUTIONS_MAX_COUNT:-1000}
    ports:
      # Loopback unless N8N_BIND says otherwise: the editor, the public API,
      # the webhooks and the MCP endpoint, behind the owner's password and the
      # keys provisioning stores. No TLS here (SMD-1846 is the one origin).
      - "${N8N_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    # `egress` alone: the vendors its workflows name, and the brain as
    # `server:8000` and the import runner as `orchestration-runner:8090`. Not
    # the mesh: a tier of another project joins this stack's mesh, where
    # compose names its server `server` too, and n8n would reach either
    # (SMD-2294). `egress` is this project's own.
    networks: [egress]
    volumes:
      # The store: workflows, encrypted credentials, each workflow's cursor
      # (static data) and run history, in n8n's default SQLite. Back it up
      # with deploy/.env; an OAuth credential's refresh token lives only here.
      - n8n-data:/home/node/.n8n
    healthcheck:
      # Readiness, not /healthz: that answers while n8n is still migrating.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  # The import runner (SMD-2212; docs/orchestration-tool.md, "Running a
  # pipeline from a workflow"). It is part of the `orchestration` profile: the
  # import templates call it, and nothing else does. n8n's image has neither
  # Bun nor python3, so an import template's HTTP Request node asks this
  # service to run one pipeline from its fixed allowlist
  # (deploy/orchestration/pipelines.json):
  #   1. the pipeline's emitter over imports/<pipeline>/, with no network
  #      unless the pipeline names a host (SMD-2289);
  #   2. every line held to the pipeline's one source;
  #   3. `db/ingest-records.ts` under the actor `orchestration-runner`;
  #   4. `db/reembed.ts`.
  #
  # No port. n8n reaches it as `orchestration-runner:8090` on `egress`,
  # behind OB1_RUNNER_KEY, which `provision.ts --init` writes. The
  # key is a write capability bounded by the allowlist, not a brain key. It
  # reaches Postgres as a role of its own, `ob1_orchestration_runner` (the
  # service below makes it), not the superuser, and its environment holds the
  # knobs its ingester and reembed read, not the server's whole block
  # (SMD-2289).
  #
  # The runner's database role (SMD-2289): a LOGIN role that is not a
  # superuser and owns nothing, granted what the runner's ingester and reembed
  # run (capture, worker, structure and extraction, measured) and no
  # more: not the server group, whose writes to ob1_agent_keys could clear a
  # key's revocation. It is a member of no role. A one-shot on the migrator's
  # image, which connects as the migrator does: db/login-role.ts creates the
  # role or resets its password to OB1_RUNNER_DB_PASSWORD (`provision.ts
  # --init` writes it) and its settings, then `migrate.ts --grant --groups …
  # --exact` replaces its privileges with the groups' in one transaction, so a
  # runner in flight never meets a moment without them. Every `up` runs it,
  # the runner left running when its config is unchanged, so a rotated
  # password and the grants a new migration adds land before the runner
  # starts.
  orchestration-runner-role:
    # migrate's image, by migrate's name, never pulled or built here: an image
    # of its own kept an old config.mjs's grants after `up --build server`
    # rebuilt migrate (review pass 5), and building it on every `up` made an
    # offline `up` wait ~16 min on the registry (pass 6). The release overlay
    # pins it to the release's migrator.
    image: ${COMPOSE_PROJECT_NAME:-open-brain}-migrate
    pull_policy: never
    profiles: ["orchestration"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      # No `:?`, for the reason n8n's block gives: login-role.ts refuses without
      # it and says to run --init. `up` then fails naming this service, and the
      # runner, which waits on it, is not started.
      OB1_RUNNER_DB_PASSWORD: ${OB1_RUNNER_DB_PASSWORD:-}
    command: ["sh", "-c", "bun login-role.ts --role ob1_orchestration_runner --password-env OB1_RUNNER_DB_PASSWORD && bun migrate.ts --grant ob1_orchestration_runner --groups capture,worker,structure,extraction --exact"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [data]
    logging: *logging

  orchestration-runner:
    build:
      context: ..
      dockerfile: deploy/orchestration/runner.Dockerfile
    profiles: ["orchestration"]
    volumes:
      # The exports, read-only: one subdirectory per pipeline. Private data,
      # which git and every build context ignore (deploy/imports/README.md).
      # `z` relabels both mounts for a container on an SELinux host, where the
      # runner otherwise meets EACCES and restarts (review pass 4); elsewhere
      # it is a no-op. In long form: compose 2.38–2.40.0, the CI runner's,
      # reads the short `${IMPORTS_DIR…}:/imports:ro,z` as too many colons when
      # it renders without substituting, as CI's proxy check does (SMD-2658).
      - type: bind
        source: ${IMPORTS_DIR:-./imports}
        target: /imports
        read_only: true
        bind:
          selinux: z
      # The allowlist provisioning reads, so the two cannot disagree: a line
      # the runner does not hold would load an import that fails every run
      # (review pass 1). The runner reads it at start, so recreate it after an
      # edit (`up -d --force-recreate orchestration-runner`; a plain `up -d`
      # sees no change). It refuses to start on a line whose emitter the image
      # lacks.
      - ./orchestration/pipelines.json:/app/deploy/orchestration/pipelines.json:ro,z
    # It starts as root only to hand each step to its own user (su-exec: each
    # pipeline's emitter as a uid of its own, the pipeline as bun). These are
    # the only capabilities it keeps: changing user, and signalling a step's
    # processes (at the deadline, and to kill what an emitter leaves).
    # NET_ADMIN and SETPCAP are for the image's command: it sets the rules that
    # give emitter uids no network, but for a networked pipeline's proxy, then
    # drops both before the runner starts, and the runner refuses to start
    # holding either (SMD-2289). init keeps them, as does a `compose exec` as
    # root; nothing the runner starts has them. The kernel needs nf_tables.
    # init reaps what exits.
    init: true
    # Bounds on what one emitter an export has taken over can take from the
    # host: processes and memory (review pass 7: neither was set, and Docker
    # sets no process limit). An emitter's output is held up to 256 MB and read
    # a few times over, so 2 GB leaves room for that and for reembed.
    pids_limit: 512
    mem_limit: 2g
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, NET_ADMIN, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Its own role, and only what its ingester and reembed read (SMD-2289):
      # the tier; the embedding model and width; the chunk window and context;
      # the provider and chat endpoints, their credentials and whether each is
      # local (reembed's blurbs are chat calls when OB1_CHUNK_CONTEXT is on);
      # the metadata model and sampling the blurbs use; the timeout; and the
      # egress gate. Not the server's anchor: a knob the server gains does not
      # reach the runner unless it is added here. The fallbacks are the
      # server's, which check-fork-consistency holds equal to db/config.mjs.
      DATABASE_URL: postgres://ob1_orchestration_runner:${OB1_RUNNER_DB_PASSWORD:-}@postgres:5432/openbrain
      OB1_TIER: ${OB1_TIER:-}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
      OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
      OB1_CHUNK_TOKENS: ${OB1_CHUNK_TOKENS:-}
      OB1_CHUNK_OVERLAP: ${OB1_CHUNK_OVERLAP:-}
      OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
      OB1_LLM_BASE_URL: ${OB1_LLM_BASE_URL:-http://ollama:11434/v1}
      OB1_LLM_API_KEY: ${OB1_LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OB1_LLM_LOCAL: ${OB1_LLM_LOCAL:-}
      OB1_CHAT_BASE_URL: ${OB1_CHAT_BASE_URL:-}
      OB1_CHAT_API_KEY: ${OB1_CHAT_API_KEY:-}
      OB1_CHAT_LOCAL: ${OB1_CHAT_LOCAL:-}
      OB1_METADATA_MODEL: ${OB1_METADATA_MODEL:-}
      OB1_METADATA_TEMPERATURE: ${OB1_METADATA_TEMPERATURE:-}
      OB1_METADATA_REASONING: ${OB1_METADATA_REASONING:-}
      OB1_LLM_TIMEOUT: ${OB1_LLM_TIMEOUT:-}
      OB1_EGRESS_POLICY: ${OB1_EGRESS_POLICY:-}
      OB1_EGRESS_ALLOW: ${OB1_EGRESS_ALLOW:-}
      OB1_EGRESS_DENY: ${OB1_EGRESS_DENY:-}
      # No `:?`, for the reason n8n's block gives: the runner refuses to
      # start without it, and says why.
      OB1_RUNNER_KEY: ${OB1_RUNNER_KEY:-}
      OB1_RUNNER_TIMEOUT_S: ${OB1_RUNNER_TIMEOUT_S:-}
    # The server's host alias (SMD-1875): reembed dials OB1_LLM_BASE_URL.
    extra_hosts: *host-alias
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8090/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      orchestration-runner-role:
        condition: service_completed_successfully
    # Postgres on `data`; on `egress` the model provider, a networked
    # pipeline's hosts (through its proxy, SMD-2289) and n8n, which calls it.
    # The rules that close emitters' network name no interface, so they hold
    # on every network it joins.
    networks: [data, egress]
    # As n8n's: a configuration refusal (a missing key) exits 2 and the policy
    # restarts it. The runner waits 30 s before that exit, so `ps` shows it up
    # for under 30 s at a time rather than a hot loop, and its log says why
    # each time. A server should come back after a reboot.
    restart: unless-stopped
    # A stop waits for a running step to hand back what it holds: the runner
    # gives it two SIGTERMs and up to 5 s (review pass 4).
    stop_grace_period: 15s
    logging: *logging

  # The authorization server (SMD-2285; docs/operator-surface-tiers.md,
  # decisions 13-16): oidc-provider in a small Bun service of ours
  # (auth/server.ts), off unless the `auth` profile is on. Before its first
  # start, `bun deploy/auth/provision.ts --init` writes its secrets into
  # deploy/.env and `bun deploy/auth/provision.ts` checks the file; set
  # OB1_PUBLIC_ORIGIN yourself (deploy/README.md, "Authorization server").
  #
  # It publishes no port. The proxy routes `/auth` and the three discovery
  # paths outside it here, as auth.ob1.internal on the mesh, while it answers
  # (x-proxy-routes, the auth router; SMD-1846). It joins two networks and
  # shares neither with Postgres, Ollama, Jev, n8n or the workers: `mesh`,
  # internal, where the proxy meets it, the MCP server probes it (SMD-2382)
  # and the GUI will; and `auth-egress`, which nothing else joins, for the
  # client metadata documents it fetches (each through its fetch guard, which
  # refuses private and *.ob1.internal targets). Not `egress`: the stack's
  # provider callers and model services meet there, and the one server here
  # that fetches what an outsider names would reach every one of them
  # (SMD-2583).
  #
  # Its state (sessions, grants, refresh tokens, registered clients) is one
  # SQLite file in the auth-data volume, and it holds no Postgres credential
  # and shares no network with Postgres. Back the volume up with deploy/.env
  # (deploy/README.md).
  auth:
    build:
      context: ./auth
    profiles: ["auth"]
    # No `:?` for the reason n8n's block gives: compose interpolates every
    # service, profile or not. The server checks every setting at start,
    # names each one missing or malformed (auth/config.ts) and exits 2 after
    # 30 s; the restart policy brings it back, its log says why each time, and
    # the 30 s keeps that from a hot loop (three restarts a second, measured).
    #
    # Exactly these, and no env_file: the container never sees the rest of
    # deploy/.env (the Postgres password, the brain's keys) or the operator's
    # plain password, only its hash. The POC's OB1_AUTH_POC_ERROR_DETAIL is
    # not passed, so deploy/.env cannot turn it on. A service client named in
    # OB1_AUTH_SERVICES needs its secret's line added here
    # (OB1_AUTH_SECRET_<ID>: ${OB1_AUTH_SECRET_<ID>:-}); provision.ts names it.
    environment:
      OB1_PUBLIC_ORIGIN: ${OB1_PUBLIC_ORIGIN:-}
      OB1_AUTH_TIERS: ${OB1_AUTH_TIERS:-}
      OB1_AUTH_SERVICES: ${OB1_AUTH_SERVICES:-}
      OB1_AUTH_MAX_CLIENTS: ${OB1_AUTH_MAX_CLIENTS:-}
      OB1_AUTH_REGISTRATIONS_PER_HOUR: ${OB1_AUTH_REGISTRATIONS_PER_HOUR:-}
      OB1_AUTH_TRUSTED_PROXY: ${OB1_AUTH_TRUSTED_PROXY:-}
      OB1_AUTH_FORWARDED_HOPS: ${OB1_AUTH_FORWARDED_HOPS:-}
      # deploy/.env's (the shell's, when it sets one), and never the command
      # line's --profile: the server refuses to start unless it names auth,
      # the stack's configured state (ADR decision 16; auth/config.ts). The
      # proxy routes /auth here while the server answers, so this is what
      # keeps a `--profile auth` given on the command line alone off the
      # public origin.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      OB1_AUTH_JWKS: ${OB1_AUTH_JWKS:-}
      OB1_AUTH_COOKIE_KEYS: ${OB1_AUTH_COOKIE_KEYS:-}
      OB1_AUTH_OPERATOR_PASSWORD_HASH: ${OB1_AUTH_OPERATOR_PASSWORD_HASH:-}
      OB1_AUTH_SECRET_GUI: ${OB1_AUTH_SECRET_GUI:-}
      OB1_AUTH_SECRET_MCP: ${OB1_AUTH_SECRET_MCP:-}
      OB1_AUTH_SECRET_MCP_CANARY: ${OB1_AUTH_SECRET_MCP_CANARY:-}
      OB1_AUTH_SECRET_MCP_WORKING: ${OB1_AUTH_SECRET_MCP_WORKING:-}
    networks:
      mesh:
        aliases: [auth.ob1.internal]
      auth-egress: {}
    volumes:
      - auth-data:/data
    # The image's own files are read-only and the server keeps no capability:
    # it writes nothing but its store, and listens on an unprivileged port.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The server stops on SIGTERM, closing its store (auth/server.ts); init
    # forwards the signal and reaps, as n8n's runner has it.
    init: true
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

networks:
  # The ADR's networks (docs/operator-surface-tiers.md, "Two networks"), as
  # the network move built them (SMD-2583). Every service names its own, so
  # compose makes no default network and nothing joins one.
  #   mesh   internal: the proxy, the MCP server (mcp.ob1.internal), the REST
  #          core (api.ob1.internal) and the authorization server
  #          (auth.ob1.internal), each called by that name; a tier of another
  #          project joins it under its own (compose.canary.yaml).
  #   data   internal: Postgres, and only what connects to it — the migrator,
  #          the two servers, board-sync, the workers, the import runner and
  #          its role's one-shot. No other project joins it.
  #   egress outward: whatever calls a model provider or a vendor (the two
  #          servers, board-sync, the workers, the import runner, n8n), and
  #          the stack's own Ollama and Jev, which fetch their weights there
  #          and are called there by name.
  #   auth-egress  outward, the authorization server's alone.
  #   edge   outward, the proxy's alone: where its port is published.
  # An internal network has no route out and does not forward a name it does
  # not hold to the host's resolvers (measured on podman 6); it also
  # publishes no port, so Postgres's, in compose.host-ports.yaml, comes with
  # a network of its own.
  mesh:
    internal: true
  data:
    internal: true
  egress: {}
  auth-egress: {}
  edge: {}

volumes:
  pgdata:
  ollama:
  jev-models:
  n8n-data:
  auth-data:

configs:
  # The proxy's route table, inline: x-proxy-routes at the top of this file.
  proxy-routes:
    content: *proxy-routes
