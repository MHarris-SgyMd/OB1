# A complete Open Brain stack with no Supabase anywhere.
#
# This is the migration plan's Phase 4 exit test made literal: a change reaches a
# running system through an ordinary pipeline, with no Supabase CLI installed and
# no supabase.com account involved. Postgres, the schema, and the MCP server.
#
#   podman compose -f deploy/compose.yaml --profile local-models up --build
#   docker compose -f deploy/compose.yaml --profile local-models up --build
#
# The profile is the stack's own Ollama, where the server's model endpoint
# defaults; drop it when deploy/.env names another provider.
#
# Then point an MCP client at http://127.0.0.1:8000/?key=$MCP_ACCESS_KEY
#
# Secrets come from deploy/.env, which is gitignored. Copy .env.example first.
# Nothing here is production-shaped — no TLS, no backups, no resource limits — it
# is a working reference for what the pieces are once Supabase is gone.
#
# What the host can reach: only the server, and only from the host itself. Every
# published port here names its address, `127.0.0.1` unless the operator sets
# the `*_BIND` knob, because an address-less `"8000:8000"` binds 0.0.0.0 — every
# interface — and this stack holds a brain (personal data at rest) behind one
# password and one key over plain HTTP. Postgres and Ollama publish nothing;
# the server reaches both over the compose network by service name, and a tool
# run from a checkout gets them through compose.host-ports.yaml (a second -f),
# loopback again unless told otherwise. scripts/check-fork-consistency.ts
# check 13 refuses a mapping that drops the address (SMD-1844).

name: open-brain

# The one place the Ollama image is named: the model server and the pull job
# below run the same image, so a bump is one edit (the fork's recurring defect
# is a value defined twice). Pinned to a release, not `:latest`, for the reason
# postgres is: a floating tag moves under a working deployment. The release job
# resolves this tag to a digest and writes `ollama/ollama@sha256:…` into the
# release's compose overlay (SMD-1860; deploy/README.md, "Pinning a release").
x-ollama-image: &ollama-image ollama/ollama:0.34.3

services:
  # Replaces: the Supabase-hosted Postgres.
  #
  # Pinned to a pgvector release, not the floating `pg16` tag. Migration 014
  # declares `hnsw.iterative_scan` on match_thoughts, which exists from pgvector
  # 0.8.0; on an older image the migrator fails on 014 and the stack does not
  # start. A floating tag could also move under a working deployment. Change
  # the pin deliberately and re-run the schema tests against it.
  #
  # Memory: 014 seeds hnsw.scan_mem_multiplier = 8 on the database, so a
  # filtered search that reaches the HNSW walk may use work_mem x 8 (32 MB at
  # the 4 MB default) per scan node, two per call, per connection — up to
  # ~640 MB across the server's default pool of ten on top of shared_buffers.
  # Thin filters never walk (they are answered exactly), so this is a ceiling
  # for broad filters on large tables; lower the multiplier with ALTER DATABASE
  # where memory is tighter than latency (deploy/.env.example has the form).
  #
  # No random_page_cost here. It was measured as the cost-model remedy for the
  # planner preferring a sequential scan over the HNSW index at the shipped
  # width (upstream #469): the estimate omits the detoast reads a vector table
  # pays, so no constant fixes it. Migration 019 puts the setting on the
  # function instead, where it travels with the schema; its header has the numbers.
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    # /dev/shm: a container gets 64 MB, and a parallel HNSW build keeps its
    # whole graph in dynamic shared memory there, sized by maintenance_work_mem
    # — so rebuilding the vector index after a bulk load of a real corpus fails
    # with "could not resize shared memory segment ... No space left on device"
    # under the default (SMD-1018 met it at a million rows). A tmpfs cap,
    # backed only as used; raise it with maintenance_work_mem, or build with
    # max_parallel_maintenance_workers = 0, which uses ordinary backend memory.
    shm_size: ${POSTGRES_SHM_SIZE:-1g}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:`. The superuser on the whole brain, guarded by POSTGRES_PASSWORD
    # alone, is not published to the host by default — the mapping this used to
    # carry bound 0.0.0.0, so a LAN peer reached it on the password. The server
    # and the migrator reach it as `postgres:5432` on the compose network. For
    # psql or pg_dump: `compose exec postgres psql -U postgres openbrain` (with
    # the -f files the stack runs with). For a tool run from a checkout
    # (reembed.ts, extract-entities.ts, consolidate.ts, the evals): add
    # `-f compose.host-ports.yaml`, which publishes it on loopback — chosen when
    # the stack comes up, since adding or dropping it later recreates this
    # container and, through depends_on, the server (SMD-1844; deploy/README.md,
    # "What is reachable from where").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openbrain"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Replaces: pasting SQL into the Supabase dashboard's SQL editor.
  # Runs to completion, then exits. The server waits for it.
  #
  # Built from db/Dockerfile — the ob1-migrate image the release job publishes
  # per tag beside ob1-server (SMD-1860) — rather than run off a read-only mount
  # of the checkout's db/ on a stock Bun image, so a release's compose overlay
  # pulls the migrator that wrote the schema_version its server checks, on a
  # machine with no checkout, and this stack and a pinned one run the same
  # bytes. Root context, as server's: migrate.ts imports db/config.mjs, and the
  # root .dockerignore keeps the context to what the two images need.
  migrate:
    build:
      context: ..
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      # The vector width is baked into the schema here and cannot change later
      # without re-embedding. migrate.ts refuses a model/width mismatch.
      # Must match db/config.mjs's DEFAULT_EMBEDDING_*. Compose substitutes its own
      # fallback before the process ever starts, so a stale value here silently
      # overrides the code default rather than deferring to it.
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
      # Opt-in trigram index. No fallback value here on purpose: db/config.mjs
      # owns the default, and a `:-off` written in would be a second copy of it —
      # the defect this fork keeps finding. Unset simply means unset.
      OB1_TRGM_INDEX: ${OB1_TRGM_INDEX:-}
      # Migration 013 records this in ob1_config, so preflight can tell what the
      # schema was migrated under. Same no-fallback rule as above.
      OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
      # migrate.ts calls validateEmbeddingConfig, which reads this. Without it the
      # runner and the server could disagree about whether a width is legal.
      OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
      # Migration 023's one backfill call: unset is every row waiting; a number
      # is one batch, for a brain with millions of legacy rows that finishes by
      # hand (023's header). Same no-fallback rule as above.
      OB1_BACKFILL_LIMIT: ${OB1_BACKFILL_LIMIT:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Replaces: the Supabase Edge Function, and `supabase functions deploy`.
  server:
    build:
      # Repo root, not server-portable/, because preflight.ts imports
      # ../db/config.mjs — the single definition of the embedding contract, shared
      # with migrate.ts so the runner and the server cannot disagree about it. A
      # context of server-portable/ cannot reach it, and the container crashlooped
      # on the missing module.
      context: ..
      dockerfile: server-portable/Dockerfile
    # Anchored: `board-sync` below inherits this block whole (`<<: *server-env`),
    # so the provider, embedding and egress knobs are forwarded once, here, and a
    # worker that embeds and tags exactly as a capture does reads exactly what
    # the server reads. Check 14 parses anchors and merge keys (SMD-1954).
    environment: &server-env
      # No OB1_STORE on purpose: the SQL store is the server's default (FORK.md
      # change 97), and this stack — the "Full stack, no Supabase" CI job — is
      # the deployment that proves it. Setting it here would let the default
      # drift back to PostgREST with nothing in CI noticing.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      MCP_ACCESS_KEYS: ${MCP_ACCESS_KEYS:?set MCP_ACCESS_KEYS in deploy/.env — mint with server-portable/keygen.ts}
      # Not required when OB1_LLM_BASE_URL points at a local provider; preflight
      # decides, and fails the container if a remote endpoint has no credential.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Must match db/config.mjs's DEFAULT_EMBEDDING_*. Compose substitutes its own
      # fallback before the process ever starts, so a stale value here silently
      # overrides the code default rather than deferring to it.
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
      # The server never builds the index; it needs this only so preflight can
      # notice the setting and the database disagreeing. Omitting it here would
      # make the check silently compare against a default the migrator did not use.
      OB1_TRGM_INDEX: ${OB1_TRGM_INDEX:-}
      # Read per capture. Preflight refuses to start if this is on against a
      # database without migration 013, so a stale value here fails loudly.
      OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
      # Unset, derived from the embedding model's measured window; preflight
      # prints the value, and warns when an explicit one is over the window.
      OB1_CHUNK_TOKENS: ${OB1_CHUNK_TOKENS:-}
      OB1_CHUNK_OVERLAP: ${OB1_CHUNK_OVERLAP:-}
      # The entity-extraction window (SMD-1879): unset, derived from the
      # metadata model's served context; preflight prints the value and the
      # model it came from. The server never extracts — forwarded so preflight,
      # in this container, reports what db/extract-entities.ts will do.
      OB1_EXTRACT_CHUNK_TOKENS: ${OB1_EXTRACT_CHUNK_TOKENS:-}
      OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
      OB1_LLM_API_KEY: ${OB1_LLM_API_KEY:-}
      # A chat endpoint of its own, when the two calls are not served by one
      # provider (SMD-1902). Unset, chat goes where the embeddings go.
      OB1_CHAT_BASE_URL: ${OB1_CHAT_BASE_URL:-}
      OB1_CHAT_API_KEY: ${OB1_CHAT_API_KEY:-}
      # The supersession judge's model when it is not the metadata model
      # (SMD-1901). The server never judges; preflight, which runs in this
      # container, reports it beside the metadata model and probes it with --deep.
      OB1_JUDGE_MODEL: ${OB1_JUDGE_MODEL:-}
      # The typed-decision tier (SMD-2050; the jev service below). The server
      # never decides; preflight, which runs in this container, dials the tier
      # when OB1_JEV_BASE_URL is set and fails the start when it does not
      # answer — so no fallback here: a default would fail every stack that
      # does not run the profile. With it, deploy/.env names
      # OB1_JEV_BASE_URL=http://jev:8020 and OB1_JEV_LOCAL=1.
      OB1_JEV_BASE_URL: ${OB1_JEV_BASE_URL:-}
      OB1_JEV_MODEL: ${OB1_JEV_MODEL:-}
      OB1_JEV_LOCAL: ${OB1_JEV_LOCAL:-}
      OB1_LLM_TIMEOUT: ${OB1_LLM_TIMEOUT:-}
      # What may leave the box (SMD-1903): whether a thought's text may reach
      # an endpoint not declared local — deny (the default), allow or off —
      # and its terms. "Local" is DECLARED, never read off the address, so
      # the stack's own `ollama` service (the fallback below) and an Ollama on
      # the host both need OB1_LLM_LOCAL=1 in deploy/.env; without it, under
      # the default, every embedding is refused and preflight's `embeddings
      # egress` row says so. No fallback here for the same reason: the compose
      # file must not declare local on the operator's behalf.
      OB1_EGRESS_POLICY: ${OB1_EGRESS_POLICY:-}
      OB1_EGRESS_ALLOW: ${OB1_EGRESS_ALLOW:-}
      OB1_EGRESS_DENY: ${OB1_EGRESS_DENY:-}
      OB1_LLM_LOCAL: ${OB1_LLM_LOCAL:-}
      OB1_CHAT_LOCAL: ${OB1_CHAT_LOCAL:-}
      # Where both model calls go. Unset in deploy/.env this is the stack's own
      # Ollama — the `ollama` service the local-models profile adds, by name on
      # the compose network — so the profile needs nothing set. Not a copy of
      # db/config.mjs's default: that is 127.0.0.1:11434, right from a shell on
      # the host and, inside this container, the container's own loopback with
      # nothing on it. Measured before SMD-1843, when nothing here forwarded the
      # knob at all: preflight called that address local, wanted no credential,
      # dialled nothing without --deep and said OK; the first capture failed in
      # 7 ms with "Unable to connect", and the server logged nothing. An Ollama
      # on the host is http://host.containers.internal:11434/v1 (podman; Docker
      # Desktop: host.docker.internal); OpenRouter is https://openrouter.ai/api/v1
      # with a key — deploy/.env.example, "Model provider". Check 14 holds this
      # fallback to exactly http://<service>:11434/v1 for a service in this file
      # that db/config.mjs's LOCAL_PROVIDER_SERVICES names — the list preflight
      # calls local — so the default here is one the container will accept.
      OB1_LLM_BASE_URL: ${OB1_LLM_BASE_URL:-http://ollama:11434/v1}
      # Metadata extraction: the model (db/config.mjs owns the default —
      # ollama-pull's fallback below is a copy checkEmbeddingDefaults holds
      # equal to it), its sampling temperature, and whether a thinking model
      # reasons first. The no-fallback rule again.
      OB1_METADATA_MODEL: ${OB1_METADATA_MODEL:-}
      OB1_METADATA_TEMPERATURE: ${OB1_METADATA_TEMPERATURE:-}
      OB1_METADATA_REASONING: ${OB1_METADATA_REASONING:-}
      # The opt-in query log (migration 034): off unless deploy/.env says on,
      # and preflight prints which. Until SMD-1843 nothing here forwarded it, so
      # SETUP.md's switch never reached the container. Every knob the server
      # declares (server-portable/index.ts, type Env) is forwarded now, and
      # scripts/check-fork-consistency.ts check 14 fails on the next one that
      # is not — a name in a comment, or on ollama-pull's command line, is not
      # a forward.
      OB1_QUERY_LOG: ${OB1_QUERY_LOG:-}
      OB1_QUERY_LOG_RETENTION_DAYS: ${OB1_QUERY_LOG_RETENTION_DAYS:-}
      # Which pipeline tier this server runs as (SMD-1806); stamped on every
      # query_log row. Unset is a plain brain. The three-tier compose
      # (compose.tiers.yaml) sets it per service; here it is a plain forward.
      OB1_TIER: ${OB1_TIER:-}
      OB1_AGENT_CACHE_TTL_MS: ${OB1_AGENT_CACHE_TTL_MS:-}
      OPEN_BRAIN_CITATION_BASE_URL: ${OPEN_BRAIN_CITATION_BASE_URL:-}
      # No `:-10` here any more: store-sql.ts owns the default and reads "" as
      # unset (it read Number("") = 0 until SMD-1843's first review pass found
      # the copy and the reader together — Bun's SQL refuses a pool of 0 at
      # construction, so the server would have failed preflight at the data
      # layer, loudly, over a default that should have been 10).
      OB1_PG_POOL: ${OB1_PG_POOL:-}
      PORT: "8000"
    ports:
      # Loopback unless SERVER_BIND says otherwise. The one published port of the
      # stack. A remote client — a claude.ai connector, another machine — goes
      # through a TLS proxy or a tunnel; one on this host dials 127.0.0.1 and
      # needs no change here. `SERVER_BIND=0.0.0.0` is for a proxy on another
      # machine, and puts the key on the wire in clear on every request: the
      # header is as visible as `?key=` over plain HTTP (SMD-1844).
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Keeps the brain in lockstep with the Linear board (SMD-1954). Optional —
  # `--profile board-sync`; a brain that is not the fork's own never runs it.
  #
  # `bun db/sync-linear.ts --loop`: every OB1_BOARD_SYNC_INTERVAL seconds (300)
  # it lists the issues of the OB1_LINEAR_INITIATIVE's projects, reads the
  # brain's ticket rows, and writes the difference — a new issue captured, a
  # moved one updated in place — through the server's own store and embedder
  # (db/sync-linear.ts's header). No port, no key: it reaches Postgres as the
  # migrator does and writes as the actor `board-sync`. Mounted read-only: db/
  # and server-portable/, the tool's whole import surface — NOT the checkout,
  # whose deploy/.env and evals/.env would otherwise sit on the tool's own
  # `.env` search path inside the container (third review pass; the fifth moved
  # the two shared modules it read from evals/ into db/ so these two mounts are
  # the boundary, not a list of files). Like the migrator it needs no
  # `bun install` — Bun built-ins and in-tree modules only.
  #
  # The model knobs are the server's, inherited from its anchor above; the two
  # of its own are LINEAR_API_KEY (a personal API key, read-only use — it
  # fetches issues) and OB1_LINEAR_INITIATIVE. The egress gate applies to its
  # embed and tag calls as to a capture's: with the provider on the host,
  # deploy/.env carries OB1_LLM_LOCAL=1 or every ticket lands without a vector.
  board-sync:
    image: oven/bun:1.4.0-alpine
    profiles: ["board-sync"]
    working_dir: /app
    volumes:
      - ../db:/app/db:ro
      - ../server-portable:/app/server-portable:ro
    environment:
      <<: *server-env
      # The merge brings the server's whole block; the two things this worker
      # does not read are unset again, so its environment is exactly what it
      # reads (second review pass) — the key material stays with the server.
      MCP_ACCESS_KEYS: ""
      PORT: ""
      # No `:?` here: compose interpolates every service's block whether or not
      # its profile is active, so a required-variable error would fail every
      # `up` without the profile (the first review pass found the full-stack CI
      # job and every existing stack). The tool refuses to start without it.
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      OB1_LINEAR_INITIATIVE: ${OB1_LINEAR_INITIATIVE:-}
      OB1_BOARD_SYNC_INTERVAL: ${OB1_BOARD_SYNC_INTERVAL:-}
    command: ["bun", "db/sync-linear.ts", "--loop"]
    # SIGTERM ends the loop after the issue in hand, not the pass — one embed
    # and one write, seconds — and the brain is the state, so a pass cut short
    # is finished by the next; this is the room for that one issue.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not `unless-stopped`: the tool exits 2 on a missing LINEAR_API_KEY or a
    # bad interval — configuration, which a restart does not fix — and an
    # unconditional restart made that refusal a crash loop with the same hint
    # filling the log (fifth review pass). Three tries cover a database not yet
    # answering; then the service stops and `ps` says so.
    restart: on-failure:3

  # Replaces: OpenRouter. Optional — enable with `--profile local-models`.
  #
  # Ollama exposes an OpenAI-compatible surface at /v1, so the server needs no
  # code change: its OB1_LLM_BASE_URL falls back to this service (above), and no
  # credential is sent to it. With this running, nothing about a captured
  # thought leaves the host.
  ollama:
    image: *ollama-image
    profiles: ["local-models"]
    volumes:
      - ollama:/root/.ollama
    # No `ports:`. An unauthenticated model API; the server and ollama-pull reach
    # it as `ollama:11434` on the compose network, and nothing in the stack needs
    # it from the host. `compose exec ollama ollama pull <model>` (with the -f
    # files the stack runs with) for a third model; compose.host-ports.yaml
    # publishes it on loopback for an eval run from a checkout (SMD-1844).
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Pulls the two models — three when OB1_JUDGE_MODEL names one — then exits.
  # First run downloads a few hundred MB.
  ollama-pull:
    image: *ollama-image
    profiles: ["local-models"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Read by the shell below, not by compose: `$$` reaches the container as
      # `$`, so an unset knob pulls nothing rather than a model named "".
      OB1_JUDGE_MODEL: ${OB1_JUDGE_MODEL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
        ollama pull ${OB1_METADATA_MODEL:-qwen2.5:7b}
        [ -z "$$OB1_JUDGE_MODEL" ] || ollama pull "$$OB1_JUDGE_MODEL"
    restart: "no"

  # The typed-decision tier (SMD-2050). Optional — `--profile jev`; a brain
  # that runs none of the Jev spikes never builds it.
  #
  # A Jev-class model answers a bounded question — "is this true of this
  # text?", "which of these options?" — with a calibrated probability in one
  # forward pass, no generation. Ollama cannot serve that (its API exposes no
  # option logits), so this is its own process: jev/serve.ts, Verdict v1.4 on
  # onnxruntime-node's CPU provider, behind the contract in
  # server-portable/jev-contract.ts that server-portable/jev.ts calls. Outside
  # Ollama's scheduler, so OLLAMA_MAX_LOADED_MODELS neither counts nor evicts
  # it; about 1 GB resident (jev/README.md has the measured footprint).
  #
  # No weights in the image: on first start the service fetches the pinned
  # files (606 MB) into the jev-models volume and verifies every file's sha256
  # on every start; a file that does not match is refused, never loaded.
  jev:
    build:
      context: ..
      dockerfile: jev/Dockerfile
    profiles: ["jev"]
    volumes:
      - jev-models:/models
    # No `ports:`. An unauthenticated API, like Ollama's: the server's
    # preflight and a spike in a container reach it as `jev:8020` on the
    # compose network; compose.host-ports.yaml publishes it on loopback for a
    # spike run from a checkout.
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8020/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      # The first start downloads the weights before it listens.
      start_period: 600s
    # A fetch that fails or a file that hashes wrong exits 1 with the file
    # named; three tries cover a network that was not up yet, then the service
    # stops and `ps` says so rather than looping (the board-sync rule above).
    restart: on-failure:3

volumes:
  pgdata:
  ollama:
  jev-models:
