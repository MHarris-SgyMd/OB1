# A complete Open Brain stack with no Supabase anywhere.
#
# This is the migration plan's Phase 4 exit test made literal: a change reaches a
# running system through an ordinary pipeline, with no Supabase CLI installed and
# no supabase.com account involved. Postgres, the schema, and the MCP server.
#
#   podman compose -f deploy/compose.yaml up --build
#   docker compose -f deploy/compose.yaml up --build
#
# Then point an MCP client at http://localhost:8000/?key=$MCP_ACCESS_KEY
#
# Secrets come from deploy/.env, which is gitignored. Copy .env.example first.
# Nothing here is production-shaped — no TLS, no backups, no resource limits — it
# is a working reference for what the pieces are once Supabase is gone.

name: open-brain

services:
  # Replaces: the Supabase-hosted Postgres.
  #
  # Pinned to a pgvector release, not the floating `pg16` tag. Migration 014
  # declares `hnsw.iterative_scan` on match_thoughts, which exists from pgvector
  # 0.8.0; on an older image the migrator fails on 014 and the stack does not
  # start. A floating tag could also move under a working deployment. Change
  # the pin deliberately and re-run the schema tests against it.
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for psql and pg_dump during a migration. Drop this in production.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openbrain"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Replaces: pasting SQL into the Supabase dashboard's SQL editor.
  # Runs to completion, then exits. The server waits for it.
  migrate:
    image: oven/bun:1.4.0-alpine
    working_dir: /app
    volumes:
      - ../db:/app:ro
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      # The vector width is baked into the schema here and cannot change later
      # without re-embedding. migrate.ts refuses a model/width mismatch.
      # Must match db/config.mjs's DEFAULT_EMBEDDING_*. Compose substitutes its own
      # fallback before the process ever starts, so a stale value here silently
      # overrides the code default rather than deferring to it.
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
      # Opt-in trigram index. No fallback value here on purpose: db/config.mjs
      # owns the default, and a `:-off` written in would be a second copy of it —
      # the defect this fork keeps finding. Unset simply means unset.
      OB1_TRGM_INDEX: ${OB1_TRGM_INDEX:-}
      # Migration 013 records this in ob1_config, so preflight can tell what the
      # schema was migrated under. Same no-fallback rule as above.
      OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
      # migrate.ts calls validateEmbeddingConfig, which reads this. Without it the
      # runner and the server could disagree about whether a width is legal.
      OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
    # No `bun install`: migrate.ts imports only Bun built-ins and node: modules.
    # The one dependency in db/package.json is pglite, used solely by the tests.
    # This also keeps the mount read-only — `bun install` would need to write
    # node_modules into it, which fails on a clean checkout.
    command: ["bun", "migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Replaces: the Supabase Edge Function, and `supabase functions deploy`.
  server:
    build:
      # Repo root, not server-portable/, because preflight.ts imports
      # ../db/config.mjs — the single definition of the embedding contract, shared
      # with migrate.ts so the runner and the server cannot disagree about it. A
      # context of server-portable/ cannot reach it, and the container crashlooped
      # on the missing module.
      context: ..
      dockerfile: server-portable/Dockerfile
    environment:
      OB1_STORE: sql
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      MCP_ACCESS_KEYS: ${MCP_ACCESS_KEYS:?set MCP_ACCESS_KEYS in deploy/.env — mint with server-portable/keygen.ts}
      # Not required when OB1_LLM_BASE_URL points at a local provider; preflight
      # decides, and fails the container if a remote endpoint has no credential.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Must match db/config.mjs's DEFAULT_EMBEDDING_*. Compose substitutes its own
      # fallback before the process ever starts, so a stale value here silently
      # overrides the code default rather than deferring to it.
      OB1_EMBEDDING_DIM: ${OB1_EMBEDDING_DIM:-1024}
      OB1_EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
      # The server never builds the index; it needs this only so preflight can
      # notice the setting and the database disagreeing. Omitting it here would
      # make the check silently compare against a default the migrator did not use.
      OB1_TRGM_INDEX: ${OB1_TRGM_INDEX:-}
      # Read per capture. Preflight refuses to start if this is on against a
      # database without migration 013, so a stale value here fails loudly.
      OB1_CHUNK_CONTEXT: ${OB1_CHUNK_CONTEXT:-}
      OB1_CHUNK_TOKENS: ${OB1_CHUNK_TOKENS:-}
      OB1_CHUNK_OVERLAP: ${OB1_CHUNK_OVERLAP:-}
      OB1_EMBEDDING_DIMENSIONS: ${OB1_EMBEDDING_DIMENSIONS:-}
      OB1_LLM_API_KEY: ${OB1_LLM_API_KEY:-}
      OB1_AGENT_CACHE_TTL_MS: ${OB1_AGENT_CACHE_TTL_MS:-}
      OPEN_BRAIN_CITATION_BASE_URL: ${OPEN_BRAIN_CITATION_BASE_URL:-}
      OB1_PG_POOL: ${OB1_PG_POOL:-10}
      PORT: "8000"
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Replaces: OpenRouter. Optional — enable with `--profile local-models`.
  #
  # Ollama exposes an OpenAI-compatible surface at /v1, so the server needs no
  # code change: OB1_LLM_BASE_URL points here and no credential is sent. With this
  # running, nothing about a captured thought leaves the host.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-models"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Pulls the two models, then exits. First run downloads a few hundred MB.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-models"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${OB1_EMBEDDING_MODEL:-qwen3-embedding:4b}
        ollama pull ${OB1_METADATA_MODEL:-qwen2.5:7b}
    restart: "no"

volumes:
  pgdata:
  ollama:
