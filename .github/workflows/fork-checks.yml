          # stopped for the migration too; with stable's read key in the
          # canary's file in place of its own, padded with spaces (compared as
          # compose reads it, spaces aside), the up clears it, said, and leaves
          # board-sync out of the coordinator's passes, said. SMD-3476: with
          # no OB1_PASSES line, the file is given the stand-ins' passes.
          sed -i '/^LINEAR_API_KEY=/d; /^OB1_PASSES=/d' .env.canary.local
          printf 'LINEAR_API_KEY=" %s "\n' "$(sed -n 's/^LINEAR_API_KEY=//p' .env | tr -d "\"'")" >> .env.canary.local
          rc=0; FAKE_URL='http://127.0.0.1:8013/mcp?key=x' ./canary.sh up --no-refresh --no-smoke > /tmp/canary-nokey.out 2>&1 || rc=$?
          { grep -qF "cleared LINEAR_API_KEY (stable's LINEAR_API_KEY)" /tmp/canary-nokey.out && grep -qF 'canary coordinator stopped for the migration' /tmp/canary-nokey.out \
            && grep -qF 'canary board-sync off, left out of the coordinator' /tmp/canary-nokey.out; } || { cat /tmp/canary-nokey.out >&2; echo "up --no-refresh with stable's LINEAR_API_KEY did not clear it, stop the coordinator and leave board-sync out, said" >&2; exit 1; }
          if grep -qF ci-dummy-linear-key .env.canary.local; then echo "the canary's env file still holds stable's read key" >&2; exit 1; fi
          for retired in sleep board-sync; do
            grep -qF "the canary's $retired container, retired in SMD-3476 (the coordinator runs its pass), removed" /tmp/canary-nokey.out || { cat /tmp/canary-nokey.out >&2; echo "up --no-refresh did not say it removed the retired $retired container" >&2; exit 1; }
            if [ -n "$(docker ps -aq --filter label=com.docker.compose.project=open-brain-canary --filter "label=com.docker.compose.service=$retired")" ]; then echo "up --no-refresh left the retired $retired container" >&2; exit 1; fi
          done
          grep -qF "wrote to the canary's env file, $PWD/.env.canary.local: OB1_PASSES=\"sleep,board-sync\"" /tmp/canary-nokey.out || { cat /tmp/canary-nokey.out >&2; echo "up --no-refresh did not carry the retired containers' passes to OB1_PASSES" >&2; exit 1; }
          [ "$(grep -c '^OB1_PASSES=' .env.canary.local)" = 1 ] || { echo "the canary's env file holds other than one OB1_PASSES line" >&2; exit 1; }
          board_env | grep -qx 'OB1_PASSES=sleep' || { echo "the canary's coordinator runs other than sleep with no key of its own for board-sync: $(board_env | grep '^OB1_PASSES=')" >&2; exit 1; }
          { [ "$rc" = 1 ] && grep -qF 'canary sleep held by the coordinator, running nothing' /tmp/canary-nokey.out && grep -qF 'migrated in place (its own rows kept)' /tmp/canary-nokey.out; } || { cat /tmp/canary-nokey.out >&2; echo "up --no-refresh with sleep named and no OB1_WORKER_KEY exited $rc, not 1 with sleep held" >&2; exit 1; }
          printf 'OB1_WORKER_KEY=ci-canary-worker-key-not-stables\n' >> .env.canary.local
          # SMD-3312: the canary's own read key back, so board-sync comes back.
          # Below the empty LINEAR_API_KEY= line the clearing left, as an
          # operator adding the key after it would: an empty line is no second
          # key (review pass 3).
          grep -qx 'LINEAR_API_KEY=' .env.canary.local || { echo "the clearing left no empty LINEAR_API_KEY= line" >&2; exit 1; }
          printf 'LINEAR_API_KEY=ci-canary-own-linear-key\n' >> .env.canary.local
          # The file as a canary mended by SMD-2874 PR 2 holds it, the dogfood
          # canary's next upgrade: its write key alone, no forward key. The up
          # mints the forward key, adding its entry to MCP_ACCESS_KEYS beside
          # the write key, which it keeps (SMD-2287 review pass 1: a mutant
          # that wrote the raw key without its entry passed every up above).
          sed -i '/^OB1_FORWARDER_KEY=/d; /^MCP_ACCESS_KEYS=/d' .env.canary.local
          printf 'MCP_ACCESS_KEYS=open-brain-canary:write:%s\n' "$(printf '%s' "$CANARY_KEY" | shasum -a 256 | cut -d' ' -f1)" >> .env.canary.local
          # A retired sleep container again: removed, and nothing written, the file naming its passes now.
          standin sleep > /dev/null
          # The canary's `server`, retired in SMD-2287 PR 6b: a stand-in under
          # its labels, as a canary stood up before then keeps the container,
          # which compose.yaml no longer names. The up removes it, said.
          docker run -d --init --name open-brain-canary-server-1 --label com.docker.compose.project=open-brain-canary --label com.docker.compose.service=server \
            --label com.docker.compose.oneoff=False --label com.docker.compose.container-number=1 --entrypoint sleep docker.io/oven/bun:1.4.3-alpine 600 > /dev/null
          FAKE_URL='http://127.0.0.1:8013/mcp?key=x' ./canary.sh up --no-refresh --no-smoke | tee /tmp/canary-norefresh.out
          grep -F "the canary's server container, retired in SMD-2287 PR 6b, removed" /tmp/canary-norefresh.out
          if [ -n "$(docker ps -aq --filter label=com.docker.compose.project=open-brain-canary --filter label=com.docker.compose.service=server)" ]; then echo "up --no-refresh left the canary's retired server container" >&2; exit 1; fi
          grep -F "minted the canary's own forward key, open-brain-canary-mcp-forwarder (its hash in MCP_ACCESS_KEYS, the raw key in OB1_FORWARDER_KEY)" /tmp/canary-norefresh.out
          if grep -F "minted the canary's own write key" /tmp/canary-norefresh.out; then echo "up --no-refresh minted a write key where the canary had its own" >&2; exit 1; fi
          FORWARD_3="$(canary_forward)"
          [ "${#FORWARD_3}" = 64 ] || { echo "up --no-refresh left the canary no forward key" >&2; exit 1; }
          [ "$(sed -n 's/^MCP_ACCESS_KEYS=//p' .env.canary.local | tr -d "\"'")" = "$(own_keys_with "$FORWARD_3")" ] || { echo "up --no-refresh did not give the canary its forward key beside its write key" >&2; exit 1; }
          if grep -qFf <(printf '%s\n' "$FORWARD_2" "$FORWARD_3" "$CANARY_KEY" "$CANARY_FORWARD" "$OB1_SMOKE_FORWARD_KEY" "$STABLE_FWD" "$PG_CANARY" "$canary_plugin") /tmp/canary-edited.out /tmp/canary-nokey.out /tmp/canary-norefresh.out; then echo "canary.sh printed a raw key, the canary's or stable's forward key" >&2; exit 1; fi
          grep -F 'migrate open-brain-canary-postgres-1 in place' /tmp/canary-norefresh.out
          grep -F 'canary coordinator stopped for the migration' /tmp/canary-norefresh.out
          grep -F "the canary's sleep container, retired in SMD-3476 (the coordinator runs its pass), removed" /tmp/canary-norefresh.out
          if grep -F 'OB1_PASSES=' /tmp/canary-norefresh.out | grep -F 'wrote to'; then echo "up --no-refresh rewrote OB1_PASSES the file already names" >&2; exit 1; fi
          grep -F 'canary coordinator, on the new build (OB1_PASSES: sleep,board-sync;' /tmp/canary-norefresh.out
          grep -F 'canary board-sync, on the new build' /tmp/canary-norefresh.out
          [ -n "$(docker ps -q --filter label=com.docker.compose.project=open-brain-canary --filter label=com.docker.compose.service=coordinator)" ] || { echo "up --no-refresh did not bring the coordinator back running" >&2; exit 1; }
          board_env | grep -qx 'OB1_PASSES=sleep,board-sync' || { echo "up --no-refresh did not bring the coordinator back on the file's passes" >&2; exit 1; }
          for _ in $(seq 1 15); do docker logs "$(coord)" 2>&1 | grep -qF 'coordinator: runs board-sync (uid 1101) and sleep (uid 1104)' && break; sleep 1; done
          docker logs "$(coord)" 2>&1 | grep -F 'coordinator: runs board-sync (uid 1101) and sleep (uid 1104)' || { docker logs "$(coord)" >&2; echo "the canary's coordinator does not run board-sync and sleep, each as its own user" >&2; exit 1; }
          board_env | grep -qx 'LINEAR_API_KEY=ci-canary-own-linear-key' || { echo "up --no-refresh did not bring board-sync back on the canary's own read key" >&2; exit 1; }
          board_env | grep -qx 'LINEAR_COMMENT_API_KEY=' || { echo "the canary's board-sync holds a comment key" >&2; exit 1; }
          grep -F 'migrated in place (its own rows kept)' /tmp/canary-norefresh.out
          if grep -F 'refresh open-brain-postgres-1' /tmp/canary-norefresh.out; then echo "up --no-refresh ran the refresh" >&2; exit 1; fi
          [ "$(cq "SELECT value FROM ob1_config WHERE key = 'ci_canary_only'")" = kept ] || { echo "up --no-refresh lost the canary's own row" >&2; exit 1; }
          [ "$(curl -s --max-time 5 http://127.0.0.1:8013/mcp/health)" = ok ] || { echo "the canary does not answer at 8013 after up --no-refresh" >&2; exit 1; }
          if [ -n "$(docker ps -aq --filter label=com.docker.compose.project=open-brain-canary --filter label=com.docker.compose.service=sleep)" ]; then echo "up --no-refresh left the retired sleep stand-in" >&2; exit 1; fi
          migs=(../db/migrations/*.sql)
          [ "$(cq "SELECT max(name) FROM schema_migrations")" = "${migs[-1]##*/}" ] || { echo "the canary's ledger is not at the highest migration (${migs[-1]##*/}) after up --no-refresh" >&2; exit 1; }
          sed -i '/^OB1_WORKER_KEY=ci-canary-worker-key-not-stables$/d; /^OB1_PASSES=/d' .env.canary.local
          cq "DELETE FROM ob1_config WHERE key = 'ci_canary_only'"
          cq "UPDATE ob1_config SET value = 'working' WHERE key = 'tier'"
          cq "ALTER DATABASE openbrain RESET ob1.refresh_target"
          refused 'refusing to delete its volume' down --volumes
          [ -n "$(canary_left)" ] || { echo "the refused down took the canary down" >&2; exit 1; }
          cq "UPDATE ob1_config SET value = 'canary' WHERE key = 'tier'"
          FAKE_URL=http://127.0.0.1:9999/ ./canary.sh down --volumes | tee /tmp/canary-down.out
          grep -F 'left as it is' /tmp/canary-down.out
          grep -F 'removed open-brain-canary_default' /tmp/canary-down.out
          if docker network inspect open-brain-canary_default > /dev/null 2>&1; then echo "down left the canary's network from before SMD-2583" >&2; exit 1; fi
          ! grep -F 'mcp remove' /tmp/fake-claude.log || { echo "down removed another connector" >&2; exit 1; }
          docker compose -p open-brain-canary -f compose.yaml up -d --wait postgres
          # SMD-3154: a canary volume whose database holds nothing is no canary
          # to keep: up --no-refresh exits 1 and migrates nothing into it.
          rc=0; ./canary.sh up --no-refresh --no-smoke > /tmp/canary-emptydb.out 2>&1 || rc=$?
          { [ "$rc" = 1 ] && grep -qF 'holds no relations' /tmp/canary-emptydb.out; } || { cat /tmp/canary-emptydb.out >&2; echo "up --no-refresh on an empty canary database exited $rc, not 1" >&2; exit 1; }
          ./canary.sh down --volumes | tee /tmp/canary-down-empty.out
          grep -F 'canary down, its database deleted' /tmp/canary-down-empty.out
          # SMD-3154: with no database to keep, up --no-refresh is refused and
          # changes nothing: no volume made, no container started.
          rc=0; ./canary.sh --port 8011 up --no-refresh > /tmp/canary-nodb.out 2>&1 || rc=$?
          { [ "$rc" = 2 ] && grep -qF -- "--no-refresh keeps the canary's database, and open-brain-canary has none" /tmp/canary-nodb.out; } || { cat /tmp/canary-nodb.out >&2; echo "up --no-refresh with no canary database exited $rc, not refused" >&2; exit 1; }
          if docker volume inspect open-brain-canary_pgdata > /dev/null 2>&1; then echo "the refused up --no-refresh made the canary's volume" >&2; exit 1; fi
          FAKE_SCOPE="Local config (private to you in this project)" FAKE_URL=http://127.0.0.1:8013/mcp ./canary.sh down --volumes | tee /tmp/canary-down2.out
          grep -F 'nothing to delete' /tmp/canary-down2.out
          grep -F 'is in local scope, not user — left as it is' /tmp/canary-down2.out
          ! grep -F 'mcp remove' /tmp/fake-claude.log || { echo "down removed a local-scope connector" >&2; exit 1; }
          FAKE_URL='http://127.0.0.1:8010/mcp?key=x' ./canary.sh down | tee /tmp/canary-down3.out
          grep -F "not this canary's" /tmp/canary-down3.out
          ! grep -F 'mcp remove' /tmp/fake-claude.log || { echo "down removed a connector at stable's own /mcp" >&2; exit 1; }
          FAKE_URL='http://127.0.0.1:8010/canary/mcp?key=x' ./canary.sh down | tee /tmp/canary-down4.out
          grep -F "on open-brain's origin, where the canary answered before SMD-2874 — stable's URL now, left as it is: claude mcp remove --scope user open-brain-canary removes it" /tmp/canary-down4.out
          ! grep -F 'mcp remove' /tmp/fake-claude.log || { echo "down removed a connector at /canary/mcp on stable's origin" >&2; exit 1; }
          docker volume create open-brain-canary_pgdata
          docker run -d --name ob1-volume-squat -e POSTGRES_PASSWORD=squat -e POSTGRES_DB=openbrain -v open-brain-canary_pgdata:/var/lib/postgresql/data pgvector/pgvector:0.8.6-pg16
          for _ in $(seq 1 60); do docker exec -e PGPASSWORD=squat ob1-volume-squat psql -h 127.0.0.1 -U postgres -d openbrain -tAc 'SELECT 1' > /dev/null 2>&1 && break; sleep 1; done
          docker exec -e PGPASSWORD=squat ob1-volume-squat psql -h 127.0.0.1 -U postgres -d openbrain -c 'CREATE TABLE precious (id int)' || { echo "the volume squat's Postgres never came up" >&2; exit 1; }
          docker rm -f ob1-volume-squat
          refused 'refusing to delete its volume' down --volumes
          [ -z "$(canary_left)" ] || { echo "the refused down left canary containers" >&2; exit 1; }
          docker volume inspect open-brain-canary_pgdata > /dev/null
          docker volume rm open-brain-canary_pgdata
          FAKE_URL=http://127.0.0.1:8013/mcp ./canary.sh down
          grep -F 'mcp remove --scope user open-brain-canary' /tmp/fake-claude.log
          [ -z "$(canary_left)" ] || { echo "canary containers remain" >&2; exit 1; }
          [ -z "$(docker volume ls -q --filter label=com.docker.compose.project=open-brain-canary)" ] || { echo "the canary's volume remains" >&2; exit 1; }
          [ "$(docker compose -f compose.yaml ps -q postgres)" = "$BEFORE" ] || { echo "stable's Postgres container changed" >&2; exit 1; }
          [ "$(q "SELECT count(*) FROM thoughts WHERE content LIKE '%quokka ledger%' OR content LIKE '%numbat almanac%' OR content LIKE '%wombat register%'")" = 3 ] || { echo "the brain lost a thought" >&2; exit 1; }
          [ "$(curl -s --max-time 5 http://127.0.0.1:8010/health)" = ok ] || { echo "stable's server stopped answering" >&2; exit 1; }

      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose -f compose.yaml logs --tail 60
          echo "--- canary (deploy/canary.sh's project, if it is still up) ---"
          docker compose -p open-brain-canary -f compose.yaml logs --tail 60 || true
          echo "--- provider stub (the runner's listener on :11434) ---"
          cat /tmp/provider-stub.log 2>/dev/null || echo "(no stub log)"

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose -f compose.yaml down -v

  deploy-stack-auth:
    name: "Full stack: a second brain, the edge proxy, the import runner and the authorization server"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun on the runner, for this checkout's scripts run there: deploy/instance.ts's
      # check, deploy/edge/edge.ts, auth/provision.ts, and the registered client's
      # id read back.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      # The stack end to end: bring up Postgres, apply the schema and
      # serve MCP, with no Supabase CLI installed and no supabase.com account.
      # The keys (their raw values in $GITHUB_ENV for the steps below), the
      # provider stub on the runner, deploy/.env and the up are
      # .github/ci/full-stack-up.sh's, with why each is as it is (SMD-3051).
      - name: Bring up the compose stack
        run: .github/ci/full-stack-up.sh

      # The two steps below ran in deploy-stack-brains until SMD-3471, about 19
      # s of that job, the second-longest: neither reads the canary's state, and
      # ob1b and the edge are gone when the second ends. Here they meet the
      # stack as they met it there, just up from full-stack-up.sh, before this
      # job's steps change it.
      # SMD-2873. A second brain beside the stack, from its own env file: the
      # host-port check refuses to run where Bun would load deploy/.env into
      # it; says the stack's port is its own (the stack came up with no
      # --env-file, so from its directory's .env); refuses, before any up, ob1b
      # on the stack's port (naming SERVER_PORT and the stack's forwarder), a
      # second env file in deploy/ naming no project (so the stack's project,
      # made from .env), ob1b on a port a host process holds, ob1b on a port a
      # created, never started container holds (Docker's ps prints no ports for
      # it), and an env file's COMPOSE_FILE without the same files as -f; and
      # passes ob1b on its own. ob1b comes up healthy on that port, and no
      # container of either brain is on the other's networks. Then the check
      # reads ob1b's port as ob1b's own. ob1b stays for the next step, the edge
      # proxy's, which removes it; when this step fails it goes here, its
      # volume with it (its logs first).
      - name: A second brain beside the stack, from its own env file
        working-directory: deploy
        run: |
          trap 'rc=$?; if [ "$rc" != 0 ]; then docker compose --env-file .env.ob1b.local -f compose.yaml logs --no-color --tail 60 2>/dev/null || true; docker compose --env-file .env.ob1b.local -f compose.yaml down -v --remove-orphans > /dev/null 2>&1 || true; rm -f .env.ob1b.local; fi; rm -f .env.ob1b-clash.local .env.ob1b-squat.local .env.ob1b-held.local .env.noname.local .env.ob1b-files.local; docker rm -f ob1-ci-port-held > /dev/null 2>&1 || true; [ -z "${SQUAT:-}" ] || kill "$SQUAT" 2>/dev/null || true' EXIT
          # Run from deploy/, whose .env Bun would load into the check: refused without --no-env-file, naming it.
          rc=0; bun instance.ts check > /tmp/instance-bunenv.out 2>&1 || rc=$?
          if [ "$rc" != 2 ] || ! grep -F 'Run it as: bun --no-env-file' /tmp/instance-bunenv.out; then cat /tmp/instance-bunenv.out >&2; echo "the check ran on Bun's load of deploy/.env (exit $rc)" >&2; exit 1; fi
          bun --no-env-file instance.ts check | tee /tmp/instance-stack.out
          grep -F "127.0.0.1:8010: SERVER_PORT (forwarder's port; SERVER_BIND its address) — held by this brain's forwarder" /tmp/instance-stack.out
          (umask 077 && { grep -v -E '^(COMPOSE_PROJECT_NAME|SERVER_PORT|POSTGRES_PASSWORD)=' .env; echo COMPOSE_PROJECT_NAME=ob1b; echo SERVER_PORT=8040; echo "POSTGRES_PASSWORD=\"$(openssl rand -hex 24)\""; } > .env.ob1b.local)
          (umask 077 && sed 's/^SERVER_PORT=8040$/SERVER_PORT=8010/' .env.ob1b.local > .env.ob1b-clash.local)
          rc=0; bun --no-env-file instance.ts check --env-file .env.ob1b-clash.local > /tmp/instance-clash.out 2>&1 || rc=$?
          if [ "$rc" != 2 ] || ! grep -F 'SERVER_PORT' /tmp/instance-clash.out || ! grep -F 'published by open-brain-forwarder-1, of project open-brain' /tmp/instance-clash.out; then cat /tmp/instance-clash.out >&2; echo "ob1b on the stack's port was not refused before its up, naming SERVER_PORT and the stack's forwarder (exit $rc)" >&2; exit 1; fi
          # A second env file naming no project is the stack's project, made from .env: refused, whatever its ports.
          (umask 077 && grep -v -E '^(SERVER_PORT|COMPOSE_PROJECT_NAME)=' .env.ob1b.local > .env.noname.local && echo SERVER_PORT=8042 >> .env.noname.local)
          rc=0; bun --no-env-file instance.ts check --env-file .env.noname.local > /tmp/instance-noname.out 2>&1 || rc=$?
          if [ "$rc" != 2 ] || ! grep -F 'project open-brain was made from' /tmp/instance-noname.out; then cat /tmp/instance-noname.out >&2; echo "an env file naming no project was not refused as the stack's project from another file (exit $rc)" >&2; exit 1; fi
          # A process on the host on ob1b's port, which no container list shows.
          python3 -m http.server 8041 --bind 127.0.0.1 > /dev/null 2>&1 &
          SQUAT=$!
          for _ in $(seq 1 40); do (exec 3<>/dev/tcp/127.0.0.1/8041) 2>/dev/null && break; sleep 0.25; done
          (umask 077 && sed 's/^SERVER_PORT=8040$/SERVER_PORT=8041/' .env.ob1b.local > .env.ob1b-squat.local)
          rc=0; bun --no-env-file instance.ts check --env-file .env.ob1b-squat.local > /tmp/instance-squat.out 2>&1 || rc=$?
          kill "$SQUAT"; SQUAT=""
          if [ "$rc" != 2 ] || ! grep -F 'something on this host that is no container already listens there' /tmp/instance-squat.out; then cat /tmp/instance-squat.out >&2; echo "a host process on ob1b's port was not refused (exit $rc)" >&2; exit 1; fi
          # A container Docker made and never started holds its port, which Docker's ps does not print.
          docker create --name ob1-ci-port-held -p 127.0.0.1:8043:80 "$(docker compose -f compose.yaml config --format json | jq -r .services.proxy.image)" > /dev/null
          (umask 077 && sed 's/^SERVER_PORT=8040$/SERVER_PORT=8043/' .env.ob1b.local > .env.ob1b-held.local)
          rc=0; bun --no-env-file instance.ts check --env-file .env.ob1b-held.local > /tmp/instance-held.out 2>&1 || rc=$?
          docker rm -f ob1-ci-port-held > /dev/null
          if [ "$rc" != 2 ] || ! grep -F 'published by ob1-ci-port-held, of project (none), created: it takes the port when it first starts' /tmp/instance-held.out; then cat /tmp/instance-held.out >&2; echo "a created container's port was not refused (exit $rc)" >&2; exit 1; fi
          # An env file that sets COMPOSE_FILE picks the files an up reads: the check wants them with -f.
          (umask 077 && { cat .env.ob1b.local; echo COMPOSE_FILE=compose.yaml:compose.host-ports.yaml; } > .env.ob1b-files.local)
          rc=0; bun --no-env-file instance.ts check --env-file .env.ob1b-files.local > /tmp/instance-files.out 2>&1 || rc=$?
          if [ "$rc" != 2 ] || ! grep -F 'give the check the same files with -f' /tmp/instance-files.out; then cat /tmp/instance-files.out >&2; echo "an env file's COMPOSE_FILE was not refused without -f (exit $rc)" >&2; exit 1; fi
          bun --no-env-file instance.ts check --env-file .env.ob1b-files.local -f compose.yaml -f compose.host-ports.yaml > /dev/null
          bun --no-env-file instance.ts check --env-file .env.ob1b.local | grep -F "127.0.0.1:8040: SERVER_PORT (forwarder's port; SERVER_BIND its address) — free"
          docker compose --env-file .env.ob1b.local -f compose.yaml up -d --build --wait --wait-timeout 300
          for _ in 1 2 3 4 5; do [ "$(curl -s --max-time 10 http://127.0.0.1:8040/health)" = ok ] && break; sleep 2; done
          [ "$(curl -s --max-time 10 http://127.0.0.1:8040/health)" = ok ] || { echo "ob1b does not answer on its own port" >&2; exit 1; }
          [ "$(curl -s --max-time 10 http://127.0.0.1:8010/health)" = ok ] || { echo "the stack stopped answering on its port beside ob1b" >&2; exit 1; }
          # Every container of each brain on its own project's networks alone. inspect ends each container's
          # list with a newline of its own, a blank line grep -v would match (review pass 8): dropped.
          nets() { for id in $(docker compose "$@" -f compose.yaml ps -aq); do docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$id"; done | sed '/^$/d' | sort -u; }
          ob1b_nets="$(nets --env-file .env.ob1b.local)"
          stack_nets="$(nets)"
          if [ -z "$ob1b_nets" ] || [ -z "$stack_nets" ]; then echo "could not read either brain's networks" >&2; exit 1; fi
          if grep -v '^ob1b_' <<<"$ob1b_nets"; then echo "an ob1b container is on a network not ob1b's" >&2; exit 1; fi
          if grep -v '^open-brain_' <<<"$stack_nets"; then echo "a stack container is on a network not the stack's" >&2; exit 1; fi
          bun --no-env-file instance.ts check --env-file .env.ob1b.local | grep -F "127.0.0.1:8040: SERVER_PORT (forwarder's port; SERVER_BIND its address) — held by this brain's forwarder"

      # SMD-2876. The edge proxy in front of the stack (8010) and ob1b (8040),
      # the step above's: on Docker Engine on Linux, edge.ts picks the host
      # shape, and names the container publishing each brain's port. Each
      # brain answers at its host through the edge, on 127.0.0.1 and [::1],
      # and still on its own port; an MCP call goes through with the client's
      # own key, as a header and as ?key=, a call with none gets the server's
      # refusal, and the key is in no line of the edge's log; an unknown host
      # is the edge's 404. The edge is on the host's network and on no
      # network of either brain. Refused: edge.ts run where Bun would load
      # deploy/.env; a new edge port a host process holds on 127.0.0.1 or
      # [::1] while the edge runs, which keeps serving; a file beside the
      # table. A changed registry (ob1b's port renamed ob1c) is served after
      # an up under umask 077 with the table's directory made afresh. ob1b's
      # forwarder stops on SIGTERM, in under 5 s with exit 143 (SMD-3193), and
      # with it stopped its host is a bare 404 and the stack's still answers.
      # Then the edge goes, and ob1b with its volume (logs first, when the
      # step failed).
      - name: The edge proxy reaches both brains through their published ports
        working-directory: deploy
        run: |
          # A throwaway key, masked: a failure below dumps the edge's log, which would print it were it there.
          echo "::add-mask::$OB1_SMOKE_KEY"
          trap 'rc=$?; if [ "$rc" != 0 ]; then docker compose --env-file /dev/null -p ob1-edge -f edge/compose.yaml --profile host logs --no-color --tail 60 2>/dev/null || true; docker compose --env-file .env.ob1b.local -f compose.yaml logs --no-color --tail 30 forwarder proxy 2>/dev/null || true; fi; bun --no-env-file edge/edge.ts down > /dev/null 2>&1 || true; docker compose --env-file .env.ob1b.local -f compose.yaml down -v --remove-orphans > /dev/null 2>&1 || true; rm -rf .env.ob1b.local edge/brains.local.yaml /tmp/edge-held.yaml /tmp/edge-next.yaml edge/dynamic; [ -z "${SQUAT:-}" ] || kill "$SQUAT" 2>/dev/null || true' EXIT
          printf 'edge:\n  port: 8090\nbrains:\n  stable:\n    port: 8010\n  ob1b:\n    port: 8040\n' > edge/brains.local.yaml
          bun --no-env-file edge/edge.ts check | tee /tmp/edge-check.out
          grep -F 'Docker Engine on Linux, rootful: the host shape' /tmp/edge-check.out
          grep -F 'stable: 127.0.0.1:8010 is published by open-brain-forwarder-1, of project open-brain' /tmp/edge-check.out
          grep -F 'ob1b: 127.0.0.1:8040 is published by ob1b-forwarder-1, of project ob1b' /tmp/edge-check.out
          bun --no-env-file edge/edge.ts up
          # Each brain at its host, on each loopback: the edge holds its port on both, so no other process takes the clients that try ::1 first.
          for b in stable ob1b; do
            [ "$(curl -s -4 --max-time 10 "http://$b.localhost:8090/health" || true)" = ok ] || { echo "$b does not answer at its host through the edge on 127.0.0.1" >&2; exit 1; }
            [ "$(curl -s -g --max-time 10 -H "Host: $b.localhost:8090" 'http://[::1]:8090/health' || true)" = ok ] || { echo "$b does not answer at its host through the edge on [::1]" >&2; exit 1; }
          done
          if ! { [ "$(curl -s --max-time 10 http://127.0.0.1:8010/health || true)" = ok ] && [ "$(curl -s --max-time 10 http://127.0.0.1:8040/health || true)" = ok ]; }; then echo "a brain stopped answering on its own port beside the edge" >&2; exit 1; fi
          list='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          got="$(curl -s --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "x-brain-key: $OB1_SMOKE_KEY" -d "$list" http://stable.localhost:8090/mcp || true)"
          grep -qF '"search_thoughts"' <<<"$got" || { echo "an MCP call with a header key did not reach the stack through the edge" >&2; exit 1; }
          got="$(curl -s --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$list" "http://ob1b.localhost:8090/mcp?key=$OB1_SMOKE_KEY" || true)"
          grep -qF '"search_thoughts"' <<<"$got" || { echo "an MCP call with ?key= did not reach ob1b through the edge" >&2; exit 1; }
          # No key: the server's own refusal, HTTP 200 with JSON-RPC -32001 as smoke.sh holds (no OAuth on this stack), and no tool list.
          c="$(curl -s --max-time 10 -o /tmp/edge-nokey.body -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$list" http://stable.localhost:8090/mcp || true)"
          if ! { [ "$c" = 200 ] && grep -qF -- '-32001' /tmp/edge-nokey.body && ! grep -qF '"search_thoughts"' /tmp/edge-nokey.body; }; then echo "a call with no key through the edge answered $c, not the server's refusal" >&2; exit 1; fi
          [ "$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://other.localhost:8090/health || true)" = 404 ] || { echo "an unknown host was not the edge's 404" >&2; exit 1; }
          edge="$(docker ps -q --filter label=com.docker.compose.project=ob1-edge)"
          [ -n "$edge" ] || { echo "no edge container is running" >&2; exit 1; }
          [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$edge")" = host ] || { echo "the edge is not on the host's network" >&2; exit 1; }
          id="$(docker inspect -f '{{.Id}}' "$edge")"
          brain_nets="$(docker network ls --format '{{.Name}}' | grep -E '^(open-brain|ob1b)_' || true)"
          [ -n "$brain_nets" ] || { echo "found no network of either brain" >&2; exit 1; }
          for n in $brain_nets; do
            members="$(docker network inspect -f '{{range $id, $c := .Containers}}{{$id}}{{"\n"}}{{end}}' "$n")"
            if grep -qx "$id" <<<"$members"; then echo "the edge is on $n, a brain's network" >&2; exit 1; fi
          done
          docker logs "$edge" > /tmp/edge.log 2>&1
          [ -s /tmp/edge.log ] || { echo "the edge logged nothing, so its log says nothing of the key" >&2; exit 1; }
          if grep -qF "$OB1_SMOKE_KEY" /tmp/edge.log; then echo "the edge's access log holds the key" >&2; exit 1; fi
          # Run from deploy/, whose .env (a brain's secrets) Bun would load into it: refused without --no-env-file, naming it.
          rc=0; bun edge/edge.ts check > /tmp/edge-bunenv.out 2>&1 || rc=$?
          if [ "$rc" != 2 ] || ! grep -qF 'Run it as: bun --no-env-file' /tmp/edge-bunenv.out; then cat /tmp/edge-bunenv.out >&2; echo "the edge ran on Bun's load of deploy/.env (exit $rc)" >&2; exit 1; fi
          # A new edge port a host process holds, on either loopback, while the edge runs on its old one: refused before anything changes.
          for squat in "127.0.0.1 8092" "::1 8094"; do
            read -r addr port <<<"$squat"
            shown="$addr:$port"
            if [ "$addr" = ::1 ]; then shown="[::1]:$port"; fi
            python3 -m http.server "$port" --bind "$addr" > /dev/null 2>&1 &
            SQUAT=$!
            for _ in $(seq 1 40); do if curl -s -g -o /dev/null --max-time 1 "http://$shown/"; then break; fi; sleep 0.25; done
            sed "0,/  port: 8090/s//  port: $port/" edge/brains.local.yaml > /tmp/edge-held.yaml
            rc=0; bun --no-env-file edge/edge.ts up --registry /tmp/edge-held.yaml > /tmp/edge-held.out 2>&1 || rc=$?
            kill "$SQUAT"; SQUAT=""
            if [ "$rc" != 2 ] || ! grep -qF "$shown (edge.port) already answers, and not as this edge" /tmp/edge-held.out; then cat /tmp/edge-held.out >&2; echo "an edge port held on $shown was not refused while the edge ran (exit $rc)" >&2; exit 1; fi
            [ "$(curl -s --max-time 10 http://stable.localhost:8090/health || true)" = ok ] || { echo "the refused up stopped the running edge" >&2; exit 1; }
          done
          # A file beside the table, which Traefik would load: refused.
          touch edge/dynamic/extra.yaml
          rc=0; bun --no-env-file edge/edge.ts up > /tmp/edge-stray.out 2>&1 || rc=$?
          rm -f edge/dynamic/extra.yaml
          if [ "$rc" != 2 ] || ! grep -qF 'holds extra.yaml beside routes.yaml' /tmp/edge-stray.out; then cat /tmp/edge-stray.out >&2; echo "a stray file beside the table was not refused (exit $rc)" >&2; exit 1; fi
          # A changed registry is served after up: ob1b's port under the name ob1c, and ob1b gone (Traefik's router miss).
          # Under umask 077, with the table's directory made afresh: the edge's user (65534) still reads it.
          sed 's/^  ob1b:$/  ob1c:/' edge/brains.local.yaml > /tmp/edge-next.yaml && cp /tmp/edge-next.yaml edge/brains.local.yaml
          (umask 077 && rm -rf edge/dynamic && bun --no-env-file edge/edge.ts up)
          [ "$(curl -s --max-time 10 http://ob1c.localhost:8090/health || true)" = ok ] || { echo "the changed registry's ob1c is not served after up" >&2; exit 1; }
          [ "$(curl -s --max-time 10 http://ob1b.localhost:8090/health || true)" = "404 page not found" ] || { echo "ob1b, gone from the registry, is still routed after up" >&2; exit 1; }
          # The forwarder stops on SIGTERM, under its init (SMD-3193): bun as PID 1 ignored it, so a stop waited out the 10 s grace and exited 137, the kill.
          SECONDS=0
          docker compose --env-file .env.ob1b.local -f compose.yaml stop forwarder
          took=$SECONDS
          fcode=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose --env-file .env.ob1b.local -f compose.yaml ps -aq forwarder)")
          if [ "$fcode" != 143 ] || [ "$took" -ge 5 ]; then echo "ob1b's forwarder stopped in ${took} s with exit $fcode, not under 5 s with 143: it did not stop on SIGTERM" >&2; exit 1; fi
          rm -f /tmp/edge-down.body
          down="$(curl -s --max-time 10 -o /tmp/edge-down.body -w '%{http_code}' http://ob1c.localhost:8090/health || true)"
          if ! { [ "$down" = 404 ] && [ ! -s /tmp/edge-down.body ]; }; then echo "ob1b (as ob1c) down gave $down with $(wc -c < /tmp/edge-down.body 2>/dev/null || echo 0) bytes through the edge, not a bare 404" >&2; exit 1; fi
          [ "$(curl -s --max-time 10 http://stable.localhost:8090/health || true)" = ok ] || { echo "the stack stopped answering through the edge while ob1b was down" >&2; exit 1; }

      # SMD-2287 PR 5a: the server image just built carries the MCP server as a
      # REST client (mcp-server/) and its client (rest-client/), each with its
      # own lockfile's packages, run with `bun` as the entrypoint, without the
      # image's preflight, since it reads no store. Without a forward key it stops at
      # once in its own words, exit 2, after every import has loaded; with one
      # it answers keyless liveness, refuses a keyless initialize on its own
      # request line, and stops on SIGTERM, exit 0. The REST core it names is
      # an address nothing answers, and none of this calls it. With no network:
      # Bun installs a package itself, from the registry, for a directory with
      # no node_modules (SMD-2978), and an image missing mcp-server/'s passed
      # this step that way (a mutant, measured).
      - name: The server image runs the MCP server as a REST client
        working-directory: deploy
        run: |
          IMG="$(docker compose -f compose.yaml config --format json | jq -r .services.api.image)"
          if out=$(docker run --rm --network none --entrypoint bun "$IMG" ../mcp-server/index.ts 2>&1); then code=0; else code=$?; fi
          echo "$out"
          if [ "$code" != 2 ] || ! grep -q '^OB1_FORWARDER_KEY is not set' <<< "$out"; then echo "expected exit 2 naming the missing forward key; exit $code" >&2; exit 1; fi
          OB1_FORWARDER_KEY=$(openssl rand -hex 32) docker run -d --name ob1-mcp-image --network none --entrypoint bun -e OB1_FORWARDER_KEY -e OB1_REST_URL=http://127.0.0.1:9 "$IMG" ../mcp-server/index.ts > /dev/null
          up=""
          for _ in $(seq 1 40); do [ "$(docker exec ob1-mcp-image wget -qO- http://127.0.0.1:8000/health 2> /dev/null)" = ok ] && { up=1; break; }; sleep 0.25; done
          docker exec ob1-mcp-image wget -qO- --header 'Content-Type: application/json' --header 'Accept: application/json, text/event-stream' \
            --post-data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' http://127.0.0.1:8000/mcp > /dev/null 2>&1 || true
          docker stop ob1-mcp-image > /dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' ob1-mcp-image)
          log=$(docker logs ob1-mcp-image 2>&1)
          docker rm -f ob1-mcp-image > /dev/null
          echo "$log"
          [ -n "$up" ] || { echo "the MCP server never answered keyless /health with ok" >&2; exit 1; }
          grep -q '"door":"mcp".*"rpc":"initialize".*"code":"UNAUTHORIZED"' <<< "$log" || { echo "the keyless initialize was not refused on the MCP server's own request line" >&2; exit 1; }
          if [ "$code" != 0 ] || ! grep -q '^SIGTERM: stopped in ' <<< "$log"; then echo "expected the server's own stop line and exit 0; exit $code" >&2; exit 1; fi

      # SMD-2212: the import runner's image copies the ingestion pipeline's
      # import graph file by file, and its build resolves every import. So a
      # module the pipeline gains that the Dockerfile does not copy fails
      # here, not at an operator's first import.
      - name: The import runner's image builds
        working-directory: deploy
        run: docker compose -f compose.yaml --profile orchestration build orchestration-runner

      # SMD-2289: the image's own start, as compose runs the service but
      # without its dependencies (starting opens no database connection).
      # `--egress` gives a real nft its rules, setpriv drops NET_ADMIN and
      # SETPCAP, and the runner listens only once its probe as an emitter uid
      # is refused. Then, as an emitter uid, the internet and the runner's own
      # port are refused, and the runner holds KILL, SETGID and SETUID alone.
      # The self-check reads the rules' text; this is the kernel's answer, on
      # Docker, where the eval kit runs podman (review pass 5). Each probe is
      # an `if`: bash -e does not stop on a failed `!` command.
      - name: The import runner starts with its egress rules
        working-directory: deploy
        env:
          OB1_RUNNER_KEY: ci-stand-in-runner-key-not-a-secret-0123456789
          # In the image the runner refuses a DATABASE_URL with no password (SMD-2289).
          OB1_RUNNER_DB_PASSWORD: ci-stand-in-runner-db-password-0123456789
        run: |
          docker compose -f compose.yaml --profile orchestration run -d --no-deps --name ob1-runner-egress orchestration-runner
          for _ in $(seq 30); do docker logs ob1-runner-egress 2>&1 | grep -q "runner: listening" && break; sleep 1; done
          docker logs ob1-runner-egress 2>&1
          docker logs ob1-runner-egress 2>&1 | grep -q "runner: listening"
          pid=$(docker exec ob1-runner-egress sh -c 'for p in /proc/[0-9]*; do [ "$(tr "\0" " " < "$p/cmdline")" = "bun deploy/orchestration/runner.ts " ] && basename "$p"; done' | head -1)
          eff=$(docker exec ob1-runner-egress awk '/^CapEff/ {print $2}' "/proc/$pid/status")
          echo "runner pid $pid CapEff $eff"
          [ "$eff" = "00000000000000e0" ]
          for target in "1.1.1.1 443" "127.0.0.1 8090"; do
            # shellcheck disable=SC2086
            if docker exec ob1-runner-egress su-exec 20001:20001 python3 -c "import socket, sys; socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=3)" $target; then
              echo "an emitter uid reached $target"; exit 1
            fi
          done
          docker rm -f ob1-runner-egress

      # SMD-2285: the authorization server as compose runs it. Its secrets are
      # --init's, into this job's deploy/.env. With one setting blanked, the
      # origin given a path and the profiles without auth, it refuses to start,
      # exit 2, naming all three at once — a run beside the rest of the step,
      # since it waits 30 s before its exit (SMD-3200). Meanwhile it comes up
      # healthy, and a client registered by DCR is read back with its
      # registration token after a restart (the log shows the second start)
      # and again after a recreate, as an upgrade does: the SQLite store is in
      # its volume, and the memory adapter forgot both.
      # The store's directory is the server's user's alone; an interaction
      # with no session is the library's 400, and a write to a store another
      # connection holds locked answers 500 and is logged; with the cap set to
      # 3, a fourth registration is refused 503 for now, however the path is
      # spelled; with the trusted proxy named as the container's own loopback,
      # so the per-address limits are on, a 21st bad secret for one client
      # from one forwarded address is refused 429, and that client from
      # another address, another client, a client that does not exist or a
      # public one, is not (SMD-2309); an absolute-form target is 400 and
      # `//x/healthz` a 404, with the process never restarted (SMD-2615); and a stop is
      # the server's own (exit 0 inside 5 s, its line in the log), not the
      # grace period's SIGKILL. The container goes at the end; the volume, the
      # networks and the auth lines in .env stay to the job's end, and the MCP
      # server keeps the configured origin for the steps after this (the REST
      # core's tokens, then the proxy's).
      # Through the proxy (SMD-1846 PR 2), its auth router: before the server
      # starts and after it stops, the bare discovery path is a bodiless 404,
      # not Traefik's 502 for a name that does not resolve; while it runs, the
      # bare path and RFC 8414's under the issuer answer its document, issuer
      # and all; and at the cap the proxy hands on its 503 and Retry-After,
      # which a rewrite of every 5xx would have turned into a 404. The proxy
      # has no DNS search domains, a configured-off start (COMPOSE_PROFILES
      # without auth) is refused, and a sign-in's session cookie is Path=/auth
      # (review pass 1).
      - name: The authorization server starts, refuses a bad setting, and keeps its state across a restart
        working-directory: deploy
        run: |
          auth() { docker compose -f compose.yaml --profile auth "$@"; }
          # The proxy's answer for a path: "<status> <issuer or the body's first 40 bytes>".
          via_proxy() {
            local code
            code=$(curl -s --max-time 10 -o /tmp/auth-via-proxy -w '%{http_code}' -D /tmp/auth-via-proxy.h "$@")
            printf '%s %s' "$code" "$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("issuer") or "-")' /tmp/auth-via-proxy 2> /dev/null || head -c 40 /tmp/auth-via-proxy)"
          }
          absent() { [ "$(via_proxy http://127.0.0.1:8010/.well-known/oauth-authorization-server)" = "404 " ] || { echo "$1: the bare discovery path through the proxy answered \"$(via_proxy http://127.0.0.1:8010/.well-known/oauth-authorization-server)\", not an empty 404"; exit 1; }; }
          absent "before the authorization server starts"
          # No search domains in the proxy: an absent server's name is never
          # tried again under the runner's (where a resolver that answered would
          # be sent /auth traffic).
          # Read once, and it must name a resolver, so an empty read cannot pass.
          resolv=$(docker compose -f compose.yaml exec -T proxy cat /etc/resolv.conf)
          grep -q '^nameserver ' <<<"$resolv" || { echo "the proxy's resolv.conf names no resolver: \"$resolv\""; exit 1; }
          if grep -E '^search' <<<"$resolv" | grep -qv -E '^search[[:space:]]+\.?[[:space:]]*$'; then
            echo "the proxy resolves under search domains:"; echo "$resolv"; exit 1
          fi
          # The settings and secrets (.github/ci/auth-settings.sh, which the
          # other three full-stack jobs run too). COMPOSE_PROFILES=auth: the stack
          # configured (ADR decision 16), which the server refuses to start
          # without (SMD-1846 PR 2). It stays in .env to the job's end: every
          # later compose call names its services but two that harm nothing
          # (the failure log, and the teardown's `down -v`, which removes
          # auth-data too).
          # The refusal below waits 30 s before its exit 2 (no hot restart
          # loop), so it runs in the background through the rest of the step
          # (SMD-3200). The image and the volume are made first, so its run and
          # the server's up race to build or create neither; the up recreates
          # the container made beside them, which the one-off never touches. A
          # one-off `run` takes no network alias, so it never answers for the
          # server, and compose's up, restart, logs and plain ps pass it over.
          # Exec does not: it sorts by container number, where the one-off reads
          # 0 before the server's 1, so every `auth exec` here takes --index 1.
          # The refusal is waited for and asserted before the server's stop, its
          # 30 s long past by then. A failure before that removes its container
          # by name (killing the background job would reach only a subshell), so
          # the teardown meets no one-off holding the volume.
          ../.github/ci/auth-settings.sh
          auth up --no-start --build --no-deps auth
          auth run --rm --no-deps --name ob1-auth-refusal -e OB1_AUTH_COOKIE_KEYS= -e OB1_PUBLIC_ORIGIN=https://brain.example.test/auth -e COMPOSE_PROFILES=local-models auth > /tmp/auth-refusal.out 2>&1 < /dev/null &
          refusal=$!
          trap 'docker rm -f ob1-auth-refusal > /dev/null 2>&1 || true' EXIT
          auth up -d --wait --wait-timeout 120 --no-deps auth
          for path in /.well-known/oauth-authorization-server /.well-known/oauth-authorization-server/auth; do
            got=$(via_proxy "http://127.0.0.1:8010$path")
            [ "$got" = "200 https://brain.example.test/auth" ] || { echo "GET $path through the proxy answered \"$got\", not the server's document"; exit 1; }
          done
          # SMD-2382: the MCP server, recreated so it reads the configured .env,
          # advertises at the origin's Host alone, while the authorization server
          # answers its probe on the mesh: the document through the proxy, the
          # challenge on a keyless /mcp; a wrong key and loopback keep their
          # answers, and the fallback sign-in paths are the proxy's 404. Each
          # helper's curl may fail without ending the step, so the check after
          # it says what came back. /mcp is the `mcp` service's since SMD-2287;
          # the REST core is recreated beside it.
          auth up -d --wait --wait-timeout 120 --no-deps api mcp
          O=(-H 'Host: brain.example.test')
          # "<status> <WWW-Authenticate or ->" for an initialize POSTed to /mcp with these curl arguments.
          at_mcp() { { curl -s --max-time 10 -o /dev/null -D - -H 'content-type: application/json' "$@" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' http://127.0.0.1:8010/mcp || true; } | tr -d '\r' | awk 'NR == 1 { c = $2 } tolower($0) ~ /^www-authenticate:/ { sub(/^[^:]*: */, ""); w = $0 } END { print c, (w == "" ? "-" : w) }'; }
          code_of() { curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$@" || true; }
          prm=$(curl -s --max-time 10 "${O[@]}" http://127.0.0.1:8010/.well-known/oauth-protected-resource/mcp || true)
          jq -e '.resource == "https://brain.example.test/mcp" and .authorization_servers == ["https://brain.example.test/auth"]' <<<"$prm" >/dev/null || { echo "the protected-resource document at the origin's Host: ${prm:0:200}"; exit 1; }
          got=$(at_mcp "${O[@]}")
          [ "$got" = '401 Bearer resource_metadata="https://brain.example.test/.well-known/oauth-protected-resource/mcp"' ] || { echo "a keyless /mcp at the origin's Host answered \"$got\", not the challenge"; exit 1; }
          got=$(at_mcp "${O[@]}" -H 'x-brain-key: ci-not-a-key')
          [ "$got" = "200 -" ] || { echo "a wrong key at the origin's Host answered \"$got\", not today's 200"; exit 1; }
          got=$(at_mcp)
          [ "$got" = "200 -" ] || { echo "a keyless /mcp on loopback answered \"$got\", not today's 200"; exit 1; }
          [ "$(code_of http://127.0.0.1:8010/.well-known/oauth-protected-resource/mcp)" = 404 ] || { echo "the document is served at loopback's Host"; exit 1; }
          # oauth-fallback-off's 404 is empty-bodied; with no router there the
          # proxy's own 404 carries "404 page not found" (SMD-2532).
          for path in /register /authorize /token; do
            c=$(curl -s --max-time 10 -o /tmp/off-body -w '%{http_code}' "${O[@]}" -X POST -d '{}' "http://127.0.0.1:8010$path" || true)
            { [ "$c" = 404 ] && [ ! -s /tmp/off-body ]; } || { echo "POST $path at the origin root answered $c '$(head -c 80 /tmp/off-body)', not oauth-fallback-off's bodiless 404"; exit 1; }
          done
          auth exec --index 1 -T auth bun restart-check.ts --register > /tmp/auth-client.json
          auth restart auth
          auth up -d --wait --wait-timeout 60 --no-deps auth
          auth exec --index 1 -T auth bun restart-check.ts --read < /tmp/auth-client.json
          log=$(auth logs --no-color auth)
          starts=$(grep -cF "issuer https://brain.example.test/auth" <<<"$log" || true)
          [ "$starts" = 2 ] || { echo "the log shows $starts starts, not 2: the restart did not restart the server"; exit 1; }
          auth up -d --force-recreate --wait --wait-timeout 60 --no-deps auth
          auth exec --index 1 -T auth bun restart-check.ts --read < /tmp/auth-client.json
          # The session cookie a sign-in sets is the issuer's path alone, so on
          # the shared origin it never rides a request to /mcp or the rest. The
          # password goes by name, as in the steps below (check 43, SMD-3351).
          OB1_AUTH_OPERATOR_PASSWORD=$(sed -n 's/^OB1_AUTH_OPERATOR_PASSWORD=//p' .env | tr -d "'")
          export OB1_AUTH_OPERATOR_PASSWORD
          cookie_path=$(auth exec --index 1 -T -e OB1_AUTH_OPERATOR_PASSWORD auth bun restart-check.ts --session-cookie < /tmp/auth-client.json)
          [ "$cookie_path" = /auth ] || { echo "the session cookie's Path is \"$cookie_path\", not /auth"; exit 1; }
          [ "$(auth exec --index 1 -T auth stat -c '%U %a' /data)" = "bun 700" ] || { echo "/data is not the server's alone"; exit 1; }
          bogus=$(auth exec --index 1 -T auth bun -e 'const r = await fetch("http://127.0.0.1:3000/auth/interaction/not-a-uid"); console.log(r.status, (await r.text()).includes("cookie not found"))')
          [ "$bogus" = "400 true" ] || { echo "an interaction with no session answered \"$bogus\", not 400 naming the missing cookie"; exit 1; }
          # SMD-2615: absolute-form targets, each with an authority the URL parser
          # refuses, are 400 and `//x/healthz` is not /healthz; the process is
          # never restarted. Before, the first ended it (an empty 200, exit 1).
          # A connection the server holds open is cut after 3 s and reads "timeout",
          # whatever it sent first, so it fails the row rather than hanging the job.
          # shellcheck disable=SC2016 # JavaScript, run in the container
          odd=$(auth exec --index 1 -T auth bun -e 'const { connect } = require("node:net"); const ask = (t) => new Promise((ok) => { let out = ""; const s = connect(3000, "127.0.0.1", () => s.write(`GET ${t} HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n`)); s.on("data", (d) => (out += d)); let held = false; const timer = setTimeout(() => { held = true; s.destroy(); }, 3000); s.on("close", () => { clearTimeout(timer); ok(held ? "timeout" : out.split(" ")[1] || "none"); }); s.on("error", () => ok("refused")); }); const out = []; for (const t of ["http://x:99999/healthz", "http://[::1/auth/token", "//x/healthz"]) out.push(await ask(t)); await Bun.sleep(500); out.push(await fetch("http://127.0.0.1:3000/healthz").then((r) => r.status, () => "refused")); console.log(out.join(" "))')
          [ "$odd" = "400 400 404 200" ] || { echo "absolute-form targets, //x/healthz, then /healthz answered \"$odd\", not \"400 400 404 200\""; exit 1; }
          [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$(auth ps -q auth)")" = "true 0" ] || { echo "the authorization server restarted after the odd targets"; exit 1; }
          # One process holds the store's write lock across the whole request and
          # lets go only after the answer, so nothing depends on two start-ups'
          # timing: the server's write waits out its 5 s and answers 500.
          # shellcheck disable=SC2016 # JavaScript, run in the container
          locked=$(auth exec --index 1 -T auth bun -e 'const { Database } = require("bun:sqlite"); const d = new Database("/data/auth.sqlite"); d.exec("BEGIN IMMEDIATE"); try { const r = await fetch("http://127.0.0.1:3000/auth/reg", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ redirect_uris: ["https://client.example/callback"], token_endpoint_auth_method: "none" }) }); console.log(r.status, (await r.json()).error); } finally { d.exec("ROLLBACK"); }')
          [ "$locked" = "500 server_error" ] || { echo "a write to a locked store answered \"$locked\", not 500 server_error"; exit 1; }
          # The cap (3 here): the client registered above and two more fill it, and the next is refused for now.
          for _ in 1 2; do auth exec --index 1 -T auth bun restart-check.ts --register > /dev/null; done
          # Every spelling the library routes to registration (any case, a trailing slash, a query: SMD-2615) is held to it.
          # shellcheck disable=SC2016 # JavaScript, run in the container
          full=$(auth exec --index 1 -T auth bun -e 'const out = []; for (const p of ["/auth/reg", "/auth/REG", "/auth/reg/", "/auth/reg?ob1=1"]) { const r = await fetch("http://127.0.0.1:3000" + p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ redirect_uris: ["https://client.example/callback"], token_endpoint_auth_method: "none" }) }); out.push(`${r.status} ${(await r.json()).error} ${r.headers.get("retry-after")}`); } console.log(out.join(" | "))')
          want="503 temporarily_unavailable 3600 | 503 temporarily_unavailable 3600 | 503 temporarily_unavailable 3600 | 503 temporarily_unavailable 3600"
          [ "$full" = "$want" ] || { echo "registrations past the cap answered \"$full\", not \"$want\""; exit 1; }
          got=$(via_proxy -X POST -H 'content-type: application/json' -d '{"redirect_uris":["https://client.example/callback"],"token_endpoint_auth_method":"none"}' http://127.0.0.1:8010/auth/reg)
          if ! { [ "$got" = "503 -" ] && grep -qi '^retry-after: 3600' /tmp/auth-via-proxy.h; }; then echo "a registration past the cap through the proxy answered \"$got\" ($(grep -i '^retry-after' /tmp/auth-via-proxy.h || echo 'no Retry-After')), not the server's 503 with Retry-After 3600"; exit 1; fi
          # SMD-2309: twenty failed authentications for one client from one forwarded address, then the token endpoint
          # refuses that client from there for now, and neither another address nor another client from the same one;
          # a client that does not exist, or the public one registered above (no secret to guess), is never counted.
          # Every other one carries a query, the 21st among them: the gate reads past it as the library does (SMD-2615).
          pub=$(bun -e 'console.log(JSON.parse(await Bun.stdin.text()).client_id)' < /tmp/auth-client.json)
          bad=$(auth exec --index 1 -T -e PUB="$pub" auth bun -e 'const tok = async (client, from, path = "/auth/token") => (await fetch("http://127.0.0.1:3000" + path, { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded", authorization: "Basic " + btoa(client + ":not-the-secret"), "x-forwarded-for": from }, body: "grant_type=client_credentials" })).status; const out = []; for (let i = 0; i < 21; i++) out.push(await tok("gui", "203.0.113.9", i % 2 ? "/auth/token" : "/auth/token?ob1=1")); const none = []; const open = []; for (let i = 0; i < 21; i++) { none.push(await tok("no-such-client", "203.0.113.11")); open.push(await tok(process.env.PUB, "203.0.113.12")); } console.log(out.filter((s) => s === 401).length, out.at(-1), await tok("gui", "203.0.113.10"), await tok("mcp", "203.0.113.9"), none.filter((s) => s === 401).length, open.filter((s) => s === 401).length)')
          want="20 429 401 401 21 21"
          [ "$bad" = "$want" ] || { echo "21 bad client secrets, then another address, another client, and 21 each for no client and the public one, answered \"$bad\", not \"$want\""; exit 1; }
          grep -qF "server error: SQLiteError: database is locked" <<<"$(auth logs --no-color auth)" || { echo "the locked store's server_error is not in the log"; exit 1; }
          # The refusal, started before the server came up: exit 2, naming every bad setting at once. Then compose, which
          # lists a one-off with -a alone, lists the server's container alone: the refusal's is gone with it (SMD-3200).
          # Bounded: a refusal that never exits fails here, not at the job's six hours.
          for _ in $(seq 60); do kill -0 "$refusal" 2> /dev/null || break; sleep 1; done
          kill -0 "$refusal" 2> /dev/null && { echo "the refusal had not exited a minute after the rest of the step"; exit 1; }
          code=0
          wait "$refusal" || code=$?
          trap - EXIT
          out=$(< /tmp/auth-refusal.out)
          echo "$out" | tail -5
          [ "$code" = 2 ] || { echo "a bad setting exited $code, not 2"; exit 1; }
          for said in "OB1_AUTH_COOKIE_KEYS is not set" "OB1_PUBLIC_ORIGIN must be an origin alone" 'COMPOSE_PROFILES does not name auth ("local-models")'; do
            grep -qF "$said" <<<"$out" || { echo "the refusal did not say: $said"; exit 1; }
          done
          n=$(auth ps -aq auth | wc -l)
          [ "$n" = 1 ] || { echo "compose lists $n auth containers after the refusal, not the server's alone"; exit 1; }
          id=$(auth ps -q auth)
          SECONDS=0
          auth stop auth
          took=$SECONDS
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$id")" = 0 ] || { echo "the stop did not exit 0"; exit 1; }
          [ "$took" -lt 5 ] || { echo "the stop took ${took} s: the server did not stop on SIGTERM"; exit 1; }
          grep -qF "stopped on SIGTERM" <<<"$(docker logs "$id" 2>&1)" || { echo "the server's stop line is missing"; exit 1; }
          absent "with the authorization server stopped"
          # SMD-2382: within the MCP server's 30 s probe window the document
          # goes, a keyless /mcp is today's refusal again, and a token gets the
          # 503 with Retry-After, not a 401 that would restart its sign-in.
          for _ in $(seq 1 40); do
            [ "$(code_of "${O[@]}" http://127.0.0.1:8010/.well-known/oauth-protected-resource/mcp)" = 404 ] && break
            sleep 1
          done
          [ "$(code_of "${O[@]}" http://127.0.0.1:8010/.well-known/oauth-protected-resource/mcp)" = 404 ] || { echo "the document outlived the authorization server by 40 s"; exit 1; }
          got=$(at_mcp "${O[@]}")
          [ "$got" = "200 -" ] || { echo "a keyless /mcp at the origin's Host, the authorization server stopped, answered \"$got\", not today's 200"; exit 1; }
          got=$({ curl -s --max-time 10 -o /dev/null -D - "${O[@]}" -H 'content-type: application/json' -H 'Authorization: Bearer eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiJjaSJ9.c2ln' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' http://127.0.0.1:8010/mcp || true; } | tr -d '\r' | awk 'NR == 1 { c = $2 } tolower($0) ~ /^retry-after:/ { r = $2 } END { print c, r }')
          [ "$got" = "503 30" ] || { echo "a token with the authorization server stopped answered \"$got\", not 503 with Retry-After 30"; exit 1; }
          auth rm -sfv auth

      # SMD-2286 step 1: the REST core accepts the authorization server's
      # tokens, and only its own. A real sign-in and consent (restart-check.ts
      # --tokens) gives an /mcp token, exchanged as the MCP service for a REST
      # core one, as the MCP server does at the hop. Each sign-in registers a
      # client of its own, a connector. The REST core, recreated to read the
      # configured .env and asked on its own port inside its container (it is
      # published only by an overlay), names the caller by the operator and
      # its connector, oauth:operator+<client> (SMD-3064: the exchange nests
      # the connector in act), with the MCP service as act, refuses the /mcp
      # token (Verify: the MCP-audience token sent straight to it) and a read
      # token's capture (Verify), and two connectors' write tokens each write
      # an audit row naming its own connector and the MCP service (SMD-3064's
      # Verify 1). The authorization server stopped, the keys it read are
      # still used; read none (the REST core recreated), a token is a 503 with
      # Retry-After 30, never let through. And through the proxy's /mcp at the
      # origin's Host, where the MCP server built on the REST core trades each
      # /mcp token at the hop (SMD-2286 PR 2, live since SMD-2287 PR 5b): a
      # write token lists the write tools, a read token the read ones alone,
      # and a read token's tool call answers.
      - name: The REST core accepts the authorization server's tokens, and only its own
        working-directory: deploy
        run: |
          auth() { docker compose -f compose.yaml --profile auth "$@"; }
          q() { docker compose -f compose.yaml exec -T postgres psql -U postgres -d openbrain -tAc "$1"; }
          # The step above filled the store's cap of 3 (its volume stays); the three
          # sign-ins here register a client each, so this start's cap is higher
          # (the shell's value is compose's over .env's).
          OB1_AUTH_MAX_CLIENTS=10 auth up -d --wait --wait-timeout 120 --no-deps auth
          # The MCP server beside it, so its first calls on the REST core and the
          # authorization server, both recreated here, look each name up afresh
          # (SMD-2287 PR 5b review pass 5).
          auth up -d --force-recreate --wait --wait-timeout 120 --no-deps api mcp
          # The password and the tokens go by name (-e NAME, from this shell's
          # environment), never on a command line the runner's process list shows.
          OB1_AUTH_OPERATOR_PASSWORD=$(sed -n 's/^OB1_AUTH_OPERATOR_PASSWORD=//p' .env | tr -d "'")
          export OB1_AUTH_OPERATOR_PASSWORD
          read_t=$(auth exec -T -e OB1_AUTH_OPERATOR_PASSWORD auth bun restart-check.ts --tokens brain:read)
          write_t=$(auth exec -T -e OB1_AUTH_OPERATOR_PASSWORD auth bun restart-check.ts --tokens brain:write)
          write2_t=$(auth exec -T -e OB1_AUTH_OPERATOR_PASSWORD auth bun restart-check.ts --tokens brain:write)
          # "<status> <Retry-After or -> <body>" for a request to the REST core with this bearer, cut at 15 s.
          at_api() { T="$2" auth exec -T -e P="$1" -e T -e M="${3:-GET}" -e B="${4:-}" api bun -e 'const r = await fetch("http://127.0.0.1:8000" + process.env.P, { method: process.env.M, headers: { authorization: "Bearer " + process.env.T, ...(process.env.B ? { "content-type": "application/json" } : {}) }, body: process.env.B || undefined, signal: AbortSignal.timeout(15000) }); console.log(r.status, r.headers.get("retry-after") ?? "-", (await r.text()).replace(/\s+/g, " "))'; }
          check() { local got="$1" want="$2" filter="$3" what="$4"; if ! { [ "${got%% *}" = "$want" ] && jq -e "$filter" <<<"$(cut -d' ' -f3- <<<"$got")" > /dev/null; }; then echo "$what answered \"${got:0:300}\""; exit 1; fi; }
          api_w=$(jq -r .api <<<"$write_t")
          who_w="oauth:operator+$(jq -r .client <<<"$write_t")"
          who_w2="oauth:operator+$(jq -r .client <<<"$write2_t")"
          [ "$who_w" != "$who_w2" ] || { echo "two sign-ins registered one client, $who_w"; exit 1; }
          check "$(at_api /v1/whoami "$api_w")" 200 ".name == \"$who_w\" and .scope == \"write\" and .act == {\"name\": \"oauth:mcp\"}" "whoami with an exchanged write token"
          check "$(at_api /v1/whoami "$(jq -r .mcp <<<"$read_t")")" 401 '.code == "UNAUTHORIZED" and .credential == "token"' "whoami with the /mcp token"
          check "$(at_api /v1/thoughts "$(jq -r .api <<<"$read_t")" POST '{"content":"SMD-2286: a read token may not capture"}')" 403 '.code == "FORBIDDEN" and .needs == "capture"' "a capture with an exchanged read token"
          for t in "$write_t" "$write2_t"; do
            who="oauth:operator+$(jq -r .client <<<"$t")"
            # Each connector's own text: a capture of text the brain holds answers with the thought it has, and its audit row.
            got=$(at_api /v1/thoughts "$(jq -r .api <<<"$t")" POST "{\"content\":\"SMD-2286: captured with $who's exchanged token\"}")
            check "$got" 201 '.id | type == "string"' "a capture with $who's exchanged write token"
            id=$(cut -d' ' -f3- <<<"$got" | jq -r .id)
            row=$(q "SELECT actor_name || ' ' || coalesce(actor_context->'act'->>'name', '-') FROM thought_audit WHERE thought_id = '$id'::uuid AND action = 'capture'")
            [ "$row" = "$who oauth:mcp" ] || { echo "the capture's audit row names \"$row\", not \"$who\" and the MCP service as act"; exit 1; }
          done
          # The JSON-RPC answer to a POST to the proxy's /mcp at the origin's Host with this /mcp token, its bearer
          # read from a file (curl -H @file), never a command line; an event stream's data line, or the JSON body.
          # Read to its end (tail, not head): a tools/list line is some 22 KB, and a reader that leaves early
          # breaks sed's pipe, which pipefail makes the step's failure (review pass 1).
          bearer_file=$(mktemp)
          at_mcp_t() { (umask 077; printf 'Authorization: Bearer %s\n' "$1" > "$bearer_file"); curl -s --max-time 30 -H 'Host: brain.example.test' -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H "@$bearer_file" -d "$2" http://127.0.0.1:8010/mcp | sed -n -e 's/^data: //' -e '/^{/p' | tail -n 1; }
          tools_of() { at_mcp_t "$1" '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | jq -c '[.result.tools[]?.name] | sort'; }
          w_tools=$(tools_of "$(jq -r .mcp <<<"$write_t")")
          r_tools=$(tools_of "$(jq -r .mcp <<<"$read_t")")
          echo "through /mcp: write token ${w_tools:0:120}…, read token ${r_tools:0:120}…"
          jq -e 'index("capture_thought") != null and index("search_thoughts") != null' <<<"$w_tools" > /dev/null || { echo "a write token's tools/list through /mcp named \"${w_tools:0:300}\", not the write tools"; exit 1; }
          jq -e 'index("capture_thought") == null and index("search_thoughts") != null' <<<"$r_tools" > /dev/null || { echo "a read token's tools/list through /mcp named \"${r_tools:0:300}\", not the read tools alone"; exit 1; }
          stats=$(at_mcp_t "$(jq -r .mcp <<<"$read_t")" '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"thought_stats","arguments":{}}}')
          jq -e '(.result.isError // false) == false and (.result.content[0].text | contains("Total thoughts: "))' <<<"$stats" > /dev/null || { echo "a read token's thought_stats through /mcp answered \"${stats:0:300}\""; exit 1; }
          rm -f "$bearer_file"
          auth stop auth
          check "$(at_api /v1/whoami "$api_w")" 200 ".name == \"$who_w\"" "whoami, the authorization server stopped and its keys already read,"
          auth up -d --force-recreate --wait --wait-timeout 120 --no-deps api
          got=$(at_api /v1/whoami "$api_w")
          check "$got" 503 '.code == "BUSY" and .credential == "token"' "whoami, the authorization server stopped and no keys read,"
          [ "$(cut -d' ' -f2 <<<"$got")" = 30 ] || { echo "the 503 for a token with no keys read says Retry-After \"$(cut -d' ' -f2 <<<"$got")\", not 30"; exit 1; }
          auth rm -sfv auth

      # SMD-3307: the operator GUI signs the operator in through the
      # authorization server. The AS's side first: the `gui` client signed in
      # as the GUI does (restart-check.ts --gui-refresh) gets a refresh token,
      # a refresh rotates it, and once revoked, as the GUI's sign-out revokes
      # it, it is refused; a second sign-in in that browser without
      # prompt=login is asked the password all the same, on a grant of its
      # own that the first one's revocation leaves, and prompt=none is
      # login_required. Then the GUI itself, recreated on the configured
      # .env (its OB1_AUTH_SECRET_GUI, the origin) beside a REST core that
      # takes the AS's tokens, driven through the proxy as a browser would
      # (dashboard/smoke-oauth.ts): the start, the password and consent at
      # the AS, the callback opening a session, the views under the token, no
      # token in any page, header, navigation data, script or cookie (the
      # Verify line), a replayed, forged, stolen or other browser's callback
      # refused, a post from another origin refused, sign-out, the next
      # visitor asked the password, and a denied consent. The page of grants
      # (PR 3): the AS's admin listener (deploy/auth/admin.ts, port 3001)
      # holds its rules from inside its container (restart-check.ts --admin:
      # no credential, the MCP service's own and a wrong secret refused, the
      # GUI's listing); the REST core reaches it on the mesh and is refused
      # without the GUI's credentials, the forwarder, off the mesh, reaches
      # nothing, and the proxy routes nothing to it. A third-party client is
      # signed in with a refresh token, refreshed once so it is one the server
      # took (--hold-grant); the smoke revokes its grant on the page, and its
      # refresh token is refused at once (--refused; its access token lapses
      # within 600 s, the maintainer's choice). Last, the listener's failure
      # limit: 20 wrong secrets from the container's own address (one no
      # other call uses), each 401, then the address turned away, the GUI's
      # own credentials from it too (--admin-lockout, which leaves that
      # address locked out for the window; nothing else dials it). Every sign-in the step makes ends revoked, so the AS's store
      # holds no refresh token of the `gui` client after it: sign-out revoked
      # the GUI's. The password goes by name, never on a command line, and the
      # held refresh token sits in a file of the runner's own, removed after.
      - name: The operator GUI signs in through the authorization server
        working-directory: deploy
        run: |
          auth() { docker compose -f compose.yaml --profile auth "$@"; }
          OB1_AUTH_MAX_CLIENTS=10 auth up -d --wait --wait-timeout 120 --no-deps auth
          # The REST core and the GUI after it, so their first calls look each name up afresh (as the step above does).
          auth up -d --force-recreate --wait --wait-timeout 120 --no-deps api app
          OB1_AUTH_OPERATOR_PASSWORD=$(sed -n 's/^OB1_AUTH_OPERATOR_PASSWORD=//p' .env | tr -d "'")
          export OB1_AUTH_OPERATOR_PASSWORD
          auth exec -T -e OB1_AUTH_OPERATOR_PASSWORD auth bun restart-check.ts --gui-refresh
          auth exec -T auth bun restart-check.ts --admin
          [ "$(auth exec -T api bun -e 'const r = await fetch("http://auth.ob1.internal.:3001/grants"); console.log(r.status)')" = 401 ] || { echo "the admin listener did not answer the REST core on the mesh with 401 without the GUI's credentials" >&2; exit 1; }
          [ "$(auth exec -T forwarder bun -e 'fetch("http://auth.ob1.internal.:3001/grants", { signal: AbortSignal.timeout(3000) }).then((r) => console.log(r.status), () => console.log("unreachable"))')" = unreachable ] || { echo "the forwarder, off the mesh, reached the admin listener" >&2; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8010/grants)" = 404 ] || { echo "the proxy routes /grants somewhere" >&2; exit 1; }
          held=$(mktemp)
          ( umask 077; auth exec -T -e OB1_AUTH_OPERATOR_PASSWORD auth bun restart-check.ts --hold-grant > "$held" )
          (cd ../dashboard && bun smoke-oauth.ts --url http://127.0.0.1:8010/dashboard --origin https://brain.example.test --revoke-client "$(jq -r .client_id "$held")")
          auth exec -T auth bun restart-check.ts --refused < "$held"
          rm -f "$held"
          auth exec -T auth bun restart-check.ts --admin-lockout
          left=$(auth exec -T auth bun -e 'import { Database } from "bun:sqlite"; const db = new Database("/data/auth.sqlite", { readonly: true }); console.log(db.query("SELECT count(*) AS n FROM oidc WHERE model = ? AND json_extract(payload, ?) = ?").get("RefreshToken", "$.clientId", "gui").n)')
          [ "$left" = 0 ] || { echo "the authorization server still holds $left refresh token(s) of the gui client after every sign-in signed out: sign-out did not revoke" >&2; exit 1; }
          # The step below removes the authorization server, after its break-glass check with it up.

      # SMD-3307's break-glass port (ADR decision 15): the `breakglass` service,
      # under the auth profile, publishes 127.0.0.1:BREAKGLASS_PORT to the
      # proxy's `breakglass` entrypoint, which routes /dashboard alone and marks
      # it. On 8002 here, not its default, so the GUI's reading of the knob is
      # held too (a form there is taken from http://127.0.0.1:8002 alone); the
      # GUI is recreated on it. dashboard/smoke-breakglass.ts first with the
      # authorization server up (--as-up): a sign-in through it starts on the
      # origin and not on the break-glass port, which offers the key all the
      # same, and a read key's revoke on the page of grants is the action's
      # own 403 (with the server down, the page's load would answer it).
      # Then the server is removed, as the steps after expect, and the GUI
      # recreated again, so its 30 s answer from the server's probe is not one
      # from before the server went; the full run holds the Verify lines: on
      # the origin no key is offered or taken — a forged X-OB1-Listener (the
      # `web` entrypoint deletes it), `Host: 127.0.0.1` from that origin and
      # from the configured one included — while on the break-glass port the
      # key signs in with the server down, under a cookie of its own name, its
      # session opening nothing on the origin; a post there from another
      # loopback port, localhost, the configured origin or none is refused, and
      # nothing but the GUI is routed; the page of grants says that the server
      # is down, and a read key there has no such page (403, its revoke too);
      # the smoke requires the read key, so these rows never skip. The keys go by name, never on a command line. `breakglass` is
      # removed after.
      - name: The break-glass port takes a key while the authorization server is down
        working-directory: deploy
        run: |
          auth() { docker compose -f compose.yaml --profile auth "$@"; }
          export BREAKGLASS_PORT=8002
          auth up -d --force-recreate --wait --wait-timeout 120 --no-deps app
          auth up -d --wait --wait-timeout 60 --no-deps breakglass
          (cd ../dashboard && bun smoke-breakglass.ts --url http://127.0.0.1:8010/dashboard --breakglass http://127.0.0.1:8002/dashboard --origin https://brain.example.test --as-up)
          # Gone again, as the steps above leave it: the next step meets no authorization server.
          auth rm -sfv auth
          auth up -d --force-recreate --wait --wait-timeout 120 --no-deps app
          (cd ../dashboard && bun smoke-breakglass.ts --url http://127.0.0.1:8010/dashboard --breakglass http://127.0.0.1:8002/dashboard --origin https://brain.example.test)
          auth rm -sf breakglass

      # SMD-1846. What the proxy itself owes, beside the smoke:
      # - /.well-known, bare and under it, is answered by the proxy, not the
      #   server — Traefik's 404 body, where the server's would be "Not
      #   Found" — so a claude.ai connector's discovery at the root gets its
      #   404 whatever the server does;
      # - the origin root is retired (SMD-2532): `POST /?key=`, the connector
      #   form clients held before the proxy, `GET /`, /worker-status and
      #   /jobs at the root are the proxy's own 404 with no Deprecation header
      #   (smoke.sh check 11 holds the POST's too); no /mcp, /health or
      #   OPTIONS /health answer carries one;
      # - the access log never holds a query string or userinfo: after calls
      #   carrying the smoke key as `?key=`, `code=`, `state=` and as the user
      #   part of an absolute-form target, no log line carries it, and the
      #   callback's own line is there with its bare path, so the log is on
      #   (the callback reaches the auth router, the authorization server
      #   gone by then: its 404, logged at the entrypoint all the same);
      # - an SSE stream passes through as it is written: with the stub's
      #   embedding held 6 s, the server's 5 s keepalive frame must arrive a
      #   good second before the result. A buffering proxy delivers both
      #   together.
      # After the authorization server's step, in its job (SMD-3051): the MCP
      # server that step recreated serves the configured origin, so the
      # document at loopback's Host is the MCP server's own 404, and the
      # callback reaches the auth router with the authorization server gone.
      # /mcp and /health are the `mcp` service's since SMD-2287, so their lines
      # are in its log, not the REST core's.
      # Its search_thoughts is a semantic search the query log keeps, in a
      # job whose stack no tier step replays.
      - name: The proxy answers discovery itself, logs no key and streams unbuffered
        working-directory: deploy
        run: |
          B=http://127.0.0.1:8010
          for u in "$B/.well-known" "$B/.well-known/oauth-protected-resource"; do
            code=$(curl -s --max-time 10 -o /tmp/proxy-body -w '%{http_code}' "$u")
            if ! { [ "$code" = 404 ] && [ "$(cat /tmp/proxy-body)" = "404 page not found" ]; }; then echo "GET $u → HTTP $code '$(head -c 80 /tmp/proxy-body)', expected the proxy's own 404" >&2; exit 1; fi
          done
          # The MCP server's document is routed to it (SMD-2382), and is its 404
          # here: loopback's Host is not the origin's, and the authorization
          # server is gone.
          code=$(curl -s --max-time 10 -o /tmp/proxy-body -w '%{http_code}' "$B/.well-known/oauth-protected-resource/mcp")
          if ! { [ "$code" = 404 ] && [ "$(cat /tmp/proxy-body)" = "Not Found" ]; }; then echo "GET the document → HTTP $code '$(head -c 80 /tmp/proxy-body)', expected the MCP server's 404" >&2; exit 1; fi
          # SMD-2532: the root is the proxy's own 404 with no Deprecation; the
          # URL is shown without its query, so a key in it is never printed.
          rootgone() {
            rm -f /tmp/proxy-head /tmp/proxy-body
            code=$(curl -s --max-time 10 -X "$1" -D /tmp/proxy-head -o /tmp/proxy-body -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' ${3:+-d "$3"} "$2") || code="no answer (curl exit $?)"
            if ! { [ "$code" = 404 ] && [ "$(cat /tmp/proxy-body)" = "404 page not found" ] && ! grep -qi '^deprecation:' /tmp/proxy-head; }; then echo "$1 ${2%%\?*} → HTTP $code '$(head -c 80 /tmp/proxy-body)', expected the proxy's own 404 with no Deprecation: the old root URL is retired (SMD-2532)" >&2; exit 1; fi
          }
          rootgone POST "$B/?key=$OB1_SMOKE_CAPTURE_KEY" '{"jsonrpc":"2.0","id":4,"method":"tools/list","params":{}}'
          rootgone GET "$B/"
          rootgone GET "$B/worker-status"
          rootgone GET "$B/jobs/x"
          # The status and how many Deprecation headers came back: "200 0".
          dep() { curl -s --max-time 10 -D - -o /dev/null "$@" | tr -d '\r' | awk 'NR == 1 { code = $2 } tolower($0) ~ /^deprecation: @/ { n++ } END { print code, n + 0 }'; }
          for probe in "$B/health" "$B/mcp/health"; do
            got=$(dep "$probe")
            [ "$got" = "200 0" ] || { echo "GET $probe: '$got', expected 200 with no Deprecation header" >&2; exit 1; }
          done
          got=$(dep -X OPTIONS -H 'Origin: https://client.example' -H 'Access-Control-Request-Method: GET' "$B/health")
          [ "$got" = "200 0" ] || { echo "OPTIONS /health: '$got', expected 200 with no Deprecation header (the health route's)" >&2; exit 1; }
          curl -s --max-time 10 -o /dev/null "$B/auth/callback?code=code-$OB1_SMOKE_KEY&state=state-$OB1_SMOKE_KEY"
          # The server's JSON lines for a thought_stats call so far (SMD-1849),
          # so the absolute-form probe's own line is counted below, not an
          # earlier call's. A trace id closes the line where a `traceparent`
          # came in or a collector is set (PR 2b); neither is, here.
          STATS_LINE='^\{"ts":"[^"]+","door":"mcp","method":"POST","rpc":"tools/call","tool":"thought_stats","agent":"[^"]+","status":200,"outcome":"ok","ms":[0-9]+,"bytes":[0-9]+(,"trace":"[0-9a-f]{32}")?\}$'
          stats_before=$(docker compose -f compose.yaml logs --no-color --no-log-prefix mcp | grep -cE "$STATS_LINE" || true)
          # Answered by the server, so Traefik took the absolute form and logged it:
          # a refusal before the log would leave the userinfo half untested.
          code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"thought_stats","arguments":{}}}' --request-target "http://ci-$OB1_SMOKE_KEY@127.0.0.1:8010/mcp?key=$OB1_SMOKE_KEY" "$B/")
          [ "$code" = 200 ] || { echo "the absolute-form probe got HTTP $code, not the server's 200, so its log line proves nothing" >&2; exit 1; }
          sleep 1
          LOG="$(docker compose -f compose.yaml logs --no-color --no-log-prefix proxy)"
          if grep -qF "$OB1_SMOKE_KEY" <<<"$LOG"; then echo "the proxy's access log holds the smoke key from a query string or userinfo" >&2; exit 1; fi
          grep -qF '"RequestPath":"/auth/callback"' <<<"$LOG" || { echo "no access-log line for the callback with its bare path, so the absence of the key proves nothing:" >&2; tail -5 <<<"$LOG" >&2; exit 1; }
          # The MCP server's own line per request (SMD-1849): the absolute-form
          # probe's tool call above, by its tool, its key's name, how it ended
          # and its time — and the key it carried in ?key= nowhere in either
          # server's log.
          SLOG="$(docker compose -f compose.yaml logs --no-color --no-log-prefix api)"
          MLOG="$(docker compose -f compose.yaml logs --no-color --no-log-prefix mcp)"
          if grep -qF "$OB1_SMOKE_KEY" <<<"$SLOG$MLOG"; then echo "a server's log holds the smoke key" >&2; exit 1; fi
          stats_after=$(grep -cE "$STATS_LINE" <<<"$MLOG" || true)
          [ "$stats_after" -eq $((stats_before + 1)) ] \
            || { echo "the absolute-form probe's thought_stats call left $((stats_after - stats_before)) JSON lines in the MCP server's log, not one, so the absence of the key proves nothing:" >&2; grep '^{"ts"' <<<"$MLOG" | tail -5 >&2; exit 1; }
          touch /tmp/provider-stub-slow-embed
          trap 'rm -f /tmp/provider-stub-slow-embed' EXIT
          python3 - "$B/mcp" "$OB1_SMOKE_KEY" <<'PY'
          import json, sys, time, urllib.request
          url, key = sys.argv[1], sys.argv[2]
          body = json.dumps({"jsonrpc": "2.0", "id": 7, "method": "tools/call", "params": {"name": "search_thoughts", "arguments": {"query": "proxy stream probe"}}}).encode()
          req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json", "Accept": "application/json, text/event-stream", "x-brain-key": key})
          t0 = time.monotonic(); keepalive = result = None
          with urllib.request.urlopen(req, timeout=60) as r:
              for line in r:
                  t = time.monotonic() - t0
                  if line.startswith(b": keepalive") and keepalive is None: keepalive = t
                  if line.startswith(b"data: ") and b'"id":7' in line: result = t
          print(f"keepalive frame at {keepalive}, result at {result} (seconds after the request)")
          if keepalive is None or result is None: sys.exit("the stream lacked a keepalive frame or the result")
          if result - keepalive < 0.5: sys.exit("the keepalive frame arrived with the result: the proxy buffered the stream")
          PY

      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose -f compose.yaml logs --tail 60
          echo "--- provider stub (the runner's listener on :11434) ---"
          cat /tmp/provider-stub.log 2>/dev/null || echo "(no stub log)"

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose -f compose.yaml down -v

  # SMD-3170: the observability profile's step, in a job of its own on a stack
  # of its own. In deploy-stack it was a median 134 s of that job's 360, the
  # run's critical path, and it needs nothing of that job's but a stack up
  # configured as it was there.
  deploy-stack-observability:
    name: "Full stack: the observability profile"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun on the runner, for auth/provision.ts, which
      # .github/ci/auth-settings.sh runs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      # lgtm's image (2.6 GB) and pg-exporter's, pulled while the stack comes up
      # rather than inside the observability step, where the pull took 21–28 s
      # (SMD-3199). Both are pinned by digest in compose.yaml, so they are read
      # from the file with no deploy/.env yet, and a ref not pinned is refused.
      # The pull writes its log, then its exit code by a rename, which the
      # observability step waits for before it reads the disk.
      - name: Pull the observability profile's images, in the background
        working-directory: deploy
        run: |
          # shellcheck disable=SC2016 # Bun's template literal
          refs=$(bun -e 'const c = Bun.YAML.parse(await Bun.file("compose.yaml").text()); const r = ["lgtm", "pg-exporter"].map((s) => c.services[s]?.image ?? ""); if (r.some((x) => !/@sha256:[0-9a-f]{64}$/.test(x))) { console.error(`an observability image is not pinned by digest in compose.yaml: ${r.join(" ")}`); process.exit(1); } console.log(r.join(" "));')
          echo "pulling $refs"
          (
            rc=0
            for ref in $refs; do docker pull -q "$ref" || rc=$?; done
            echo "$rc" > "$RUNNER_TEMP/observability-pull.rc.part" && mv "$RUNNER_TEMP/observability-pull.rc.part" "$RUNNER_TEMP/observability-pull.rc"
          ) < /dev/null > "$RUNNER_TEMP/observability-pull.log" 2>&1 &

      # The stack end to end: bring up Postgres, apply the schema and
      # serve MCP, with no Supabase CLI installed and no supabase.com account.
      # The keys (their raw values in $GITHUB_ENV for the steps below), the
      # provider stub on the runner, deploy/.env and the up are
      # .github/ci/full-stack-up.sh's, with why each is as it is (SMD-3051).
      - name: Bring up the compose stack
        run: .github/ci/full-stack-up.sh

      # The stack the observability step met in deploy-stack, where it ran
      # until SMD-3170: deploy/.env configured for an authorization server
      # (.github/ci/auth-settings.sh) and the MCP server /mcp reaches recreated
      # on it (SMD-2287), with the REST core beside it — with none running. So
      # lgtm starts on an https public origin, Grafana's root URL under it and
      # its cookie secure (compose.yaml's lgtm command), which no other job
      # starts it on.
      - name: The server is configured for an authorization server that is not running
        working-directory: deploy
        run: |
          ../.github/ci/auth-settings.sh
          docker compose -f compose.yaml --profile auth up -d --wait --wait-timeout 120 --no-deps api mcp

      # SMD-1849 PR 3c: the observability profile on this job's stack, the one
      # place CI starts it. The servers send to its collector (the endpoint and
      # a 5 s metric interval in deploy/.env, as deploy/README.md turns it on,
      # with dummy passwords of its own; deploy-stack-brains' canary step plants
      # its own in its job), smoke.sh's refused requests are the log
      # records not ok, and four tool calls make traffic on every poll below —
      # a capture embeds through the stub and its metadata call is the stub's
      # 404, so the provider rows have points; scan_thoughts runs a job — since
      # every series here is new: a counter that moved once and then stayed
      # flat rates 0 and its quantile is NaN (review pass 2), and the
      # exporter's first scrape may come after one round. Then
      # compose's render of the dashboard is deploy/observability/dashboard.json
      # (the `$$` read back as `$`), Grafana's own copy (compose.yaml's
      # grafana-dashboard config) is read back with every query the file has,
      # rows' nested panels included, and is the page Grafana opens on, and
      # every query is run where Grafana would run it, its variables at All
      # and its rate window 5 m. Each Prometheus query must return a series
      # with a number above 0 in it within three minutes (the exporter is
      # scraped every 10 s here, 30 s as shipped) — or 0 itself for the ten
      # that answer 0 where their family has series and their filter matches
      # nothing (`or 0 * …`:
      # the failure share, the store's three, the collector's three and its
      # three totals), empty where it has none — but the NO_TRAFFIC panel,
      # whose events this traffic does not make; each Loki query must return
      # a record (one that parsed and has an outcome); each Tempo query must
      # find a trace (the stub's 404 ends a provider span in error). So this
      # holds every name, and every label a matcher requires, on the pinned
      # images; check 37 holds the names and labels without a running profile. Loki refuses every record with its
      # disk past 90% (PR 3c, measured), so the runner's is read once lgtm's
      # image is pulled (in the background since the job's start, SMD-3199),
      # before Loki starts, and room made where it is tight. The step is the
      # job's last before the teardown, so it leaves the stack as it ends it:
      # it put deploy/.env and the servers back as it found them until
      # SMD-3199, for a step after it that no longer exists — a step added
      # after it brings that back. CI's clocks are 10 s, not the shipped 30 s:
      # the collector's scrape of pg-exporter and the alert rules' evaluation,
      # from an overlay derived from compose's own render, so the rest of the
      # collector's config is the shipped one, and the step holds that the
      # overlay changes the interval alone (SMD-3199; checks 37 and 38 hold the
      # files' text). A capture citing a thought that is not there
      # makes the store's refusals line read above 0, and one tool called
      # once proves Prometheus's zero at a series' start.
      # SMD-3050: compose's render of the alert rules is
      # deploy/observability/alert-rules.yaml, Grafana holds exactly its
      # rules, provisioned from it, and after the traffic the provider rule is
      # pending (the stub's 404s) and the other four normal and healthy; then
      # pg-exporter stops and the Postgres rule must go pending (check 38
      # holds the rules' names and labels without a running profile).
      # SMD-3023: before that stop, pg-exporter's front answers its one path
      # on telemetry, refuses /probe even after a scrape on one connection,
      # and nothing on data reaches it.
      - name: The observability profile's dashboard reads every series it names
        working-directory: deploy
        run: |
          printf 'GRAFANA_ADMIN_PASSWORD=ci-dummy-grafana-password\nOB1_MONITOR_DB_PASSWORD=ci-dummy-monitor-password-0123456789\nOTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm.ob1.internal.:4318\nOTEL_METRIC_EXPORT_INTERVAL=5000\n' >> .env
          # compose's render prints each `$` doubled again, as compose.yaml has it,
          # so it reads back as the file once undoubled (Grafana's mount has one).
          docker compose -f compose.yaml --profile observability config --format json > /tmp/observability-render.json
          jq -j '.configs["grafana-dashboard"].content | gsub("[$][$]"; "$")' /tmp/observability-render.json | cmp - observability/dashboard.json \
            || { echo "compose renders the grafana-dashboard config otherwise than deploy/observability/dashboard.json" >&2; exit 1; }
          jq -j '.configs["grafana-alert-rules"].content | gsub("[$][$]"; "$")' /tmp/observability-render.json | cmp - observability/alert-rules.yaml \
            || { echo "compose renders the grafana-alert-rules config otherwise than deploy/observability/alert-rules.yaml" >&2; exit 1; }
          # CI's clocks, 10 s where the files say 30 s (SMD-3199): the collector's
          # scrape of pg-exporter and the rule group's evaluation, written from
          # the render above into an overlay, so the collector's whole pipeline
          # and the rules are the shipped ones but for the interval. Each
          # substitution must have changed its value, and the overlay's render
          # must differ from the shipped one in those two values alone.
          ci=$RUNNER_TEMP/observability-ci.json
          # The two substitutions, once: the overlay is written with them and checked against them.
          tens='def args: .services.lgtm.environment.OTELCOL_EXTRA_ARGS | sub("\"scrape_interval\":\"30s\""; "\"scrape_interval\":\"10s\"");
                def rules: .configs["grafana-alert-rules"].content | sub("(?m)^    interval: 30s$"; "    interval: 10s");'
          jq "$tens"' {services: {lgtm: {environment: {OTELCOL_EXTRA_ARGS: args}}}, configs: {"grafana-alert-rules": {content: rules}}}' /tmp/observability-render.json > "$ci"
          docker compose -f compose.yaml -f "$ci" --profile observability config --format json > /tmp/observability-render-ci.json
          jq -e --slurpfile ci /tmp/observability-render-ci.json "$tens"'
              args as $args | rules as $rules
            | $args != .services.lgtm.environment.OTELCOL_EXTRA_ARGS and $rules != .configs["grafana-alert-rules"].content
            and $ci[0].services.lgtm.environment.OTELCOL_EXTRA_ARGS == $args and $ci[0].configs["grafana-alert-rules"].content == $rules
            and ($ci[0] | del(.services.lgtm.environment.OTELCOL_EXTRA_ARGS, .configs["grafana-alert-rules"].content)) == del(.services.lgtm.environment.OTELCOL_EXTRA_ARGS, .configs["grafana-alert-rules"].content)' \
            /tmp/observability-render.json > /dev/null \
            || { echo "CI's overlay does not change the collector's scrape interval and the alert rules' interval from 30 s to 10 s, and those alone" >&2; exit 1; }
          # The disk read once lgtm's image (2.6 GB) is pulled and before Loki
          # starts on it: Loki refuses every record with the disk under lgtm-data
          # past 90% (PR 3c, measured), and the log query below would fail with
          # no reason given. Where it is tight, the runner image's SDKs this job
          # never uses (several GB) make room. The pull began at the job's start.
          for _ in $(seq 600); do [ -f "$RUNNER_TEMP/observability-pull.rc" ] && break; sleep 1; done
          [ "$(cat "$RUNNER_TEMP/observability-pull.rc" 2> /dev/null)" = 0 ] \
            || { echo "the observability images' pull did not end with 0 within 10 minutes ($(cat "$RUNNER_TEMP/observability-pull.rc" 2> /dev/null || echo "no exit code")):" >&2; cat "$RUNNER_TEMP/observability-pull.log" >&2; exit 1; }
          root=$(docker info -f '{{.DockerRootDir}}')
          used=$(df --output=pcent "$root" | tail -1 | tr -dc 0-9)
          if [ "$used" -ge 85 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            used=$(df --output=pcent "$root" | tail -1 | tr -dc 0-9)
          fi
          df -h "$root"
          [ "$used" -lt 90 ] || { echo "the runner's disk under Docker's root is ${used}% full: Loki refuses every record from 90% (lgtm-data is there), so the log query below could not pass" >&2; exit 1; }
          docker compose -f compose.yaml -f "$ci" --profile observability up -d --wait --wait-timeout 300 lgtm pg-monitor-role pg-exporter
          docker compose -f compose.yaml up -d --no-deps --wait --wait-timeout 120 api mcp
          ./smoke.sh http://127.0.0.1:8010/mcp "$OB1_SMOKE_KEY" > /tmp/observability-smoke.log 2>&1 || { cat /tmp/observability-smoke.log; exit 1; }
          # Each call's tool, status and, where the tool refused, isError;
          # curl's own failure as status 000.
          call() {
            local code
            rm -f /tmp/call-body
            code=$(curl -s --max-time 60 -o /tmp/call-body -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H "x-brain-key: $OB1_SMOKE_KEY" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"$1\",\"arguments\":$2}}" http://127.0.0.1:8010/mcp) || code=000
            if grep -q '"isError":true' /tmp/call-body 2> /dev/null; then code="$code isError"; fi
            if grep -q '"error":{' /tmp/call-body 2> /dev/null; then code="$code error"; fi
            echo "$1 $code"
          }
          traffic() {
            call capture_thought '{"content":"The observability step captures this so the provider and store rows have points."}'
            call search_thoughts '{"query":"observability step provider rows"}'
            call search_thoughts_keyword '{"query":"observability"}'
            call scan_thoughts '{"limit":5}'
          }
          # A capture citing a thought that is not there: the store refuses it with
          # P0001 (measured), so the store's refusals line has a point to read.
          refusal() { call capture_thought '{"content":"The observability step cites a thought that is not there.","derived_from":["00000000-0000-0000-0000-000000000000"]}'; }
          first=$(traffic)
          echo "$first"
          refusal > /dev/null || true
          # Called once, never again: its series is born at its first count, which
          # only the zero Prometheus ingests at a series' start lets a rate see
          # (created-timestamp-zero-ingestion, PR 3c review pass 2): an image bump
          # that drops the flag fails here, where Prometheus's own warning goes to
          # a log the image discards.
          once=$(call worker_status '{}')
          [[ "$once" == "worker_status 200" ]] || { echo "worker_status answered $once" >&2; exit 1; }
          # docker exec by the container's id, not compose exec: about thirty
          # a poll, and compose reads compose.yaml again for each.
          lgtm_id=$(docker compose -f compose.yaml --profile observability ps -q lgtm)
          in_lgtm() { docker exec -i "$lgtm_id" "$@" < /dev/null; }
          said() {
            echo "$1" >&2
            df -h / "$(docker info -f '{{.DockerRootDir}}')" >&2 || true
            in_lgtm curl -s -G http://127.0.0.1:9090/api/v1/query --data-urlencode 'query={__name__=~"otelcol_(exporter_(send|enqueue)_failed|receiver_(refused|failed))_.+"} > 0' | jq -c '[.data.result[] | {(.metric.__name__): .value[1]}]' >&2 || true
            docker compose -f compose.yaml --profile observability logs --tail 40 lgtm pg-exporter >&2 || true
            exit 1
          }
          if grep -v ' 200$' <<<"$first"; then said "a tool call above did not answer 200 without isError, so the dashboard's queries would wait on traffic that is not there"; fi
          # Grafana provisions in a service of its own after its health
          # answers: up to 30 s for it.
          for _ in $(seq 30); do
            # shellcheck disable=SC2016 # the password is lgtm's own variable, expanded in its shell
            if in_lgtm bash -c 'curl -fsS -u "admin:$GF_SECURITY_ADMIN_PASSWORD" http://127.0.0.1:3000/grafana/api/dashboards/uid/ob1' > /tmp/grafana-dashboard.json 2> /dev/null; then break; fi
            sleep 1
          done
          [ "$(jq '.meta.provisioned' /tmp/grafana-dashboard.json 2> /dev/null)" = true ] || said "Grafana has no provisioned dashboard ob1: compose.yaml's provider did not load deploy/observability/dashboard.json"
          # shellcheck disable=SC2016 # as above
          # Grafana 13 answers its home with a redirect to the file's
          # dashboard by its title's slug (measured on the pin).
          home=$(in_lgtm bash -c 'curl -fsS -u "admin:$GF_SECURITY_ADMIN_PASSWORD" http://127.0.0.1:3000/grafana/api/dashboards/home' | jq -r '.redirectUri // .dashboard.title') || said "Grafana's home did not answer"
          [[ "$home" == */open-brain || "$home" == "Open Brain" ]] || said "Grafana does not open on the dashboard Open Brain (GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH): its home is $home"
          # shellcheck disable=SC2016 # jq's variables, not the shell's
          targets='[.panels[] | (., .panels[]?) | select(.type != "row") | .title as $t | (.targets // [])[] | {t: $t, r: .refId, u: .datasource.uid, q: (.expr // .query)}]'
          jq -c ".dashboard | $targets | .[]" /tmp/grafana-dashboard.json > /tmp/grafana-queries.jsonl
          want=$(jq "$targets | length" observability/dashboard.json)
          if [ "$want" -lt 25 ] || [ "$(wc -l < /tmp/grafana-queries.jsonl)" -ne "$want" ]; then said "Grafana's dashboard ob1 has $(wc -l < /tmp/grafana-queries.jsonl) queries where deploy/observability/dashboard.json has $want"; fi
          # Server failures by error type count only a request the server
          # failed, which nothing here makes.
          NO_TRAFFIC="Server failures, by error type"
          # The queries that answer 0 where their filter matches nothing.
          zero_ok() { grep -qE ' or 0 \* | or vector\(0\)' <<<"$1"; }
          # But the store's refusals, which refusal() makes.
          REQUIRED="Store errors: refusals, faults and stops [A]"
          empty() {
            local line t r u q n z missing=""
            while IFS= read -r line; do
              t=$(jq -r .t <<<"$line"); r=$(jq -r .r <<<"$line"); u=$(jq -r .u <<<"$line"); q=$(jq -r .q <<<"$line")
              z=positive; if zero_ok "$q" && [ "$t [$r]" != "$REQUIRED" ]; then z=any; fi
              q=${q//\$__rate_interval/5m}; q=${q//\$__range/15m}; q=${q//\$service/.+}; q=${q//\$tier/.*}; q=${q//\$database/.+}
              case "$u" in
                prometheus) n=$(in_lgtm curl -s -G http://127.0.0.1:9090/api/v1/query --data-urlencode "query=$q" | jq -r --arg z "$z" 'if .status == "success" then [.data.result[] | select(.value[1] | test("^[-+]?[0-9]")) | select($z == "any" or (.value[1] | tonumber) > 0)] | length else "error: \(.error)" end') ;;
                loki) n=$(in_lgtm curl -s -G http://127.0.0.1:3100/loki/api/v1/query_range --data-urlencode "query=$q" --data-urlencode since=15m --data-urlencode limit=5 | jq -r 'if .status == "success" then .data.result | length else "error" end' 2> /dev/null || echo error) ;;
                tempo) n=$(in_lgtm curl -s -G http://127.0.0.1:3200/api/search --data-urlencode "q=$q" --data-urlencode limit=5 | jq -r 'if has("traces") then .traces | length else "error" end' 2> /dev/null || echo error) ;;
                *) n="error: data source $u" ;;
              esac
              if [ "$n" = 0 ] && [ "$t" = "$NO_TRAFFIC" ]; then continue; fi
              case "$n" in [1-9]*) ;; *) missing="$missing"$'\n'"  $t [$r]: $n" ;; esac
            done < /tmp/grafana-queries.jsonl
            printf '%s' "$missing"
          }
          t0=$(date +%s)
          while :; do
            missing=$(empty)
            [ -z "$missing" ] && break
            [ $(($(date +%s) - t0)) -lt 180 ] || said "these dashboard queries returned no number (above 0 where they have no 0 of their own) within 3 minutes of traffic, or failed:$missing"
            traffic > /dev/null || true
            refusal > /dev/null || true
            sleep 10
          done
          echo "every query of the dashboard's $want returned a series, $NO_TRAFFIC aside, in $(($(date +%s) - t0)) s"
          for _ in $(seq 12); do
            born=$(in_lgtm curl -s -G http://127.0.0.1:9090/api/v1/query --data-urlencode 'query=sum(increase(http_server_request_duration_seconds_count{ob1_tool="worker_status"}[10m]))' | jq -r '.data.result[0].value[1] // "none"')
            [[ "$born" =~ ^[0-9.]+$ ]] && awk -v b="$born" 'BEGIN { exit !(b > 0.5) }' && break
            sleep 5
          done
          if ! { [[ "$born" =~ ^[0-9.]+$ ]] && awk -v b="$born" 'BEGIN { exit !(b > 0.5) }'; }; then said "worker_status, called once, increased by $born over 10 m: Prometheus no longer ingests a zero at a series' start (created-timestamp-zero-ingestion in compose.yaml's PROMETHEUS_EXTRA_ARGS), so a single failure reads 0 on every panel"; fi
          # SMD-3050: the alert rules, as Grafana holds them — each of the
          # file's, from the file (provisioned) — and their states, each rule's
          # on a line: state, health, uid.
          # shellcheck disable=SC2016 # as above
          in_lgtm bash -c 'curl -fsS --max-time 10 -u "admin:$GF_SECURITY_ADMIN_PASSWORD" http://127.0.0.1:3000/grafana/api/v1/provisioning/alert-rules' > /tmp/grafana-alert-rules.json || said "Grafana's alert rules did not answer"
          rules_have=$(jq -r '[.[] | select(.provenance == "file") | .uid] | sort | join(" ")' /tmp/grafana-alert-rules.json)
          rules_want=$({ grep -oP '^      - uid: \K\S+' observability/alert-rules.yaml || true; } | LC_ALL=C sort | paste -sd ' ')
          # …in the dashboard's folder, not a second "Open Brain" beside it.
          jq -e --slurpfile d /tmp/grafana-dashboard.json '. != [] and all(.[]; .folderUID == $d[0].meta.folderUid)' /tmp/grafana-alert-rules.json > /dev/null \
            || said "Grafana's alert rules are not all in the dashboard's folder ($(jq -r '.meta.folderUid' /tmp/grafana-dashboard.json)): $(jq -c '[.[] | {uid, folderUID}]' /tmp/grafana-alert-rules.json)"
          if [ -z "$rules_want" ] || [ "$rules_have" != "$rules_want" ]; then said "Grafana holds the provisioned alert rules '$rules_have' where deploy/observability/alert-rules.yaml has '${rules_want:-none (its uid lines were not read)}'"; fi
          states() {
            # shellcheck disable=SC2016 # as above
            in_lgtm bash -c 'curl -fsS --max-time 10 -u "admin:$GF_SECURITY_ADMIN_PASSWORD" http://127.0.0.1:3000/grafana/api/prometheus/grafana/api/v1/rules' \
              | jq -r '.data.groups[] | select(.name == "Open Brain") | .rules[] | "\(.state) \(.health) \(.uid)"'
          }
          prom() { in_lgtm curl -s --max-time 10 -G http://127.0.0.1:9090/api/v1/query --data-urlencode "query=$1" | jq -c '[.data.result[]? | {m: .metric, v: .value[1]}]' || true; }
          # Every rule judged on one read: the provider rule pending or firing
          # — the stub's 404 for each capture's metadata call is a provider
          # failure, and about three in 10 m make it pending (firing 5 m on) —
          # and the other four normal and healthy, nothing here making their
          # conditions. Rules are evaluated every 10 s here (30 s as shipped);
          # a read from before the exporter's first scrape may still hold the
          # Postgres rule's NoData, so the wait is for all of it, 18 rounds
          # (about two minutes).
          judged() {
            local uid
            grep -qE '^(pending|firing) ok ob1-provider-failures$' <<<"$st" || return 1
            for uid in $rules_want; do
              [ "$uid" = ob1-provider-failures ] || grep -qx "inactive ok $uid" <<<"$st" || return 1
            done
          }
          for _ in $(seq 18); do
            st=$(states) || st=""
            judged && break
            traffic > /dev/null || true
            sleep 5
          done
          echo "$st"
          judged || said "the alert rules are not the provider rule pending (the stub's 404s) and the other four normal and healthy after 18 rounds: $(tr '\n' ';' <<<"$st"); Prometheus's failed provider calls over 10 m: $(prom 'sum by (gen_ai_operation_name, error_type) (increase(gen_ai_client_operation_duration_seconds_count{error_type!="", ob1_probe=""}[10m]))')"
          # SMD-3023: pg-exporter's front. From telemetry (lgtm), the one path
          # answers pg_up 1; /probe (a wrong password for ob1_monitor, its
          # target without TLS, since a TLS attempt is refused before the
          # password is checked and Postgres would log no failure), the
          # exporter's landing page and /metrics are httpd's 404, a /probe sent
          # after a scrape on the same connection gets no answer, and Postgres
          # logs no sign-in for either. From data (the server), nothing
          # answers at the exporter's address there or on telemetry, on its
          # front's port or its own.
          probe='/probe?target=postgres://ob1_monitor:ci-wrong-password@postgres:5432/openbrain?sslmode=disable'
          front() { in_lgtm curl -s -o /dev/null -w '%{http_code}' -m 10 --path-as-is "http://pg-exporter.ob1.internal.:9187$1" || true; }
          # grep -c, not -q: under pipefail, -q's early exit fails the pipe.
          up=$(in_lgtm curl -fsS -m 10 http://pg-exporter.ob1.internal.:9187/cgi-bin/metrics | grep -cx 'pg_up 1' || true)
          [ "$up" = 1 ] || said "pg-exporter's /cgi-bin/metrics did not answer pg_up 1 from telemetry"
          for path in "$probe" / /metrics "/cgi-bin/..$probe"; do
            code=$(front "$path")
            [ "$code" = 404 ] || said "pg-exporter's front answered $code, not 404, for $path from telemetry"
          done
          # shellcheck disable=SC2016 # the request is lgtm's bash's to send
          piped=$(in_lgtm bash -c 'exec 3<> /dev/tcp/pg-exporter.ob1.internal./9187; printf "GET /cgi-bin/metrics HTTP/1.1\r\nHost: a\r\n\r\nGET %s HTTP/1.1\r\nHost: a\r\nConnection: close\r\n\r\n" "$1" >&3; timeout 15 cat <&3' _ "$probe" | grep -ac '^HTTP/' || true)
          [ "$piped" = 1 ] || said "pg-exporter's front answered $piped requests, not 1, on a connection carrying a scrape and then a /probe"
          exporter_id=$(docker compose -f compose.yaml --profile observability ps -q pg-exporter)
          tel=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{$v.IPAddress}}{{"\n"}}{{end}}' "$exporter_id" | awk '$1 ~ /_telemetry$/ { print $2 }')
          [ -n "$tel" ] || said "pg-exporter has no address on telemetry"
          # shellcheck disable=SC2016 # Bun's template literal
          docker compose -f compose.yaml exec -T api bun -e 'let n = 0; for (const u of process.argv.slice(1)) { try { const r = await fetch(u, { signal: AbortSignal.timeout(3000) }); console.log(`${u} answered ${r.status} from data`); n++; } catch {} } process.exit(n ? 1 : 0)' \
            http://pg-exporter:9187/cgi-bin/metrics "http://$tel:9187/cgi-bin/metrics" http://pg-exporter:9188/metrics "http://$tel:9188/metrics" \
            || said "a container on data reached pg-exporter (above)"
          # Postgres's line for a sign-in a /probe caused can reach its log
          # after the probe's answer (measured): a moment for it.
          sleep 2
          signins=$(docker compose -f compose.yaml logs postgres 2>&1 | grep -c 'password authentication failed for user "ob1_monitor"' || true)
          [ "$signins" = 0 ] || said "Postgres logged $signins failed sign-ins as ob1_monitor: a /probe reached the exporter"
          echo "pg-exporter answers /cgi-bin/metrics alone, on telemetry alone"
          # The ticket's forced condition: the exporter stopped, the collector's
          # next scrape reads up 0 (within its 10 s here), and the Postgres rule is
          # pending at an evaluation after it (22–61 s from the stop over three
          # fresh runs on the shipped 30 s, measured), firing a minute on.
          docker compose -f compose.yaml --profile observability stop pg-exporter
          for _ in $(seq 36); do
            st=$(states) || st=""
            grep -qE '^(pending|firing) ok ob1-postgres-unreached$' <<<"$st" && break
            sleep 5
          done
          grep -qE '^(pending|firing) ok ob1-postgres-unreached$' <<<"$st" || said "the Postgres rule did not go pending within 3 minutes of pg-exporter's stop: $(tr '\n' ';' <<<"$st"); Prometheus's up and pg_up for the exporter: $(prom 'up{job="postgres"}') $(prom 'pg_up{job="postgres"}')"
          echo "the Postgres rule pending after pg-exporter's stop"

      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose -f compose.yaml logs --tail 60
          echo "--- the observability profile (its step's, if it stopped with them up) ---"
          docker compose -f compose.yaml --profile observability logs --tail 60 lgtm pg-exporter pg-monitor-role || true
          echo "--- provider stub (the runner's listener on :11434) ---"
          cat /tmp/provider-stub.log 2>/dev/null || echo "(no stub log)"

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose -f compose.yaml --profile observability down -v

  # SMD-2285: the authorization server's proof of concept, evals/auth/, run
  # against the deploy's own server image (deploy/auth/). The upstream of
  # oidc-provider declines Bun support, so the server runs on Bun only while
  # this job holds every criterion: discovery under /auth,
  # registration by metadata document and by DCR from the SDK v2 client, the
  # fetch guard (the library's own SSRF protection does not load under Bun),
  # PKCE and client credentials, one audience per token, and token exchange.
  # Twice on one stack, as the ticket's Verify asks. An oidc-provider bump is a
  # PR that runs this job. The runner-up, Better Auth, runs the same verifier
  # after it (its one known difference is listed in eval-auth.ts), so a change
  # to the shared kit cannot quietly break the comparison the pick rests on.
  auth-poc:
    name: Authorization server POC (oidc-provider on Bun)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install the evals' pinned packages
        working-directory: evals
        run: bun install --frozen-lockfile

      - name: The stack comes up
        working-directory: evals
        run: bun eval-auth.ts --up oidc-provider

      - name: Every criterion holds, twice
        working-directory: evals
        run: |
          bun eval-auth.ts --verify oidc-provider
          bun eval-auth.ts --verify oidc-provider

      - name: Logs on failure
        if: failure()
        working-directory: evals/auth
        run: docker compose -p ob1-auth-oidc-provider --env-file .env -f compose.yaml -f compose.oidc-provider.yaml logs --tail 80

      - name: Tear down
        if: always()
        working-directory: evals
        run: bun eval-auth.ts --down oidc-provider

      - name: The runner-up comes up (Better Auth)
        working-directory: evals
        run: bun eval-auth.ts --up better-auth

      - name: The runner-up holds every criterion, twice (its departures from a standard are noted, not excused)
        working-directory: evals
        run: |
          bun eval-auth.ts --verify better-auth
          bun eval-auth.ts --verify better-auth

      - name: Runner-up logs on failure
        if: failure()
        working-directory: evals/auth
        run: docker compose -p ob1-auth-better-auth --env-file .env -f compose.yaml -f compose.better-auth.yaml logs --tail 80

      - name: Runner-up torn down
        if: always()
        working-directory: evals
        run: bun eval-auth.ts --down better-auth

  compat-shim:
    name: supabase-js compatibility shim
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: ob1test
          POSTGRES_DB: ob1test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install
        working-directory: compat/supabase-sql
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: compat/supabase-sql
        run: bunx tsc --noEmit

      # The service carries no health check: db-live's "Wait for the service
      # Postgres" has why (SMD-3196).
      - name: Wait for the service Postgres
        run: |
          ready() {
            local deadline=$((SECONDS + 60)) why
            until docker exec "$1" pg_isready -h 127.0.0.1 -U postgres -q 2>/dev/null; do
              if [ "$(docker container inspect -f '{{.State.Running}}' "$1" 2>/dev/null)" = false ]; then why="exited"
              elif [ "$SECONDS" -ge "$deadline" ]; then why="did not accept a TCP connection within 60 s"
              else sleep 0.2; continue; fi
              echo "the service Postgres in container $1 $why" >&2; docker logs "$1" 2>&1 | tail -20 >&2; exit 1
            done
          }
          ready "$PG"
        env:
          PG: ${{ job.services.postgres.id }}

      # Every file the codemod lists depends on this behaving exactly like supabase-js. A shim that is
      # merely close is worse than none — they would inherit the differences with
      # no failing test to find them.
      - name: Conformance against real Postgres
        working-directory: compat/supabase-sql
        run: bun test-compat.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # Every migrated file must still parse, and the codemod must round-trip
      # byte-for-byte so a migration is always reversible.
      - name: Migrated files parse
        run: |
          # Read filenames a line at a time, not word-split from $(…) (SC2013),
          # and keep the loop in this shell (not a pipe subshell) so `fail`
          # survives it — process substitution feeds the while (SMD-1808).
          fail=0
          while IFS= read -r f; do
            bun build "$f" --target=bun --external '*' --outfile /dev/null >/dev/null 2>&1 \
              || { echo "does not parse: $f"; fail=1; }
          done < <(grep -rl 'MIGRATED OFF SUPABASE' --include='*.ts' --include='*.mjs' --include='*.js' \
                     --exclude-dir=node_modules --exclude-dir=.git . | grep -v scripts/)
          exit $fail

      - name: Codemod round-trips losslessly
        run: |
          bun scripts/migrate-to-sql-shim.ts --revert >/dev/null
          bun scripts/migrate-to-sql-shim.ts --apply --all >/dev/null
          if ! git diff --quiet; then
            echo "apply→revert→apply is not idempotent:" >&2
            git diff --stat >&2
            exit 1
          fi
          echo "round-trip clean"

  # ── Commit + workflow linting (SMD-1808) ────────────────────────────────────
  # Both are required, as every job is, through "Fork Checks passed"
  # (SMD-3168); commit-lint is the one job MAY_SKIP lets skip.
  commit-lint:
    name: Commit messages
    runs-on: ubuntu-24.04
    # Nothing to lint on a plain push; a PR's own commits — or the queued PR's —
    # are the range, and commitlint ignores the merge commit the queue creates.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: commitlint the pushed range against the house grammar
        env:
          EVENT: ${{ github.event_name }}
          PR_FROM: ${{ github.event.pull_request.base.sha }}
          PR_TO: ${{ github.event.pull_request.head.sha }}
          MG_FROM: ${{ github.event.merge_group.base_sha }}
          MG_TO: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then from="$MG_FROM"; to="$MG_TO"; else from="$PR_FROM"; to="$PR_TO"; fi
          echo "Linting $from..$to"
          bunx --bun @commitlint/cli@19.6.1 --config scripts/commitlint.config.ts --from "$from" --to "$to"

  workflow-lint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned) over the workflows, shellcheck on run bodies
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          # Pinned by version and checksum; ubuntu-24.04 ships shellcheck, which
          # actionlint invokes on every run: body. The fetch retries a transient
          # error — one 504 from the release host failed this job on main (run
          # 36868446301, SMD-2472) — and the checksum stays the integrity gate.
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 -o actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
      # The scripts the full-stack jobs run in place of a run: body
      # (.github/ci/, SMD-3051), held to the shellcheck actionlint runs on the
      # bodies they came from.
      - name: shellcheck on .github/ci's scripts
        run: shellcheck .github/ci/*.sh

  # ── The one required check (SMD-3168) ───────────────────────────────────────
  # main's ruleset requires this job alone. Every other job is required through
  # its `needs:`, which check 20 holds to every job in this file, so a job
  # added, renamed, split or run as a matrix needs no ruleset change. It runs
  # `if: always()` because a job whose needs failed is otherwise skipped, and
  # GitHub reads a skipped required check as passing; it fails unless every
  # job succeeded, or was skipped where MAY_SKIP names it — commit-lint, whose
  # own `if:` runs it on pull requests and the merge queue alone. The step is
  # held verbatim by check 20, which runs it against its own cases.
  fork-checks-passed:
    name: Fork Checks passed
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - repo-consistency
      - portable-server
      - db-schema
      - replay-gate
      - db-live
      - data-layer
      - deploy-stack
      - deploy-stack-brains
      - deploy-stack-auth
      - deploy-stack-observability
      - auth-poc
      - compat-shim
      - commit-lint
      - workflow-lint
    steps:
      - name: Every job succeeded, or was skipped where MAY_SKIP allows it
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: commit-lint
        run: |
          # shellcheck disable=SC2016 # jq's variables, not the shell's
          not_passed=$(jq -r --arg may_skip "$MAY_SKIP" '
            ($may_skip | split(" ") | map(select(. != ""))) as $skip
            | to_entries[]
            | select(.value.result != "success" and (.value.result != "skipped" or (.key as $k | any($skip[]; . == $k) | not)))
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$not_passed" ]; then
            printf 'Not every job passed:\n%s\n' "$not_passed" >&2
            exit 1
          fi
          echo "Every job passed: $(jq '[.[] | select(.result == "success")] | length' <<<"$NEEDS") succeeded, $(jq '[.[] | select(.result == "skipped")] | length' <<<"$NEEDS") skipped where MAY_SKIP allows."
