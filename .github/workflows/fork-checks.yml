# Fork-local CI.
#
# Upstream runs no tests at all: 11 test files across ~85k lines of code and no
# workflow invokes any of them. That is how upstream's server/test-stateless.mjs
# came to assert the opposite of production for three months without anyone
# noticing (the Edge Function build and its three mirror suites left this fork
# with SMD-1800; server-portable/ is the server, and its suites import it).
#
# This workflow exists so the fork's patch series cannot rot the same way. It is
# additive — it touches no upstream workflow — so it survives a rebase onto
# upstream/main untouched.
name: Fork Checks

on:
  push:
    branches: [main, "siggymd/**"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Every run: step under bash --noprofile --norc -eo pipefail {0} (GitHub's
# documented `shell: bash`), so a `cmd | grep`/`cmd | jq` whose left side fails
# fails the step instead of being masked. Before this the default was `bash -e`
# with no pipefail (SMD-1808).
defaults:
  run:
    shell: bash

# Every job names its runner image (ubuntu-24.04, not ubuntu-latest, which
# GitHub moves to a new release on its own date), and every `uses:` names a
# full commit SHA with the tag it was in a trailing comment; Dependabot
# (.github/dependabot.yml) moves the pins by PR, and check-fork-consistency
# check 23 refuses a tag or a -latest runner (SMD-2093). Every checkout sets
# persist-credentials: false: no step talks to the remote after it (a job that
# reads history takes it at checkout, fetch-depth: 0), so the token has no
# reason to stay in the workspace.

concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-consistency:
    name: Repo consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The landing check below diffs the event's range — a PR's base and
          # head, or the merge group's — so it needs the history, not one tree.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # What a landing must carry (SMD-1857): a PR — or, in a merge queue, each
      # PR of the group, one first-parent merge commit each — whose change
      # touches db/migrations/, server-portable/, evals/ or jev/ beyond tests and docs
      # ships a changes/smd-NNNN.md fragment. Read from the range the event
      # gives, so it holds on a merge group's result as on a PR's head. GitHub
      # refuses a merge queue on this user-owned repository (SMD-1984), so today
      # the pull_request path is the one that runs; the merge_group path is
      # ready. The migration-number rule (5b) and the rest of
      # check-fork-consistency below run on whichever tree is checked out. A PR
      # into another branch is not a landing yet; it is asked when it reaches
      # main.
      - name: What the landing carries — a fragment for a change to db/migrations/, server-portable/, evals/ or jev/
        if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          EVENT: ${{ github.event_name }}
          PR_FROM: ${{ github.event.pull_request.base.sha }}
          PR_TO: ${{ github.event.pull_request.head.sha }}
          MG_FROM: ${{ github.event.merge_group.base_sha }}
          MG_TO: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then from="$MG_FROM"; to="$MG_TO"; else from="$PR_FROM"; to="$PR_TO"; fi
          bun scripts/check-landing.ts --event "$EVENT" --from "$from" --to "$to"

      # Applies the upstream gate's rules to the WHOLE repo, not just the
      # directories a PR happens to touch. The upstream gate only validates
      # changed dirs, so pre-existing violations never surface there. A Bun
      # script, TypeScript since SMD-1870 — bun is the runtime every other job
      # and every developer here uses, and checks 13, 14, 18, 20 and 23 parse YAML with
      # Bun.YAML.
      - name: Check metadata, links, dependencies, SQL guards, shell hazards, core-function redefinitions, credential compares, fixture redaction, thought writes, the vendored files' Bun-native shape, Supabase-isms in schema SQL, the compose stack's ports and forwards, FORK.md's change files, the type-checked directories' pins, the connector registry, main's ruleset record, destructive statements in SQL files, runtime supabase-js imports, and the workflows' runner and action pins
        run: bun scripts/check-fork-consistency.ts

      # The scripts are type-checked where they run (SMD-1870): scripts/tsconfig.json
      # mirrors server-portable's and scripts/package.json pins the types at the
      # server's versions (check 18 holds the type-checked directories in step).
      # They import ../db/config.mjs and ../db/version.mjs through their .d.mts
      # files and ../server-portable/tools.ts; none of that needs a package
      # installed, so this job installs only the types.
      - name: Install the scripts' pinned packages
        working-directory: scripts
        run: bun install --frozen-lockfile

      - name: Typecheck the scripts
        working-directory: scripts
        run: bunx tsc --noEmit

      # The session capture hook (SMD-1298, SMD-2012, SMD-2035, SMD-2013, SMD-2014, SMD-1978): both transcript parsers, the segmenter, the
      # summary's shape, every secret pattern's probe, the refusal, the opt-in
      # model summary and its fallbacks, the detached hand-off and the MCP post —
      # against synthetic transcripts and fake endpoints on localhost. Bun only,
      # no database, so it runs here.
      - name: Session capture hook
        run: bun recipes/session-capture-hook/test-session-capture.mjs

  portable-server:
    name: Portable server (Bun + Workers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install
        working-directory: server-portable
        run: bun install --frozen-lockfile

      # Imports the real server rather than a mirror of it, so there is no drift
      # guard here and none is needed.
      - name: Test against the real server
        working-directory: server-portable
        run: bun test-server.ts

      # Scoped keys: a read-scoped key must not merely fail to write, it must not
      # see capture_thought at all. Needs no database.
      - name: Scoped access keys
        working-directory: server-portable
        run: bun test-auth.ts

      # Pure logic — the alias table, title truncation, citation URLs. No database
      # and no provider, so it runs in the fast job rather than the Postgres one.
      - name: Thought vocabulary and presentation rules
        working-directory: server-portable
        run: bun test-thoughts.ts

      - name: Typecheck
        working-directory: server-portable
        run: bunx tsc --noEmit

      # db/ and evals/ import this server's modules and are the first callers to
      # break when a shared signature moves, and until SMD-1932 nothing compiled
      # them: SMD-1903 gave getEmbedding a required argument, the compiler fixed
      # every server call site, and db/reembed.ts's provider probe kept the old
      # one — at runtime the gate read `subject.kind` on undefined and the probe
      # blamed the provider. Each directory has a tsconfig.json mirroring this
      # one and pins @types/bun, typescript and @types/node at the server's
      # versions (check 18 holds the type-checked directories in step). Both run
      # in THIS job because their imports of ../server-portable/*.ts resolve
      # through server-portable/node_modules, installed above; each installs its
      # own lockfile for its types (and evals' LanceDB, whose types
      # store-backends.ts imports). No database, no provider.
      - name: Install the workers' pinned packages
        working-directory: db
        run: bun install --frozen-lockfile

      - name: Typecheck the workers, benches and suites
        working-directory: db
        run: bunx tsc --noEmit

      - name: Install the evals' pinned packages
        working-directory: evals
        run: bun install --frozen-lockfile

      - name: Typecheck the evals
        working-directory: evals
        run: bunx tsc --noEmit

      # The typed-decision tier (SMD-2050): its serving process under jev/ and
      # the client in server-portable/jev.ts, which the suite imports — so it
      # runs in THIS job, after server-portable's install. No model: [1]–[8]
      # hold the contract, the Verdict port, the handler, the verified fetch
      # and the client's gate against stubs; [9]-[11], the model itself, its
      # published receipt and JevBench's rows, skip unless JEV_TEST_MODEL_DIR
      # names the pinned files (606 MB, not fetched in CI). onnxruntime-node's postinstall stays untrusted: it fetches only
      # CUDA binaries, and the typecheck needs none.
      - name: Install the decision tier's pinned packages
        working-directory: jev
        run: bun install --frozen-lockfile

      - name: Typecheck the decision tier
        working-directory: jev
        run: bunx tsc --noEmit

      - name: Decision tier — contract, service and client
        working-directory: jev
        run: bun test-jev.ts

      # The thought-kind labels (SMD-1951): the fixture's shape rules, probed
      # with mutants, and the committed fixture held to them. Ids and closed
      # vocabulary only; no database, no model.
      - name: Thought-kind fixture shape
        working-directory: evals
        run: bun eval-thought-kinds.ts --self-check

      # The calibration ledger's arithmetic (Brier, ECE, skill, the bins) and
      # its rules (an unstated or unresolved claim is never scored as 0) held
      # by probes with hand-known answers, and the committed kinds fixture
      # still yields the kind band a scorable set. No database, no model.
      - name: Calibration ledger arithmetic
        working-directory: evals
        run: bun eval-calibration.ts --self-check

      # The write-path eval's rules (SMD-1713): the corpus's shape, the stub
      # provider's three answers, the reader's policy, the parsers, the
      # scorer's partitions, the pairing and the floor comparison — probed
      # with hand-known answers, the ticket's mutant among them. No database,
      # no model; the run itself is the data-layer job's gate.
      - name: Write-path rules
        working-directory: evals
        run: bun eval-write-path.ts --self-check

      # The projection-replay spike's rules (SMD-1998): the snapshot key per
      # projection, the replay rule branch by branch, the five scenarios on a
      # hand-known corpus, the sample, the cost arithmetic, the verdict against
      # the pre-registered bar and the report — probed with hand-known rows. No
      # database, no model; the measurement itself reads the dogfood brain.
      - name: Projection-replay rules
        working-directory: evals
        run: bun eval-projection-replay.ts --self-check

      # The writable-projection spike's rules (SMD-1999): the four options and
      # fourteen criteria, the judgement of probes, the pre-registered verdict
      # (GO only when every contract criterion PASSes and every behaviour
      # holds), the recommendation's tie-break, the differential's
      # normalisation, the replay rule and its one tolerated kind of difference, the
      # recorded matrix and the drift from it, the report — probed with
      # hand-known observations. No database; the prototype runs in the
      # data-layer job.
      - name: Writable-projection rules
        working-directory: evals
        run: bun eval-writable-projection.ts --self-check

      # The entity-gate spike's rules (SMD-1937): the deterministic baselines
      # on the shapes SMD-1935 names and the ones they must keep, AUROC,
      # balanced accuracy, the dev threshold, the temperature and Platt refits
      # recovering a known slope, kappa, the paired bootstrap, the
      # drop-the-mechanism identity, the permuted-score mutant, the framings
      # and the committed grades' shape. No database, no tier; the measurement
      # reads the dogfood brain.
      - name: Entity-gate rules
        working-directory: evals
        run: bun eval-jev-gate.ts --self-check

      # Proves the Cloudflare target still builds under the real Workers bundler.
      # Catches a dependency pulling in a node: builtin Workers cannot provide.
      - name: Cloudflare Workers build
        working-directory: server-portable
        run: bunx wrangler deploy --dry-run --outdir=.cf-out
        env:
          CLOUDFLARE_API_TOKEN: ""
          WRANGLER_SEND_METRICS: "false"

      # Every vendored server is a consumer of this server's auth module — the
      # seven extensions (change 64) and the recipes' and integrations' MCP
      # servers, HTTP APIs, workers and webhook receiver (change 67) — through a
      # _shared/auth.ts beside it, a byte copy. Their test runs in THIS job
      # because main's ruleset requires it: a separate job would not gate a
      # merge. One MCP stack across the tree's three installs — the test fails
      # if server-portable's or the Kubernetes image's pins drift from these.
      - name: Install the vendored servers' pinned test dependencies
        working-directory: extensions
        run: bun install --frozen-lockfile

      # Imported as modules — each server's default export's `fetch`, the shape
      # `bun <file>` serves (SMD-1799) — their packages from this install: a
      # wrong or revoked key is refused, a read-scoped key never sees a tool that
      # writes, is told so by a route that writes and may only dry-run a worker,
      # every copy is byte for byte auth.ts. Then every server on the SQL shim is
      # started under `bun` for real and answered over its port (change 74). No
      # database.
      - name: Scoped access keys reach every vendored server
        working-directory: extensions
        run: bun test-auth.ts

  db-schema:
    name: Schema migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install
        id: install
        working-directory: db
        run: bun install --frozen-lockfile

      # PGlite is real PostgreSQL 17 + pgvector in WASM, so this needs no service
      # container: the migrations are applied and asserted against a real planner.
      # The embedding width is configurable and must hold at more than one value,
      # so the suite runs twice — the default width and 768 — side by side
      # (SMD-2092): each run is one single-threaded process whose PGlite databases
      # live in memory, and neither writes a file, opens a port or spawns
      # anything; a public repository's runner has four cores. Run in series they
      # were the critical path of most runs. Each run writes its own log, stdout
      # and stderr together (a failed assertion goes to stderr); both are waited
      # on, both logs printed — a passing one folded, a failing one open — and the
      # step fails when either run does. Nothing prints until both have exited,
      # so each run has its own time limit: a hung run ends as a failure (exit
      # 124, or 137 when it ignores TERM and is killed 10 s later) with its log
      # printed, whereas without it a hang would run to GitHub's six-hour job
      # limit and print nothing (a cancel still prints nothing). The two summary
      # lines close the step; they read the report line db/test-support.ts prints
      # (`N assertions: …`).
      - name: Apply migrations and assert the schema, at the default width and at 768
        working-directory: db
        run: |
          limit=15m
          timeout --kill-after=10s "$limit" bun test-schema.ts > "$RUNNER_TEMP/schema-default.log" 2>&1 &
          default_pid=$!
          OB1_EMBEDDING_DIM=768 OB1_EMBEDDING_MODEL=nomic-embed-text \
            timeout --kill-after=10s "$limit" bun test-schema.ts > "$RUNNER_TEMP/schema-768.log" 2>&1 &
          narrow_pid=$!
          # `|| rc=$?`, not a bare wait: the step runs under -e, and a bare wait
          # on a failed run would end the step before either log is printed.
          default_rc=0; wait "$default_pid" || default_rc=$?
          narrow_rc=0; wait "$narrow_pid" || narrow_rc=$?
          summaries=""
          for leg in "default:$default_rc" "768:$narrow_rc"; do
            width=${leg%%:*}
            rc=${leg#*:}
            log="$RUNNER_TEMP/schema-$width.log"
            case $rc in
              124) rc="124, over the $limit limit" ;;
              137) rc="137, killed: over the $limit limit with TERM ignored, or out of memory" ;;
            esac
            if [ "$rc" = 0 ]; then
              echo "::group::test-schema.ts at the $width width — passed"
              cat "$log"
              echo "::endgroup::"
            else
              echo "::error title=Schema migrations::test-schema.ts at the $width width failed (exit $rc) — its log follows"
              cat "$log"
            fi
            summary=$(grep -aE '^[0-9]+ assertions: ' "$log" | tail -n 1 || true)
            summaries+="  $width width: ${summary:-no summary line — the run stopped before its report} (exit $rc)"$'\n'
          done
          printf '\ntest-schema.ts\n%s' "$summaries"
          [ "$default_rc" -eq 0 ] && [ "$narrow_rc" -eq 0 ]

      # The board sync's pure rules and write decisions — the rendering the
      # hand captures are recognised by, the plan from a census, which call
      # each state of the brain gets — against a recording store. No network,
      # no database, no provider (SMD-1954). This and the next step run when an
      # earlier step of theirs has failed too (the schema step, or this one for
      # the next), so one broken width does not hide them.
      - name: Board sync rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: db
        run: bun sync-linear.ts --self-check

      # The ingestion contract's adapters and pipeline (SMD-1867): the Linear
      # adapter (markup out of the text, structure into links and mentions),
      # the Markdown adapter (the canonical round-trips byte for byte, the
      # lossy cases enumerated, two inputs refused), the file adapter (a line
      # of items validated in the contract's terms, each malformed kind refused
      # naming its line and field — SMD-2136) and the ingester's pure rules
      # (the corpus path, the items path, the allowlist). No network, no database.
      - name: Ingestion adapters
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: db
        run: bun ingest-linear.ts --self-check && bun ingest-markdown.ts --self-check && bun ingest-items.ts --self-check && bun ingest-records.ts --self-check

  replay-gate:
    name: Retrieval replay gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install
        working-directory: db
        run: bun install --frozen-lockfile

      # SMD-1295. Replays the committed, content-free fixture through the shipped
      # retrieval on PGlite — no service container, no model, no key — and fails
      # when recall@5 drops past the fixture's floor. The live corpus stays out
      # of CI; the fixture is ids and vectors only (evals/build-replay-fixture.ts).
      - name: Replay the query fixture and hold the recall floor
        working-directory: db
        run: bun test-replay.ts

  db-live:
    name: Schema against real Postgres
    runs-on: ubuntu-24.04

    # A service container, not with-postgres.sh — the runner provides the database
    # and Actions handles readiness. The local script exists for developers, who
    # mostly run podman.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: ob1test
          POSTGRES_DB: ob1test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install
        working-directory: db
        run: bun install --frozen-lockfile

      # Covers what PGlite structurally cannot: the migration runner over TCP,
      # driver-level jsonb binding (where the double-encoding bug lived), and
      # whether the planner actually reaches for the HNSW index.
      - name: Run the live suite
        working-directory: db
        run: bun test-live.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # pgvector installed off the connection's search_path — how Supabase and
      # several managed providers ship it. The runner heals its own session and
      # preflight names the persistent fix. The test image installs pgvector into
      # public, so this suite relocates it into a schema to reproduce the shape.
      - name: pgvector off the search path
        working-directory: db
        run: bun test-search-path.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

  data-layer:
    name: SQL data layer against real Postgres
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: ob1test
          POSTGRES_DB: ob1test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install
        working-directory: server-portable
        run: bun install --frozen-lockfile

      - name: Store conformance
        working-directory: server-portable
        run: bun test-store-sql.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # The one that matters: the real MCP server, driven over JSON-RPC, with
      # OB1_STORE unset — the SQL store is the default (change 97) and this is
      # the job that proves it — and no Supabase configuration present at all.
      - name: End-to-end over MCP with no Supabase
        working-directory: server-portable
        run: bun test-e2e-sql.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # The fully local path: both model calls go to a configured endpoint with no
      # credential, and a wrong-width vector is refused rather than stored.
      - name: Local model provider, no OpenRouter
        working-directory: server-portable
        run: bun test-local-provider.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # The write-path gate (SMD-1713): twenty fictional sessions through the
      # real server with the provider scripted, four deliverables written by a
      # fixed reader, one process per arm; fails when the default arm's
      # salient-survival, error-catch or citation-coverage rate falls below
      # the floor evals/baselines.json records, and proves the floor has teeth
      # with a reader that ignores every label. Keyless, as the replay gate
      # is; here rather than its own job because the write path needs the
      # server and this database, and a step in a required job gates a merge
      # without a new name in the ruleset (SMD-1856). No install for evals/
      # or db/: the eval, the workers it spawns (db/extract-entities.ts,
      # db/consolidate.ts) and the db/ modules they share import only bun,
      # node and ../server-portable, whose packages the first step installed;
      # a package added to db/ or evals/ and imported on this path would fail
      # here first. The evals' own packages (LanceDB, Arrow) belong to the
      # store comparison.
      - name: Write-path gate
        working-directory: evals
        run: bun eval-write-path.ts --gate
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # The projection-replay spike's SQL (SMD-1998): the schema reset and
      # seeded with one row per branch of the replay rule, the stale-graph
      # rule and the pool rule — a NULL label, no vector, no fingerprint, a
      # key left stale by a raw update, another model's label, three graph
      # thoughts whose text moved after extraction with the pool queued,
      # failed and succeeded before the move, two whose graph is fresh — then
      # read back through the same queries the live measurement runs, and
      # held to the contract. The live brain cannot show these branches:
      # every row there reuses. No provider. The check DROPS the schema and
      # refuses a database holding thoughts unless told; this one holds the
      # write-path gate's rows, and is a throwaway.
      - name: Projection-replay fixture
        working-directory: evals
        run: bun eval-projection-replay.ts --fixture-check
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test
          OB1_FIXTURE_RESET: "1"

      # The writable-projection spike's prototype (SMD-1999): the schema reset
      # to 053 four times — as it stands, with option 2's functions (append
      # the event, project the row), with a view named thoughts over a renamed
      # table and 053's functions, with the view and option 2's functions —
      # and the same scripted writes run against each: the vendored capture as
      # readwise sends it, the 2- and 4-argument forms, the server's and the
      # integrations' update_thought calls, delete_thought plain and refused,
      # a raw INSERT, ingest-records' statement, the community DDL verbatim,
      # the three concurrency behaviours, the trigger counts, read-your-writes
      # with the drop-the-projector control, the replay of the whole log.
      # --check holds the run to the matrix the spike recorded, so a Postgres
      # or prototype change that moves a cell is named. No provider (vectors at
      # width 8). It DROPS the schema and refuses a database holding thoughts
      # unless told; this one is a throwaway. Runs after the fixture above,
      # which leaves its rows; every suite after this resets for itself.
      - name: Writable-projection prototype
        working-directory: evals
        run: bun eval-writable-projection.ts --check
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test
          OB1_FIXTURE_RESET: "1"

      # The egress gate (SMD-1903): under the default, deny, a thought's text
      # never reaches an endpoint not declared local — zero requests at the
      # stub, the capture lands without a vector and says why, a search is
      # refused by name — and the second opinion can only refuse.
      - name: Egress gate, deny by default
        working-directory: server-portable
        run: bun test-egress.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # OB1_EMBEDDING_DIMENSIONS: the opt-in that makes a model wider than
      # pgvector's HNSW ceiling usable at all. Separate process because the server
      # snapshots the environment at boot, so the flag cannot be flipped mid-run.
      # update_thought / delete_thought, including the two defects the extension
      # they were ported from has: a fingerprint left describing old text, and a
      # concurrency check that races.
      - name: Update and delete tools
        working-directory: server-portable
        run: bun test-update-delete.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # The audit trail: attribution, append-only enforcement, and the property
      # fire-and-forget cannot offer — no audit row for a rolled-back mutation.
      - name: Audit trail
        working-directory: server-portable
        run: bun test-audit.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # Migrations applied INCREMENTALLY, onto a database that already holds
      # data — the one situation every other suite avoids by resetting first,
      # and the only one a real deployment is ever in.
      - name: Incremental upgrade
        working-directory: db
        run: bun test-upgrade.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # Stable agent identity: that a rename does not orphan history (which
      # binding to the key NAME could not survive), and that a digest revoked in
      # the database is refused even though MCP_ACCESS_KEYS still lists it.
      - name: Agent identity
        working-directory: server-portable
        run: bun test-agents.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # The PostgREST store — kept for Cloudflare Workers (change 97); every
      # other suite runs the SQL store. Uses compat/supabase-sql as the fixture: real SQL against
      # real Postgres, so a wrong RPC argument shape fails here as it would live.
      - name: PostgREST store argument shapes
        working-directory: server-portable
        run: bun test-store-postgrest.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # The assertion that a long capture is findable by its FINAL sentence — the
      # one that failed before migration 007. The stub provider refuses over-batch
      # input rather than truncating, so dropping chunking fails loudly here.
      - name: Chunking keeps long captures searchable
        working-directory: server-portable
        run: bun test-chunking.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # OB1_CHUNK_CONTEXT, which is off by default and measured off. Its own
      # suite because the server snapshots its environment, so the flag cannot
      # be flipped inside the process test-chunking.ts already owns. The stub's
      # blurb carries a word found in no document, so the test can prove the
      # blurb reached the VECTOR rather than only the column.
      - name: Chunk context reaches the embedding, or degrades visibly
        working-directory: server-portable
        run: bun test-chunk-context.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      - name: Embedding truncation via the dimensions parameter
        working-directory: server-portable
        run: bun test-embedding-dimensions.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # The deploy gate. Without it a misconfigured server starts, answers the MCP
      # handshake, passes every HTTP liveness probe, and fails only when a user
      # captures their first thought.
      - name: Preflight catches bad configurations
        working-directory: server-portable
        run: bun test-preflight.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # Every vendored writer of a thought's content or vector goes through
      # update_thought or the 3-argument upsert_thought (change 69, SMD-1228):
      # each is driven as deployed against this database — the fork's schema
      # plus the three sidecars and the log table the writers assume, dropped again at the end —
      # and the row it leaves is compared with the row update_thought leaves
      # for the same edit. Late in the job because it applies those sidecars.
      - name: Install the vendored servers' pinned test dependencies
        working-directory: extensions
        run: bun install --frozen-lockfile

      # TZ: the enhanced-mcp block holds that a zone-less date bound is read as
      # UTC, never the process's zone — an arm that proves nothing on a UTC
      # runner, so the suite runs west of UTC here (SMD-1986).
      - name: Vendored writers leave what update_thought leaves
        working-directory: extensions
        run: bun test-writes.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test
          TZ: America/Chicago

      # Every tool of the eight servers on the SQL shim, called through
      # tools/call against the extensions' own schema.sql files (applied as
      # they are — no auth.* stub and no Supabase role, since SMD-1810, which
      # also stopped test-writes.ts above creating the three roles on this
      # shared database — and dropped again at the end) — each read's
      # filters, each write's row, the embedded relation, the trigger's effect,
      # the message a failure carries (change 77, SMD-1588). A shim gap fails a
      # named assertion here rather than a user's first call; a tool added to a
      # server fails the drift guard until it is driven. Last in the job because
      # it applies those schemas.
      - name: Every extension tool answers on the SQL shim
        working-directory: extensions
        run: bun test-tools.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

  deploy-stack:
    name: Full stack, no Supabase
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For the three dashboards at the end of this job (SMD-1801): Bun installs
      # and builds them, and drives the SvelteKit one against the stack.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # The other container this repository ships (SMD-1800): kubernetes-deployment's
      # image, Bun's base with its pinned install, built from integrations/ so the
      # shared auth module is in the context. Built, not run — its database is its
      # own (k8s/init.sql) and extensions/test-auth.ts starts the server itself.
      # First, before the compose stack: a bring-up or smoke failure below must not
      # hide whether this image builds.
      - name: The Kubernetes image builds
        run: docker build -f integrations/kubernetes-deployment/Dockerfile -t ob1-k8s-mcp:ci integrations

      # The Phase 4 exit test, literally: bring up Postgres, apply the schema and
      # serve MCP, with no Supabase CLI installed and no supabase.com account.
      - name: Bring up the compose stack
        working-directory: deploy
        run: |
          # Mint a real scoped key: the config holds only the hash, so the raw
          # key has to be captured here for smoke.sh to authenticate with.
          KEY=$(openssl rand -hex 32)
          HASH=$(printf '%s' "$KEY" | shasum -a 256 | cut -d' ' -f1)
          echo "OB1_SMOKE_KEY=$KEY" >> "$GITHUB_ENV"
          # And a read-scoped key beside it, for the dashboard smoke at the end
          # of this job (SMD-1801): a read key must get a read-only dashboard.
          READ_KEY=$(openssl rand -hex 32)
          READ_HASH=$(printf '%s' "$READ_KEY" | shasum -a 256 | cut -d' ' -f1)
          echo "OB1_SMOKE_READ_KEY=$READ_KEY" >> "$GITHUB_ENV"
          # And a capture-only key (SMD-1298), which the dashboard must refuse at sign-in.
          CAPTURE_KEY=$(openssl rand -hex 32)
          CAPTURE_HASH=$(printf '%s' "$CAPTURE_KEY" | shasum -a 256 | cut -d' ' -f1)
          echo "OB1_SMOKE_CAPTURE_KEY=$CAPTURE_KEY" >> "$GITHUB_ENV"
          # No OPENROUTER_API_KEY: the provider is a local endpoint, which
          # needs no credential (preflight decides). Preflight dials it
          # (GET /models, SMD-1875), and the canary step below embeds through
          # it (POST /v1/embeddings); smoke.sh captures nothing and preflight
          # runs without --deep, so a listener on the runner answering those
          # two is the whole provider: the runner is the container's
          # host.docker.internal (compose.yaml's extra_hosts host-gateway), and
          # the listener binds every interface because host-gateway is the
          # bridge address, not loopback. The address is neither the code's
          # default nor the compose fallback, so the log line below can only
          # come from this file (SMD-1843); the query log likewise.
          # OB1_LLM_LOCAL declares the endpoint to the egress gate (SMD-1903),
          # which reads the flag and never the address; the log line below
          # holds the forward. The embeddings (SMD-2038) are a bag of words
          # hashed into dimensions 1–1023 of the stack's 1024, the model's
          # query instruction left off as the model reads it, so a text is
          # near itself and far from another; the probe thoughts are seeded
          # with the stub's own vectors for their text. While
          # /tmp/provider-stub-wrong exists it is a provider serving another
          # model: each vector turned mostly onto dimension 0, which no word
          # reaches, so a text still ranks its own thought first but at about
          # 30%, under the canary smoke's 50% floor, on every run.
          nohup python3 - <<'PY' > /tmp/provider-stub.log 2>&1 &
          import json, math, os, re, zlib
          from http.server import BaseHTTPRequestHandler, HTTPServer
          def embed(text):
              text = (text or "").split("\nQuery: ", 1)[-1]
              v = [0.0] * 1024
              for w in re.findall(r"[a-z]+", text.lower()):
                  v[1 + zlib.crc32(w.encode()) % 1023] += 1.0
              n = math.sqrt(sum(x * x for x in v))
              return [x / n for x in v] if n else [0.0, 1.0] + [0.0] * 1022
          def wrong(text):
              v = [0.3 * x for x in embed(text)]
              v[0] = 0.95
              n = math.sqrt(sum(x * x for x in v))
              return [x / n for x in v]
          class H(BaseHTTPRequestHandler):
              def reply(self, body):
                  self.send_response(200); self.send_header("Content-Type", "application/json"); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
              def do_GET(self):
                  self.reply(b'{"object":"list","data":[]}')
              def do_POST(self):
                  req = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
                  if not self.path.endswith("/embeddings"):
                      self.send_error(404); return
                  inputs = req.get("input"); inputs = inputs if isinstance(inputs, list) else [inputs]
                  f = wrong if os.path.exists("/tmp/provider-stub-wrong") else embed
                  data = [{"object": "embedding", "index": i, "embedding": f(t)} for i, t in enumerate(inputs)]
                  self.reply(json.dumps({"object": "list", "data": data, "model": req.get("model")}).encode())
          HTTPServer(("0.0.0.0", 11434), H).serve_forever()
          PY
          # OB1_GIT_SHA reaches the image as compose's build arg (SMD-2041),
          # and the smoke step asserts the health body reports it. The quoted
          # password and the commented OB1_EMBEDDING_DIM are shapes an operator
          # writes; compose reads them as the bare values, and deploy/tier.sh
          # must too (SMD-2036): a literal read hands pg_dump a quoted password
          # and migrate.ts a width of "1024   # …", and the tier step fails.
          cat > .env <<EOF
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          OB1_EMBEDDING_DIM=1024   # the stack's default, written out as an operator would
          MCP_ACCESS_KEYS=ci:write:$HASH,ci-read:read:$READ_HASH,ci-capture:capture:$CAPTURE_HASH
          OB1_LLM_BASE_URL=http://host.docker.internal:11434/v1
          OB1_LLM_LOCAL=1
          OB1_QUERY_LOG=on
          SERVER_PORT=8010
          OB1_GIT_SHA=$GITHUB_SHA
          EOF
          docker compose -f compose.yaml up -d --build --wait --wait-timeout 240

      # SMD-1843. The knobs the first dogfood stack needed a second -f file for
      # reach the container: preflight's own report in the server log names the
      # provider URL .env set and the query log ON, and the container passed
      # preflight with no credential set. check-fork-consistency.ts 14 holds
      # the file to forwarding every knob the server declares; this holds the
      # running container to what .env said. The first line reads the URL and
      # preflight's "local" clause and nothing between them: SMD-1902 put
      # "— embeddings and chat" there while this step was in review, and the
      # exact form failed the merged tree (caught: CI, PR #93).
      - name: The server sees what deploy/.env says
        working-directory: deploy
        run: |
          LOG="$(docker compose -f compose.yaml logs --no-color server)"
          grep -E 'model provider +http://host\.docker\.internal:11434/v1\b.*\(local — no credential needed\)' <<<"$LOG"
          grep -E '✓ +provider endpoint +http://host\.docker\.internal:11434/v1 answers — HTTP 200 to GET /models' <<<"$LOG"
          grep -E 'embeddings egress +http://host\.docker\.internal:11434/v1 is declared local \(OB1_LLM_LOCAL\)' <<<"$LOG"
          grep -F 'ON (OB1_QUERY_LOG=on) here' <<<"$LOG"
          grep -F 'preflight OK' <<<"$LOG"

      # SMD-1875, the ticket's first Verify item on every PR: the compose
      # fallback (the `ollama` service) with no profile is a name that does not
      # resolve, and the container must refuse to start on it — where it used
      # to say `preflight OK` and fail the first capture on it (getaddrinfo
      # ENOTFOUND ollama). The
      # built image, the running database, one environment line changed, and
      # preflight alone (the image's entrypoint is `sh -c "bun preflight.ts &&
      # exec bun index.ts"`, so the command is replaced through --entrypoint).
      # Exit 1, the `provider endpoint` row failed, the remedy naming the
      # profile; and the same run with the reachable address (the runner's
      # listener from the first step, still up) passes, so the step proves
      # the probe and not a broken container.
      - name: A local endpoint that answers nothing refuses to start
        working-directory: deploy
        run: |
          set +e
          docker compose -f compose.yaml run --rm --no-deps -T --entrypoint bun -e OB1_LLM_BASE_URL=http://ollama:11434/v1 server preflight.ts > /tmp/negative.out 2>&1
          CODE=$?
          set -e
          # The report is printed whole when a line is missing, so a runner
          # whose resolver answers differently is read, not guessed at (the
          # first run read the unknown name as the timeout kind; caught: CI, PR #138).
          hold() { grep -E "$1" /tmp/negative.out || { echo "--- expected /$1/ in preflight's report: ---" >&2; cat /tmp/negative.out >&2; exit 1; }; }
          hold '✗ +provider endpoint +nothing answers at http://ollama:11434/v1 — the name does not resolve'
          hold 'is the local-models profile.*start the stack with --profile local-models'
          hold 'preflight FAILED'
          [ "$CODE" -eq 1 ] || { echo "preflight exited $CODE, expected 1" >&2; cat /tmp/negative.out >&2; exit 1; }
          docker compose -f compose.yaml run --rm --no-deps -T --entrypoint bun server preflight.ts | grep -F 'preflight OK'

      # SMD-1844. An address-less mapping binds 0.0.0.0; this stack holds a brain
      # behind one password and one key over plain HTTP. Read compose's own
      # rendering rather than the file: the base file publishes exactly one port
      # (the server) and, with the host-ports overlay and the local-models
      # profile, three — every one on loopback; and SERVER_BIND opens the server
      # by name, the other two still on loopback (a sorted multiset passed with
      # Ollama opened instead — the second review pass); and no service sets
      # network_mode, since `host` reaches the host's interfaces with no port
      # published (the third pass). check-fork-consistency.ts 13 holds the
      # files to the same rule; this holds what compose makes of them.
      - name: Every published port binds loopback
        working-directory: deploy
        run: |
          docker compose -f compose.yaml --profile local-models config --format json \
            | jq -e '([.services[].ports[]?] | length == 1 and all(.host_ip == "127.0.0.1") and (.[0].published == "8010")) and ([.services[] | select(.network_mode != null)] | length == 0)'
          docker compose -f compose.yaml -f compose.host-ports.yaml --profile local-models config --format json \
            | jq -e '([.services[].ports[]?] | length == 3 and all(.host_ip == "127.0.0.1")) and ([.services[] | select(.network_mode != null)] | length == 0)'
          SERVER_BIND=0.0.0.0 docker compose -f compose.yaml -f compose.host-ports.yaml --profile local-models config --format json \
            | jq -e '([.services[].ports[]?] | length == 3) and .services.server.ports[0].host_ip == "0.0.0.0" and ([.services.postgres.ports[].host_ip, .services.ollama.ports[].host_ip] == ["127.0.0.1", "127.0.0.1"])'

      # OB1_SMOKE_COMMIT: check 10 asserts the keyed /health body names the
      # commit the build arg above baked in, beside the version it asserts.
      - name: Smoke-test it over MCP
        working-directory: deploy
        run: ./smoke.sh
        env:
          OB1_SMOKE_COMMIT: ${{ github.sha }}

      # SMD-2036. db/tier.ts --refresh runs under Bun and shells to pg_dump /
      # pg_restore, which no image in the stack carries together, so the
      # snapshot half of the tier pipeline ran nowhere in CI (db-live's runner
      # has a pg14 client, which refuses a pg16 server; test-live [20] drives the
      # replay engine, the guards, and a refresh whose stand-in pg_restore
      # fails, never a real one). deploy/tier.sh builds db/tier.Dockerfile
      # and runs this checkout's tier.ts on the stack's network. The brain is
      # given something to carry first: smoke.sh captures nothing, so one thought
      # with a vector goes in through upsert_thought, and one keyword search that
      # finds it goes through the server, which logs it. Then the refresh into a
      # second database on the server, read back one test per line (a test inside
      # an && list does not trip set -e: a schema-only copy passed that way in
      # review), the tier stamp, a --replay that replays that search, a --diff
      # that finds it unmoved and one over the empty window after the refresh
      # that exits 3, and a retry over a copy left stamped stable, as a
      # refresh that died after its restore leaves it. Then the two guards the
      # wrapper runs under, since from its container every database is remote:
      # the brain under its service name and its container name is one
      # database, and a refresh the wrong way round lands on a brain with no
      # tier stamp. Both are refused, and the brain still holds its thought.
      - name: The tier refresh runs from deploy/tier.sh
        working-directory: deploy
        run: |
          q() { docker compose -f compose.yaml exec -T postgres psql -U postgres -d "$1" -tAc "$2"; }
          vec() { curl -s http://127.0.0.1:11434/v1/embeddings -d "{\"input\": \"$1\"}" | python3 -c 'import json, sys; print(json.dumps(json.load(sys.stdin)["data"][0]["embedding"], separators=(",", ":")))'; }
          q openbrain "SELECT upsert_thought('tier refresh probe: the quokka ledger', '{\"metadata\": {\"source\": \"ci-tier\"}}'::jsonb, '$(vec 'tier refresh probe: the quokka ledger')'::vector)"
          curl -s --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "x-brain-key: $OB1_SMOKE_KEY" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_thoughts_keyword","arguments":{"query":"quokka"}}}' \
            http://127.0.0.1:8010/ | grep -F 'quokka ledger'
          docker compose -f compose.yaml exec -T postgres createdb -U postgres ob1_tier_ci
          ./tier.sh --refresh --from postgres --to postgres/ob1_tier_ci --tier working
          COUNTS="SELECT (SELECT count(*) FROM schema_migrations) || '/' || (SELECT count(*) FROM thoughts) || '/' || (SELECT count(embedding) FROM thoughts) || '/' || (SELECT count(*) FROM query_log)"
          STABLE="$(q openbrain "$COUNTS")"
          COPY="$(q ob1_tier_ci "$COUNTS")"
          echo "migrations/thoughts/vectors/query_log: stable $STABLE, refreshed $COPY"
          [ "$STABLE" = "$COPY" ] || { echo "the refreshed copy differs from stable" >&2; exit 1; }
          [ "$(q ob1_tier_ci "SELECT count(embedding) FROM thoughts WHERE content LIKE '%quokka ledger%'")" = 1 ] || { echo "the probe thought or its vector did not arrive" >&2; exit 1; }
          [ "$(q ob1_tier_ci "SELECT value FROM ob1_config WHERE key = 'tier'")" = working ] || { echo "the copy is not stamped tier=working" >&2; exit 1; }
          # SMD-2037: the dump carries no database-level settings; the refresh
          # copies them, so the copy walks HNSW under 014's bounds as stable does.
          SETTINGS="SELECT coalesce(string_agg(c, ',' ORDER BY c), '') FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase, unnest(s.setconfig) c WHERE d.datname = current_database() AND s.setrole = 0 AND c NOT LIKE 'ob1.refresh_target=%'"
          STABLE_SET="$(q openbrain "$SETTINGS")"
          COPY_SET="$(q ob1_tier_ci "$SETTINGS")"
          echo "database settings: stable $STABLE_SET, refreshed $COPY_SET"
          grep -q 'hnsw.max_scan_tuples=' <<<"$STABLE_SET" || { echo "stable has no HNSW bound to copy (014 seeds one)" >&2; exit 1; }
          [ "$STABLE_SET" = "$COPY_SET" ] || { echo "the refreshed copy's database settings differ from stable's" >&2; exit 1; }
          ./tier.sh --replay --since 1970-01-01T00:00:00Z --from postgres --to postgres/ob1_tier_ci | tee /tmp/tier-replay.out
          grep -E '^replayed [1-9][0-9]* of ' /tmp/tier-replay.out
          ./tier.sh --diff --since 1970-01-01T00:00:00Z --from postgres --to postgres/ob1_tier_ci | tee /tmp/tier-diff.out
          grep -F 'what moved: nothing' /tmp/tier-diff.out
          # SMD-2182: with no --since the window starts at the copy's refresh,
          # and stable has logged nothing since, so a --diff compares nothing:
          # exit 3 through the wrapper, not the pass it used to be.
          empty_rc=0
          ./tier.sh --diff --from postgres --to postgres/ob1_tier_ci > /tmp/tier-empty.out || empty_rc=$?
          cat /tmp/tier-empty.out
          [ "$empty_rc" = 3 ] || { echo "a --diff that compared nothing exited $empty_rc, not 3" >&2; exit 1; }
          grep -F 'nothing to compare: stable logged no searches' /tmp/tier-empty.out
          # A refresh that dies after its restore leaves the source's ob1_config
          # behind — the brain's, here no tier; the dogfood's, tier=stable. The
          # mark the refresh set on the database before its reset lets the
          # retry through.
          [ "$(q ob1_tier_ci "SELECT count(*) FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase, unnest(s.setconfig) c WHERE d.datname = current_database() AND s.setrole = 0 AND c = 'ob1.refresh_target=working'")" = 1 ] || { echo "the refresh did not mark its target" >&2; exit 1; }
          q ob1_tier_ci "UPDATE ob1_config SET value = 'stable' WHERE key = 'tier'"
          ./tier.sh --refresh --from postgres --to postgres/ob1_tier_ci --tier working
          [ "$(q ob1_tier_ci "SELECT value FROM ob1_config WHERE key = 'tier'")" = working ] || { echo "the retry did not restamp the copy" >&2; exit 1; }
          refused() {
            if ./tier.sh --refresh --from "$1" --to "$2" --tier working 2> /tmp/tier-refused.err; then
              echo "tier.sh refreshed $1 into $2" >&2; exit 1
            fi
            grep -F "$3" /tmp/tier-refused.err || { cat /tmp/tier-refused.err >&2; exit 1; }
          }
          refused postgres open-brain-postgres-1 'name the same database'
          refused postgres/ob1_tier_ci postgres 'holds thoughts and no tier stamp'
          [ "$(q openbrain "SELECT count(*) FROM thoughts WHERE content LIKE '%quokka ledger%'")" = 1 ] || { echo "the brain lost its thought" >&2; exit 1; }

      # SMD-2038. deploy/canary.sh stands a canary beside this stack and takes
      # it down again; this step is its refusals, each with exit 2 and nothing
      # started, stamped or registered: a port a container holds, one a host
      # process listens on, a stable stamped or marked as a copy, a provider
      # only stable's network has, and another connector under the name. A
      # stand-in `claude` on PATH answers `mcp get` (FAKE_URL at FAKE_SCOPE,
      # user by default) and logs every other call, the key cut; the next
      # step uses it too.
      - name: The canary's refusals, from deploy/canary.sh
        working-directory: deploy
        run: |
          q() { docker compose -f compose.yaml exec -T postgres psql -U postgres -d openbrain -tAc "$1"; }
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/claude <<'SH'
          #!/bin/sh
          if [ "$1 $2" = "mcp get" ]; then
            [ -n "$FAKE_URL" ] || exit 1
            printf '%s:\n  Scope: %s\n  Status: connected\n  Type: http\n  URL: %s\n' "$3" "${FAKE_SCOPE:-User config (available in all your projects)}" "$FAKE_URL"
            exit 0
          fi
          echo "$*" | sed 's/x-brain-key: [^ ]*/x-brain-key: <key>/' >> /tmp/fake-claude.log
          SH
          chmod +x /tmp/fake-bin/claude
          export PATH="/tmp/fake-bin:$PATH" FAKE_URL=""
          : > /tmp/fake-claude.log
          refused() {
            rc=0; ./canary.sh "${@:2}" > /tmp/canary-refused.out 2>&1 || rc=$?
            [ "$rc" = 2 ] || { cat /tmp/canary-refused.out >&2; echo "canary.sh ${*:2}: expected a refusal (exit 2), got $rc" >&2; exit 1; }
            grep -F "$1" /tmp/canary-refused.out || { cat /tmp/canary-refused.out >&2; exit 1; }
          }
          # The image the stack already pulled holds the port as well as any.
          docker run -d --name ob1-port-squat -p 127.0.0.1:8011:5432 -e POSTGRES_PASSWORD=squat pgvector/pgvector:0.8.6-pg16
          refused 'port 8011 is published by ob1-port-squat' up
          docker rm -f ob1-port-squat
          python3 -m http.server 8011 --bind 127.0.0.1 > /dev/null 2>&1 &
          SQUAT=$!
          for _ in $(seq 1 40); do (exec 3<>/dev/tcp/127.0.0.1/8011) 2>/dev/null && break; sleep 0.25; done
          refused 'already listens on 127.0.0.1:8011' up
          kill "$SQUAT"
          q "INSERT INTO ob1_config (key, value) VALUES ('tier', 'working')"
          refused "is stamped tier 'working'" up
          q "DELETE FROM ob1_config WHERE key = 'tier'"
          q "ALTER DATABASE openbrain SET ob1.refresh_target = 'canary'"
          refused "carries the refresh mark 'canary'" up
          q "ALTER DATABASE openbrain RESET ob1.refresh_target"
          OB1_LLM_BASE_URL=http://ollama:11434/v1 refused "a bare name" up
          FAKE_URL=http://127.0.0.1:9999/ refused "is not this canary's at user scope" up --connect
          [ -z "$(docker ps -aq --filter label=com.docker.compose.project=open-brain-canary)" ] || { echo "a refusal started canary containers" >&2; exit 1; }
          [ -z "$(q "SELECT value FROM ob1_config WHERE key = 'tier'")" ] || { echo "a refusal stamped stable" >&2; exit 1; }
          [ ! -s /tmp/fake-claude.log ] || { cat /tmp/fake-claude.log >&2; echo "a refusal touched the connector" >&2; exit 1; }

      # SMD-2038. The canary's life beside this stack, in two `up`s. canary.sh
      # runs compose.yaml again as the project open-brain-canary: its
      # Postgres, a refresh from this stack's through tier.sh on both
      # networks, its server on 8011 built from this checkout, then the smoke.
      # The first `up --connect` runs over a stable carrying the protective
      # mark `stable` (not a refresh's) and under SERVER_BIND=0.0.0.0; it
      # stamps stable, stays on loopback, registers the connector, and its
      # vector probe must pass on the thought whose text holds literals (SMD
      # key, path), searched for without them. The second `up` runs with the
      # stub serving another model: the thought put on stable just before it
      # reaches the canary, and the smoke fails on the 50% floor. Then
      # teardown: `down --volumes` refused on a canary stamped working; an
      # empty canary deleted; with no volume, nothing to delete and a
      # local-scope connector left alone; a volume by the canary's name that
      # compose did not make, holding a table, refused with nothing left
      # running; a last `down` removing its own connector. The stack is the
      # one it was: the same Postgres container, its thoughts, its server.
      - name: A canary stands beside the stack from deploy/canary.sh
        working-directory: deploy
        run: |
          q() { docker compose -f compose.yaml exec -T postgres psql -U postgres -d openbrain -tAc "$1"; }
          cq() { docker exec "$(docker compose -p open-brain-canary -f compose.yaml ps -q postgres)" psql -U postgres -d openbrain -tAc "$1"; }
          canary_left() { docker ps -aq --filter label=com.docker.compose.project=open-brain-canary; }
          vec() { curl -s http://127.0.0.1:11434/v1/embeddings -d "{\"input\": \"$1\"}" | python3 -c 'import json, sys; print(json.dumps(json.load(sys.stdin)["data"][0]["embedding"], separators=(",", ":")))'; }
          seed() { q "SELECT upsert_thought('$1', '{\"metadata\": {\"source\": \"ci-tier\"}}'::jsonb, '$(vec "$1")'::vector)" > /dev/null; q "SELECT id FROM thoughts WHERE content = '$1'"; }
          export PATH="/tmp/fake-bin:$PATH" FAKE_URL=""
          : > /tmp/fake-claude.log
          refused() {
            rc=0; ./canary.sh "${@:2}" > /tmp/canary-refused.out 2>&1 || rc=$?
            [ "$rc" = 2 ] || { cat /tmp/canary-refused.out >&2; echo "canary.sh ${*:2}: expected a refusal (exit 2), got $rc" >&2; exit 1; }
            grep -F "$1" /tmp/canary-refused.out || { cat /tmp/canary-refused.out >&2; exit 1; }
          }
          BEFORE="$(docker compose -f compose.yaml ps -q postgres)"
          LITERAL_ID="$(seed 'canary literal probe SMD-4242 in deploy/probe_file.ts: the wombat register of burrows')"
          q "ALTER DATABASE openbrain SET ob1.refresh_target = 'stable'"
          SERVER_BIND=0.0.0.0 ./canary.sh up --connect | tee /tmp/canary-up.out
          q "ALTER DATABASE openbrain RESET ob1.refresh_target"
          grep -F 'stamped open-brain-postgres-1 tier=stable' /tmp/canary-up.out
          grep -F "returns it first: $LITERAL_ID at" /tmp/canary-up.out
          grep -F 'mcp add --transport http --scope user open-brain-canary http://127.0.0.1:8011/' /tmp/fake-claude.log
          [ "$(docker compose -p open-brain-canary -f compose.yaml port server 8000)" = 127.0.0.1:8011 ] || { echo "the canary is not on loopback only" >&2; exit 1; }
          [ "$(q "SELECT value FROM ob1_config WHERE key = 'tier'")" = stable ] || { echo "stable is not stamped tier=stable" >&2; exit 1; }
          [ "$(cq "SELECT count(*) FROM thoughts WHERE content LIKE '%quokka ledger%'")" = 1 ] || { echo "the canary did not get the tier step's thought" >&2; exit 1; }
          seed 'canary re-sync probe: the numbat almanac' > /dev/null
          touch /tmp/provider-stub-wrong
          rc=0; ./canary.sh up > /tmp/canary-wrong.out 2>&1 || rc=$?
          rm -f /tmp/provider-stub-wrong
          [ "$rc" = 1 ] || { cat /tmp/canary-wrong.out >&2; echo "up passed its smoke under a provider serving another model (exit $rc)" >&2; exit 1; }
          grep -F 'returned none of' /tmp/canary-wrong.out
          grep -F 'canary server stopped for the refresh' /tmp/canary-wrong.out
          [ "$(cq "SELECT count(*) FROM thoughts WHERE content LIKE '%numbat almanac%'")" = 1 ] || { echo "the second up did not bring stable's new thought" >&2; exit 1; }
          cq "UPDATE ob1_config SET value = 'working' WHERE key = 'tier'"
          cq "ALTER DATABASE openbrain RESET ob1.refresh_target"
          refused 'refusing to delete its volume' down --volumes
          [ -n "$(canary_left)" ] || { echo "the refused down took the canary down" >&2; exit 1; }
          cq "UPDATE ob1_config SET value = 'canary' WHERE key = 'tier'"
          FAKE_URL=http://127.0.0.1:9999/ ./canary.sh down --volumes | tee /tmp/canary-down.out
          grep -F 'left as it is' /tmp/canary-down.out
          ! grep -F 'mcp remove' /tmp/fake-claude.log || { echo "down removed another connector" >&2; exit 1; }
          docker compose -p open-brain-canary -f compose.yaml up -d --wait postgres
          ./canary.sh down --volumes | tee /tmp/canary-down-empty.out
          grep -F 'canary down, its database deleted' /tmp/canary-down-empty.out
          FAKE_SCOPE="Local config (private to you in this project)" FAKE_URL=http://127.0.0.1:8011/ ./canary.sh down --volumes | tee /tmp/canary-down2.out
          grep -F 'nothing to delete' /tmp/canary-down2.out
          grep -F 'is in local scope, not user — left as it is' /tmp/canary-down2.out
          ! grep -F 'mcp remove' /tmp/fake-claude.log || { echo "down removed a local-scope connector" >&2; exit 1; }
          docker volume create open-brain-canary_pgdata
          docker run -d --name ob1-volume-squat -e POSTGRES_PASSWORD=squat -e POSTGRES_DB=openbrain -v open-brain-canary_pgdata:/var/lib/postgresql/data pgvector/pgvector:0.8.6-pg16
          for _ in $(seq 1 60); do docker exec -e PGPASSWORD=squat ob1-volume-squat psql -h 127.0.0.1 -U postgres -d openbrain -tAc 'SELECT 1' > /dev/null 2>&1 && break; sleep 1; done
          docker exec -e PGPASSWORD=squat ob1-volume-squat psql -h 127.0.0.1 -U postgres -d openbrain -c 'CREATE TABLE precious (id int)' || { echo "the volume squat's Postgres never came up" >&2; exit 1; }
          docker rm -f ob1-volume-squat
          refused 'refusing to delete its volume' down --volumes
          [ -z "$(canary_left)" ] || { echo "the refused down left canary containers" >&2; exit 1; }
          docker volume inspect open-brain-canary_pgdata > /dev/null
          docker volume rm open-brain-canary_pgdata
          FAKE_URL=http://127.0.0.1:8011/ ./canary.sh down
          grep -F 'mcp remove --scope user open-brain-canary' /tmp/fake-claude.log
          [ -z "$(canary_left)" ] || { echo "canary containers remain" >&2; exit 1; }
          [ -z "$(docker volume ls -q --filter label=com.docker.compose.project=open-brain-canary)" ] || { echo "the canary's volume remains" >&2; exit 1; }
          [ "$(docker compose -f compose.yaml ps -q postgres)" = "$BEFORE" ] || { echo "stable's Postgres container changed" >&2; exit 1; }
          [ "$(q "SELECT count(*) FROM thoughts WHERE content LIKE '%quokka ledger%' OR content LIKE '%numbat almanac%' OR content LIKE '%wombat register%'")" = 3 ] || { echo "the brain lost a thought" >&2; exit 1; }
          [ "$(curl -s --max-time 5 http://127.0.0.1:8010/health)" = ok ] || { echo "stable's server stopped answering" >&2; exit 1; }

      - name: Confirm no Supabase CLI anywhere in the stack
        working-directory: deploy
        run: |
          if docker compose -f compose.yaml exec -T server sh -c 'command -v supabase' 2>/dev/null; then
            echo "A supabase binary is present in the server image." >&2
            exit 1
          fi
          echo "No supabase binary in the running stack."

      # SMD-1801. The three dashboards build from their pinned installs, with no
      # Supabase package among them (check 22 holds the imports; this holds the
      # builds). The two Next dashboards read their env at build time — the
      # gateway URL and a session secret, any values — and are built, not run:
      # they speak to the open-brain-rest gateway, which this stack does not
      # serve (extensions/test-auth.ts starts it). The SvelteKit one speaks MCP
      # to the server this stack serves, so it is driven too, below.
      - name: The three dashboards build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8787
          SESSION_SECRET: build-time-only-0123456789abcdef0123456789
        run: |
          for d in open-brain-dashboard open-brain-dashboard-next open-brain-dashboard-pro; do
            echo "::group::$d"
            # The group closed on failure too, or the rest of the log nests under it.
            if ! ( cd "dashboards/$d" && bun install --frozen-lockfile && bun run build ); then echo "::endgroup::"; exit 1; fi
            echo "::endgroup::"
          done
          ( cd dashboards/open-brain-dashboard && bun run check )

      # The SvelteKit dashboard as a browser uses it, against the stack that is
      # up: a wrong key refused at /signin, the write key signed in and the JSON
      # its first page loads (thought_stats through its proxy) reaching the
      # database, the read key signed in and refused capture — 403 from the
      # proxy, before the server is asked — and the capture-only key refused at
      # sign-in. deploy/.env holds hashes; the raw keys minted above ride in the
      # three OB1_SMOKE_* variables.
      - name: The SvelteKit dashboard, driven against the stack
        working-directory: dashboards/open-brain-dashboard
        env:
          MCP_URL: http://127.0.0.1:8010/
        run: bun smoke.ts --key "$OB1_SMOKE_KEY" --read-key "$OB1_SMOKE_READ_KEY" --capture-key "$OB1_SMOKE_CAPTURE_KEY"

      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose -f compose.yaml logs --tail 60
          echo "--- canary (deploy/canary.sh's project, if it is still up) ---"
          docker compose -p open-brain-canary -f compose.yaml logs --tail 60 || true
          echo "--- provider stub (the runner's listener on :11434) ---"
          cat /tmp/provider-stub.log 2>/dev/null || echo "(no stub log)"

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose -f compose.yaml down -v

  compat-shim:
    name: supabase-js compatibility shim
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: ob1test
          POSTGRES_DB: ob1test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install
        working-directory: compat/supabase-sql
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: compat/supabase-sql
        run: bunx tsc --noEmit

      # 29 files depend on this behaving exactly like supabase-js. A shim that is
      # merely close is worse than none — they would inherit the differences with
      # no failing test to find them.
      - name: Conformance against real Postgres
        working-directory: compat/supabase-sql
        run: bun test-compat.ts
        env:
          DATABASE_URL: postgres://postgres:ob1test@127.0.0.1:5432/ob1test

      # Every migrated file must still parse, and the codemod must round-trip
      # byte-for-byte so a migration is always reversible.
      - name: Migrated files parse
        run: |
          # Read filenames a line at a time, not word-split from $(…) (SC2013),
          # and keep the loop in this shell (not a pipe subshell) so `fail`
          # survives it — process substitution feeds the while (SMD-1808).
          fail=0
          while IFS= read -r f; do
            bun build "$f" --target=bun --external '*' --outfile /dev/null >/dev/null 2>&1 \
              || { echo "does not parse: $f"; fail=1; }
          done < <(grep -rl 'MIGRATED OFF SUPABASE' --include='*.ts' --include='*.mjs' --include='*.js' \
                     --exclude-dir=node_modules --exclude-dir=.git . | grep -v scripts/)
          exit $fail

      - name: Codemod round-trips losslessly
        run: |
          bun scripts/migrate-to-sql-shim.ts --revert >/dev/null
          bun scripts/migrate-to-sql-shim.ts --apply --all >/dev/null
          if ! git diff --quiet; then
            echo "apply→revert→apply is not idempotent:" >&2
            git diff --stat >&2
            exit 1
          fi
          echo "round-trip clean"

  # ── Commit + workflow linting (SMD-1808) ────────────────────────────────────
  # Added as reporting jobs; making them required is SMD-1805's ruleset work.
  commit-lint:
    name: Commit messages
    runs-on: ubuntu-24.04
    # Nothing to lint on a plain push; a PR's own commits — or the queued PR's —
    # are the range, and commitlint ignores the merge commit the queue creates.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: commitlint the pushed range against the house grammar
        env:
          EVENT: ${{ github.event_name }}
          PR_FROM: ${{ github.event.pull_request.base.sha }}
          PR_TO: ${{ github.event.pull_request.head.sha }}
          MG_FROM: ${{ github.event.merge_group.base_sha }}
          MG_TO: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then from="$MG_FROM"; to="$MG_TO"; else from="$PR_FROM"; to="$PR_TO"; fi
          echo "Linting $from..$to"
          bunx --bun @commitlint/cli@19.6.1 --config scripts/commitlint.config.ts --from "$from" --to "$to"

  workflow-lint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned) over the workflows, shellcheck on run bodies
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          # Pinned by version and checksum; ubuntu-24.04 ships shellcheck, which
          # actionlint invokes on every run: body.
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
