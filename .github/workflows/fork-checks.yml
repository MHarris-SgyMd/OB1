          # the last) is refused before anything changes, the coordinator and
          # the stand-ins still running after it.
          printf 'LINEAR_API_KEY=ci-dummy-linear-key\n' >> .env.canary.local
          refused 'LINEAR_API_KEY is set on more than one line' up --no-refresh --no-smoke
          [ -n "$(docker ps -q --filter label=com.docker.compose.project=open-brain-canary --filter label=com.docker.compose.service=coordinator)" ] || { echo "the refused up stopped the coordinator" >&2; exit 1; }
          for retired in sleep board-sync; do
            [ -n "$(docker ps -q --filter label=com.docker.compose.project=open-brain-canary --filter "label=com.docker.compose.service=$retired")" ] || { echo "the refused up stopped the retired $retired stand-in" >&2; exit 1; }
          done
