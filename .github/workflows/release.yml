# The release workflow (SMD-1860): what a tag publishes.
#
# A release is cut on main by scripts/assemble-release.ts — the fragments
# numbered, CHANGELOG.md and releases.json written, FORK_VERSION bumped and a
# schema_version migration added — and named by an annotated tag `v<X.Y.Z>` on
# the cut's merge commit. This workflow runs on that tag and publishes the
# runnable half: the ob1-server and ob1-migrate images to GHCR, tagged with the
# version; a compose overlay pinning the two by digest and Ollama by the digest
# its pinned tag resolved to; and a GitHub release carrying the CHANGELOG
# section, the change files the cut numbered, and the review yield table. The
# stack is brought up from the PULLED images — not the checkout — and held to
# the same lines the `Full stack, no Supabase` job holds a checkout build to,
# plus preflight's schema-version row for the version this release's migrator
# wrote. Nothing publishes if a rule fails: the release object is created last.
#
# The same steps run as a REHEARSAL — on a pull request that touches what it
# builds from, and on workflow_dispatch — with nothing published: the images
# are built on the runner and loaded, the overlay names them by tag alone, the
# stack comes up from them, and the notes and overlay land as a workflow
# artifact. So the shape is exercised before a tag ever is, and a change to a
# Dockerfile or to compose.yaml is judged the way a release would judge it. A
# pull request's rehearsal builds arm64 too when it changes what can build
# differently there, or a few files the ticket listed, or is a release cut,
# and amd64 alone otherwise (SMD-3473, "Whether this rehearsal builds both
# platforms").
#
# scripts/release-artifacts.ts is the reader and renderer; the bash in the
# steps only runs docker and gh. It refuses a tag that does not name
# releases.json's last entry, a FORK_VERSION that was not bumped, a migration
# or a fragment that landed after the cut, a tag off main, and an unpinned
# Ollama.
#
# One thing to check after the first tag, outside this file: the visibility of
# the two GHCR packages. A package a workflow first publishes may be created
# private whatever the repository's visibility; a clean machine's `docker
# compose pull` then wants a login, so flip both to public in the package
# settings if they are not.
#
# Two jobs run it, and their token is all that differs (SMD-2111). The
# REHEARSAL job runs on a pull request and on workflow_dispatch with a token
# that reads the repository and nothing else; the RELEASE job runs on a tag
# push alone, and gets contents and packages write, whatever the repository's
# default workflow permission is. Both call .github/workflows/release-steps.yml,
# which holds the steps once and declares no permissions of its own, so each
# runs with its caller's token. A rehearsal publishes nothing, so it needs no
# write; and a pull request that bumps an action (Dependabot's weekly ones) runs
# the new action in the rehearsal before anyone has read it, with a token that
# can push nothing to GHCR and create no release. Check 23 holds the split: a
# job that grants a write runs only on a push of a named branch or a tag, and a
# called workflow has no other trigger and declares no permissions.
#
# The release job's token runs every action in release-steps.yml with publish
# rights, so each `uses:` is a full commit SHA (the tag in a trailing comment),
# not a tag its owner can move, and the runner image is named; fork-checks.yml's
# header has the rule and what holds it (SMD-2093).
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  pull_request:
    # What the jobs build from, or read: the two Dockerfiles and what they
    # COPY, the compose files, the manifest, the scripts the job runs or
    # imports, this file and the steps it calls. The server image carries
    # mcp-server/ and rest-client/ since SMD-2287 PR 5a, and dashboard/ since
    # SMD-2280.
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-steps.yml"
      - "scripts/release-artifacts.ts"
      - "server-portable/**"
      - "mcp-server/**"
      - "rest-client/**"
      - "dashboard/**"
      - "plugins/**"
      - "scripts/fork-index.ts"
      - "scripts/mechanism-yield.ts"
      - "scripts/commit-grammar.ts"
      - "db/Dockerfile"
      - "db/migrate.ts"
      - "db/cli.ts"
      - "db/connect.ts"
      - "db/login-role.ts"
      - "db/migrations/**"
      - "db/config.mjs"
      - "db/config.d.mts"
      - "db/version.mjs"
      - "db/version.d.mts"
      - ".dockerignore"
      - "deploy/**"
      - "releases.json"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled: a tag's run that stopped half-way
# would leave images published with no release naming them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A pull request's run, or a dispatched one: the token reads, and the steps
  # publish nothing.
  rehearsal:
    name: Rehearsal
    if: github.event_name != 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/release-steps.yml
    with:
      publish: false

  # A tag's run: the push trigger fires on a `v` tag alone, and the condition
  # says so again, since this job's token can publish.
  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # gh release create
      packages: write   # GHCR
    uses: ./.github/workflows/release-steps.yml
    with:
      publish: true
