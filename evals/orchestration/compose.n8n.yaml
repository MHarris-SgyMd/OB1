# n8n as deploy/compose.yaml's `orchestration` profile ships it (SMD-2210),
# beside a throwaway brain. An overlay on that file, which the driver runs with
# `--profile orchestration`:
#
#   bun evals/eval-orchestration.ts --up n8n [--with postgres] [--with sealed]
#
# The profile's own service, image, store, window and switches are what run
# here; nothing below replaces them. SMD-1863's POC ran n8n in a database on
# the brain's Postgres server, the shape the ADR's decision 3 rejects. That
# overlay is in the git history, and its numbers are in evals/README.md.
# Paths are relative to deploy/, the first -f file's directory.

services:
  n8n:
    environment:
      # Pruning cadence only. The window stays the profile's own (24 h, 1,000
      # runs). The P check moves two saved runs' timestamps to either side of
      # the window rather than waiting a day. n8n checks for prunable runs
      # hourly and deletes their data an hour after that. Here each step
      # waits one minute.
      EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL: "1"
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: "1"
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: "0"

  # The import runner as it ships (SMD-2212), given the kit's allowlist in
  # place of the shipped one, which is empty until a recipe is converted.
  # Three pipelines, each its own source (the I check,
  # evals/orchestration/n8n.ts):
  # - `fixture`: a Python emitter over a five-entry export;
  # - `stray`: its third line claims another source, and it must be refused
  #   before anything is written;
  # - `snoop`: an emitter an export has taken over, which must find nothing
  #   to read and leave nothing running.
  orchestration-runner:
    volumes:
      # With the shipped mounts' options, so the kit runs them too (review pass 5).
      - ../evals/orchestration/runner/pipelines.json:/app/deploy/orchestration/pipelines.json:ro,z
      - ../evals/orchestration/runner/emit-fixture.py:/app/evals/orchestration/runner/emit-fixture.py:ro
      - ../evals/orchestration/runner/imports:/imports:ro,z
